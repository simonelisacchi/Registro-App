            <XAxis dataKey="label" tick={{ fontSize: 11, fill: TOKENS.inkSoft, fontFamily: "IBM Plex Mono" }} axisLine={{ stroke: TOKENS.line }} tickLine={false} />
            <YAxis tick={{ fontSize: 11, fill: TOKENS.inkSoft, fontFamily: "IBM Plex Mono" }} axisLine={false} tickLine={false} width={46} />
            <Tooltip formatter={(v) => eur(v)} labelFormatter={(d) => `giorno ${d}`} contentStyle={{ fontFamily: "Inter", fontSize: 12, border: `1px solid ${TOKENS.line}`, borderRadius: 8, background: TOKENS.cardBg, color: TOKENS.ink }} itemStyle={{ color: TOKENS.ink }} labelStyle={{ color: TOKENS.inkSoft }} />
            <Area type="monotone" dataKey="entrate" stroke={TOKENS.accent} fill="url(#gEnt)" strokeWidth={2} />
            <Area type="monotone" dataKey="uscite" stroke={TOKENS.negative} fill="url(#gUsc)" strokeWidth={2} />
          </AreaChart>
        </ResponsiveContainer>
        <div style={{ display: "flex", gap: 16, marginTop: 6, fontSize: 12.5, color: TOKENS.inkSoft }}>
          <LegendDot color={TOKENS.accent} label="entrate (cumulate)" />
          <LegendDot color={TOKENS.negative} label="uscite (cumulate)" />
        </div>
      </div>

      <div style={S.card}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
          <h3 style={S.sectionTitle}>Categorie principali</h3>
          <div style={{ display: "flex", gap: 4 }}>
            {[["mese","mese"],["anno","anno"]].map(([v,l]) => (
              <button key={v} onClick={()=>setCatPeriod(v)} style={{
                fontSize: 11.5, padding: "5px 10px", borderRadius: 999, cursor: "pointer", border: "none",
                background: catPeriod===v?TOKENS.ink:TOKENS.paper2, color: catPeriod===v?TOKENS.paper:TOKENS.inkSoft,
              }}>{l}</button>
            ))}
          </div>
        </div>
        {catData.length === 0 ? (
          <p style={{ color: TOKENS.inkSoft, fontSize: 13.5 }}>Nessuna spesa in questo periodo.</p>
        ) : (
          <div style={{ display: "flex", gap: 20, flexWrap: "wrap", alignItems: "center" }}>
            <ResponsiveContainer width={180} height={180}>
              <PieChart>
                <Pie data={catData} dataKey="value" nameKey="name" innerRadius={48} outerRadius={78} paddingAngle={2}>
                  {catData.map((d, i) => <Cell key={i} fill={d.color} stroke="var(--card-bg)" strokeWidth={1} />)}
                </Pie>
                <Tooltip formatter={(v) => eur(v)} contentStyle={{ fontFamily: "Inter", fontSize: 12, border: `1px solid ${TOKENS.line}`, borderRadius: 8, background: TOKENS.cardBg, color: TOKENS.ink }} itemStyle={{ color: TOKENS.ink }} labelStyle={{ color: TOKENS.inkSoft }} />
              </PieChart>
            </ResponsiveContainer>
            <div style={{ flex: 1, minWidth: 180, display: "flex", flexDirection: "column", gap: 8 }}>
              {catData.map(d => (
                <div key={d.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 13 }}>
                  <span style={{ display: "flex", alignItems: "center", gap: 7 }}>
                    <span style={{ width: 9, height: 9, borderRadius: 3, background: d.color, display: "inline-block" }} />
                    {d.name}
                  </span>
                  <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <DeltaBadge pct={d.deltaPct} />
                    <span style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{eur(d.value)}</span>
                  </span>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>

      <div style={S.card}>
        <h3 style={S.sectionTitle}>Riepilogo mensile</h3>
        <div style={{ display: "flex", flexDirection: "column" }}>
          <div style={{ display: "grid", gridTemplateColumns: "1.3fr 1fr 1fr 1fr", fontSize: 11, letterSpacing: 1, color: TOKENS.inkSoft, fontFamily: "'IBM Plex Mono', monospace", padding: "0 0 8px", borderBottom: `1px solid ${TOKENS.ink}` }}>
            <span>MESE</span><span style={{ textAlign: "right" }}>ENTRATE</span><span style={{ textAlign: "right" }}>USCITE</span><span style={{ textAlign: "right" }}>SALDO</span>
          </div>
          {[...monthly].reverse().map(m => (
            <div key={m.key} style={{ display: "grid", gridTemplateColumns: "1.3fr 1fr 1fr 1fr", fontSize: 13.5, padding: "9px 0", borderBottom: `1px solid ${TOKENS.line}`, fontFamily: "'IBM Plex Mono', monospace" }}>
              <span style={{ fontFamily: "Inter" }}>{m.label}</span>
              <span style={{ textAlign: "right", color: TOKENS.accent }}>{eur(m.entrate)}</span>
              <span style={{ textAlign: "right", color: TOKENS.negative }}>{eur(m.uscite)}</span>
              <span style={{ textAlign: "right", fontWeight: 600, color: m.saldo >= 0 ? TOKENS.accent : TOKENS.negative }}>{eur(m.saldo)}</span>
            </div>
          ))}
        </div>
        {archives.length > 0 && (
          <p style={{ fontSize: 12, color: TOKENS.inkSoft, marginTop: 10 }}>
            Gli anni archiviati ({archives.map(a=>a.year).sort().join(", ")}) non compaiono qui in dettaglio mensile: trovi i loro totali per categoria in Categorie → Confronto per anno.
          </p>
        )}
      </div>
    </>
  );
}

function StatCard({ label, value, tone, icon }) {
  const color = tone === "pos" ? TOKENS.accent : tone === "neg" ? TOKENS.negative : TOKENS.ink;
  return (
    <div style={{ ...S.card, padding: 14 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 6, color: TOKENS.inkSoft, fontSize: 11.5, letterSpacing: 0.5, fontFamily: "'IBM Plex Mono', monospace" }}>
        <span>{icon}</span>{label.toUpperCase()}
      </div>
      <div style={{ fontFamily: "'Fraunces', serif", fontSize: 22, fontWeight: 600, color, marginTop: 4 }}>{value}</div>
    </div>
  );
}
function LegendDot({ color, label }) {
  return <span style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 8, height: 8, background: color, borderRadius: "50%", display: "inline-block" }} />{label}</span>;
}

/* ---------- Analisi ---------- */

function Analisi({ transactions, categories, catMap }) {
  const expenseCats = useMemo(() => categories.filter(c => c.type === "expense"), [categories]);
  const [selectedCatIds, setSelectedCatIds] = useState(() => expenseCats[0] ? [expenseCats[0].id] : []);

  useEffect(() => {
    if (selectedCatIds.length === 0 && expenseCats.length > 0) setSelectedCatIds([expenseCats[0].id]);
  }, [expenseCats]); // eslint-disable-line

  function toggleCat(id) {
    setSelectedCatIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
  }

  const monthsRange = useMemo(() => {
    const y = new Date().getFullYear();
    const keys = [];
    for (let m = 1; m <= 12; m++) keys.push(`${y}-${String(m).padStart(2, "0")}`);
    return keys;
  }, []);

  const trendData = useMemo(() => {
    return monthsRange.map(k => {
      const row = { key: k, label: monthLabel(k) };
      selectedCatIds.forEach(id => {
        row[id] = +transactions
          .filter(t => t.type === "expense" && t.categoryId === id && monthKey(t.date) === k)
          .reduce((s, t) => s + t.amount, 0).toFixed(2);
      });
      return row;
    });
  }, [transactions, selectedCatIds, monthsRange]);

  const now = new Date();
  const year = now.getFullYear(), month0 = now.getMonth(), dayToday = now.getDate();
  const daysInMonth = new Date(year, month0 + 1, 0).getDate();
  const thisMonthKey = `${year}-${String(month0 + 1).padStart(2, "0")}`;
  const [pmY, pmM] = thisMonthKey.split("-").map(Number);
  const prevMonthKey = pmM === 1 ? `${pmY - 1}-12` : `${pmY}-${String(pmM - 1).padStart(2, "0")}`;

  const spesoFinora = useMemo(() =>
    transactions.filter(t => t.type === "expense" && monthKey(t.date) === thisMonthKey).reduce((s, t) => s + t.amount, 0),
  [transactions, thisMonthKey]);

  const spesoMesePrecedenteStessoGiorno = useMemo(() =>
    transactions.filter(t => t.type === "expense" && monthKey(t.date) === prevMonthKey && Number(t.date.slice(8, 10)) <= dayToday).reduce((s, t) => s + t.amount, 0),
  [transactions, prevMonthKey, dayToday]);

  const avgPerDay = spesoFinora / dayToday;
  const proiezione = avgPerDay * daysInMonth;
  const giorniRestanti = daysInMonth - dayToday;
  const deltaVsMesePrecedente = spesoMesePrecedenteStessoGiorno > 0
    ? ((spesoFinora - spesoMesePrecedenteStessoGiorno) / spesoMesePrecedenteStessoGiorno) * 100
    : (spesoFinora > 0 ? Infinity : null);

  const parseLocal = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const expenseTx = useMemo(() => transactions.filter(t => t.type === "expense"), [transactions]);

  const weekdayData = useMemo(() => {
    if (expenseTx.length === 0) return [];
    const dates = expenseTx.map(t => t.date).sort();
    const minD = parseLocal(dates[0]);
    const maxD = parseLocal(dates[dates.length - 1]);
    const totals = [0,0,0,0,0,0,0];
    const counts = [0,0,0,0,0,0,0];
    expenseTx.forEach(t => { totals[parseLocal(t.date).getDay()] += t.amount; });
    for (let d = new Date(minD); d <= maxD; d.setDate(d.getDate() + 1)) {
      counts[d.getDay()]++;
    }
    const labels = ["Dom","Lun","Mar","Mer","Gio","Ven","Sab"];
    const order = [1,2,3,4,5,6,0];
    return order.map(idx => ({
      day: labels[idx], value: counts[idx] > 0 ? +(totals[idx] / counts[idx]).toFixed(2) : 0, isWeekend: idx === 0 || idx === 6,
    }));
  }, [expenseTx]);

  // Spese anomale: per ogni categoria con almeno 4 transazioni, segnala quelle nettamente sopra
  // il valore tipico (la mediana) della categoria. Uso mediana + scarto assoluto mediano (MAD)
  // invece di media + deviazione standard: un singolo valore molto estremo "gonfia" media e
  // deviazione standard al punto da rendersi quasi invisibile alla soglia — la mediana no.
  const anomalies = useMemo(() => {
    const median = (arr) => {
      const s = [...arr].sort((a, b) => a - b);
      const mid = Math.floor(s.length / 2);
      return s.length % 2 !== 0 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
    };
    const byCat = {};
    expenseTx.forEach(t => { (byCat[t.categoryId] = byCat[t.categoryId] || []).push(t); });
    const flagged = [];
    Object.entries(byCat).forEach(([catId, txs]) => {
      if (txs.length < 4) return;
      const amounts = txs.map(t => t.amount);
      const med = median(amounts);
      const mad = median(amounts.map(a => Math.abs(a - med)));
      txs.forEach(t => {
        if (t.amount <= med) return;
        const isAnomaly = mad === 0
          ? (t.amount > med * 1.5 && (t.amount - med) > 1)
          : (0.6745 * (t.amount - med) / mad) > 3.5;
        if (isAnomaly) flagged.push({ ...t, mean: med, multiple: med > 0 ? t.amount / med : null });
      });
    });
    return flagged.sort((a, b) => (b.multiple || 0) - (a.multiple || 0)).slice(0, 8);
  }, [expenseTx]);

  // Ricorrenze: transazioni con stessa categoria e importo simile (± 0,50€) che tornano in
  // mesi diversi. Richiede almeno 3 mesi distinti e presenza in almeno metà dei mesi coperti,
  // per distinguere un vero abbonamento da coincidenze sporadiche.
  const recurring = useMemo(() => {
    const groups = {};
    expenseTx.forEach(t => {
      const bucket = Math.round(t.amount * 2) / 2;
      const key = t.categoryId + "|" + bucket;
      if (!groups[key]) groups[key] = { catId: t.categoryId, bucket, byMonth: {} };
      const mk = monthKey(t.date);
      if (!groups[key].byMonth[mk] || t.date > groups[key].byMonth[mk].date) groups[key].byMonth[mk] = t;
    });
    const results = [];
    Object.values(groups).forEach(g => {
      const months = Object.keys(g.byMonth).sort();
      if (months.length < 3) return;
      const [fy, fm] = months[0].split("-").map(Number);
      const [ly, lm] = months[months.length - 1].split("-").map(Number);
      const span = (ly - fy) * 12 + (lm - fm) + 1;
      const confidence = months.length / span;
      if (confidence < 0.5) return;
      results.push({
        catId: g.catId, amount: g.bucket, count: months.length,
        firstMonth: months[0], lastMonth: months[months.length - 1],
        annualEstimate: g.bucket * 12,
      });
    });
    return results.sort((a, b) => b.amount - a.amount);
  }, [expenseTx]);

  return (
    <>
      <div style={S.card}>
        <h3 style={S.sectionTitle}>Andamento categorie · {new Date().getFullYear()}</h3>
        {expenseCats.length === 0 ? (
          <p style={{ color: TOKENS.inkSoft, fontSize: 13.5 }}>Crea prima qualche categoria di spesa.</p>
        ) : (
          <>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 14 }}>
              {expenseCats.map(c => {
                const active = selectedCatIds.includes(c.id);
                return (
                  <button key={c.id} onClick={() => toggleCat(c.id)} style={{
                    display: "flex", alignItems: "center", gap: 5, border: `1px solid ${active ? c.color : TOKENS.line}`,
                    background: active ? c.color + "22" : "transparent", color: active ? c.color : TOKENS.inkSoft,
                    borderRadius: 999, padding: "5px 10px", fontSize: 12.5, cursor: "pointer",
                  }}>
                    <span>{c.icon}</span>{c.name}
                  </button>
                );
              })}
            </div>
            {selectedCatIds.length === 0 ? (
              <p style={{ color: TOKENS.inkSoft, fontSize: 13.5 }}>Scegli almeno una categoria da confrontare.</p>
            ) : (
              <>
                <ResponsiveContainer width="100%" height={200}>
                  <LineChart data={trendData} margin={{ left: -18, top: 6, right: 6 }}>
                    <CartesianGrid stroke={TOKENS.line} vertical={false} />
                    <XAxis dataKey="label" tick={{ fontSize: 10, fill: TOKENS.inkSoft, fontFamily: "IBM Plex Mono" }} axisLine={{ stroke: TOKENS.line }} tickLine={false} interval={1} />
                    <YAxis tick={{ fontSize: 11, fill: TOKENS.inkSoft, fontFamily: "IBM Plex Mono" }} axisLine={false} tickLine={false} width={46} />
                    <Tooltip formatter={(v, name) => [eur(v), catMap[name]?.name || name]} contentStyle={{ fontFamily: "Inter", fontSize: 12, border: `1px solid ${TOKENS.line}`, borderRadius: 8, background: TOKENS.cardBg, color: TOKENS.ink }} itemStyle={{ color: TOKENS.ink }} labelStyle={{ color: TOKENS.inkSoft }} />
                    {selectedCatIds.map(id => (
                      <Line key={id} type="monotone" dataKey={id} stroke={catMap[id]?.color || TOKENS.negative} strokeWidth={2} dot={false} />
                    ))}
                  </LineChart>
                </ResponsiveContainer>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 14, marginTop: 8 }}>
                  {selectedCatIds.map(id => <LegendDot key={id} color={catMap[id]?.color || TOKENS.negative} label={catMap[id]?.name || id} />)}
                </div>
              </>
            )}
          </>
        )}
      </div>

      <div style={S.card}>
        <h3 style={S.sectionTitle}>Proiezione fine mese</h3>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(130px,1fr))", gap: 12 }}>
          <StatCard label="Speso finora" value={eur(spesoFinora)} tone="neg" icon="↘" />
          <StatCard label="Media giornaliera" value={eur(avgPerDay)} icon="◆" />
          <StatCard label="Proiezione fine mese" value={eur(proiezione)} tone="neg" icon="◆" />
        </div>
        <p style={{ fontSize: 12.5, color: TOKENS.inkSoft, marginTop: 12, display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
          Mancano {giorniRestanti} {giorniRestanti === 1 ? "giorno" : "giorni"} alla fine del mese.
          {deltaVsMesePrecedente !== null && (
            <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
              Rispetto allo stesso punto del mese scorso: <DeltaBadge pct={deltaVsMesePrecedente} />
            </span>
          )}
        </p>
      </div>

      <div style={S.card}>
        <h3 style={S.sectionTitle}>Spesa media per giorno della settimana</h3>
        {weekdayData.length === 0 ? (
          <p style={{ color: TOKENS.inkSoft, fontSize: 13.5 }}>Non ci sono ancora abbastanza transazioni.</p>
        ) : (
          <>
            <ResponsiveContainer width="100%" height={180}>
              <BarChart data={weekdayData} margin={{ left: -18, top: 6, right: 6 }}>
                <CartesianGrid stroke={TOKENS.line} vertical={false} />
                <XAxis dataKey="day" tick={{ fontSize: 11, fill: TOKENS.inkSoft, fontFamily: "IBM Plex Mono" }} axisLine={{ stroke: TOKENS.line }} tickLine={false} />
                <YAxis tick={{ fontSize: 11, fill: TOKENS.inkSoft, fontFamily: "IBM Plex Mono" }} axisLine={false} tickLine={false} width={46} />
                <Tooltip formatter={(v) => eur(v)} contentStyle={{ fontFamily: "Inter", fontSize: 12, border: `1px solid ${TOKENS.line}`, borderRadius: 8, background: TOKENS.cardBg, color: TOKENS.ink }} itemStyle={{ color: TOKENS.ink }} labelStyle={{ color: TOKENS.inkSoft }} />
                <Bar dataKey="value" radius={[4,4,0,0]}>
                  {weekdayData.map((d, i) => <Cell key={i} fill={d.isWeekend ? TOKENS.amber : TOKENS.negative} />)}
                </Bar>
              </BarChart>
            </ResponsiveContainer>
            <div style={{ display: "flex", gap: 16, marginTop: 6, fontSize: 12.5, color: TOKENS.inkSoft }}>
              <LegendDot color={TOKENS.negative} label="feriali" />
              <LegendDot color={TOKENS.amber} label="weekend" />
            </div>
            {expenseTx.length < 14 && (
              <p style={{ fontSize: 12, color: TOKENS.inkSoft, marginTop: 10 }}>Con poche transazioni storiche il pattern è ancora indicativo — diventa più affidabile con più dati.</p>
            )}
          </>
        )}
      </div>

      <div style={S.card}>
        <h3 style={S.sectionTitle}>Spese fuori dal solito</h3>
        {anomalies.length === 0 ? (
          <p style={{ color: TOKENS.inkSoft, fontSize: 13.5 }}>Nessuna spesa fuori dal solito individuata finora — bene così.</p>
        ) : (
          <>
            <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
              {anomalies.map((t, i) => {
                const c = catMap[t.categoryId];
                return (
                  <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 4px", borderBottom: i === anomalies.length - 1 ? "none" : `1px solid ${TOKENS.line}` }}>
                    <span style={{ fontSize: 18 }}>{c?.icon || "🏷️"}</span>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 13.5 }}>{c?.name || "—"}</div>
                      <div style={{ fontSize: 11.5, color: TOKENS.inkSoft }}>{new Date(t.date).toLocaleDateString("it-IT", { day: "numeric", month: "short" })} · valore tipico categoria {eur(t.mean)}</div>
                    </div>
                    <div style={{ textAlign: "right" }}>
                      <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 14, color: TOKENS.negative }}>{eur(t.amount)}</div>
                      <div style={{ fontSize: 11, color: TOKENS.negative }}>{t.multiple != null ? t.multiple.toFixed(1) + "×" : ""}</div>
                    </div>
                  </div>
                );
              })}
            </div>
            <p style={{ fontSize: 12, color: TOKENS.inkSoft, marginTop: 10 }}>Segnalate le spese nettamente sopra il valore tipico della propria categoria, con un calcolo che non si lascia ingannare da un singolo valore estremo (richiede almeno 4 transazioni in quella categoria).</p>
          </>
        )}
      </div>

      <div style={S.card}>
        <h3 style={S.sectionTitle}>Ricorrenze rilevate</h3>
        {recurring.length === 0 ? (
          <p style={{ color: TOKENS.inkSoft, fontSize: 13.5 }}>Nessuna spesa ricorrente individuata finora — servono almeno 3 mesi di storico per una stessa categoria/importo.</p>
        ) : (
          <>
            <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
              {recurring.map((r, i) => {
                const c = catMap[r.catId];
                return (
                  <div key={r.catId + r.amount} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 4px", borderBottom: i === recurring.length - 1 ? "none" : `1px solid ${TOKENS.line}` }}>
                    <span style={{ fontSize: 18 }}>{c?.icon || "🏷️"}</span>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 13.5 }}>{c?.name || "—"}</div>
                      <div style={{ fontSize: 11.5, color: TOKENS.inkSoft }}>rilevata {r.count} volte · {monthLabel(r.firstMonth)} → {monthLabel(r.lastMonth)}</div>
                    </div>
                    <div style={{ textAlign: "right" }}>
                      <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 14 }}>{eur(r.amount)}/mese</div>
                      <div style={{ fontSize: 11, color: TOKENS.inkSoft }}>≈ {eur(r.annualEstimate)}/anno</div>
                    </div>
                  </div>
                );
              })}
            </div>
            <p style={{ fontSize: 12, color: TOKENS.inkSoft, marginTop: 10 }}>Individuate cercando stessa categoria e importo simile (±0,50€) presenti in almeno 3 mesi diversi, per almeno metà dei mesi coperti.</p>
          </>
        )}
      </div>
    </>
  );
}

/* ---------- Transazioni ---------- */

function Transazioni({ transactions, categories, catMap, onAdd, onRemove, onUpdate, existingTrips }) {
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [confirmId, setConfirmId] = useState(null);
  const [filterType, setFilterType] = useState("all");
  const [filterCat, setFilterCat] = useState("all");
  const [filterTrip, setFilterTrip] = useState("all");
  const [search, setSearch] = useState("");

  const editingTx = editingId ? transactions.find(t => t.id === editingId) : null;

  const filtered = transactions.filter(t =>
    (filterType === "all" || t.type === filterType) &&
    (filterCat === "all" || t.categoryId === filterCat) &&
    (filterTrip === "all" || t.trip === filterTrip) &&
    (search.trim() === "" || (t.note || "").toLowerCase().includes(search.trim().toLowerCase()))
  );
  const sorted = useMemo(() => [...filtered].sort((a, b) => b.date.localeCompare(a.date)), [filtered]);

  const tripTotal = filterTrip !== "all" ? filtered.reduce((s, t) => s + (t.type === "income" ? t.amount : -t.amount), 0) : null;

  return (
    <>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", flex: 1, minWidth: 0 }}>
          <SelectPill value={filterType} onChange={setFilterType} options={[["all","Tutte"],["income","Entrate"],["expense","Uscite"]]} />
          <select value={filterCat} onChange={e=>setFilterCat(e.target.value)} style={pillSelectStyle}>
            <option value="all">Tutte le categorie</option>
            {categories.map(c => <option key={c.id} value={c.id}>{c.icon} {c.name}</option>)}
          </select>
          {existingTrips.length > 0 && (
            <select value={filterTrip} onChange={e=>setFilterTrip(e.target.value)} style={pillSelectStyle}>
              <option value="all">Tutti i viaggi</option>
              {existingTrips.map(t => <option key={t} value={t}>✈️ {t}</option>)}
            </select>
          )}
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Cerca nelle note…" style={{ ...pillSelectStyle, flex: 1, minWidth: 120 }} />
        </div>
        <button onClick={()=>{ setShowForm(s=>!s); setEditingId(null); }} style={btnPrimary}>
          <span>{showForm ? "✕" : "+"}</span> {showForm ? "Chiudi" : "Nuova"}
        </button>
      </div>

      {tripTotal !== null && (
        <div style={{ ...S.card, padding: "12px 16px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span style={{ fontSize: 13.5 }}>✈️ Totale "{filterTrip}"</span>
          <span style={{ fontFamily: "'Fraunces', serif", fontSize: 19, fontWeight: 600, color: tripTotal >= 0 ? TOKENS.accent : TOKENS.negative }}>{eur(tripTotal)}</span>
        </div>
      )}

      {showForm && <TxForm categories={categories} existingTrips={existingTrips} onSubmit={(tx)=>{ onAdd(tx); setShowForm(false); }} />}
      {editingTx && <TxForm categories={categories} existingTrips={existingTrips} initial={editingTx} onSubmit={(patch)=>{ onUpdate(editingTx.id, patch); setEditingId(null); }} onCancel={()=>setEditingId(null)} />}

      <div style={{ ...S.card, padding: 0, overflow: "hidden" }}>
        {sorted.length === 0 ? (
          <p style={{ color: TOKENS.inkSoft, fontSize: 13.5, padding: 18, margin: 0 }}>Nessuna transazione trovata.</p>
        ) : sorted.map((t, i) => {
          const c = catMap[t.categoryId];
          return (
            <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 16px", borderBottom: i === sorted.length-1 ? "none" : `1px solid ${TOKENS.line}` }}>
              <div style={{ width: 34, height: 34, borderRadius: 8, background: (c?.color||"#999")+"22", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16, flexShrink: 0 }}>{c?.icon || "•"}</div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 14, fontWeight: 500, display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                  {c?.name || "Senza categoria"}
                  {t.trip && <span style={{ fontSize: 10.5, fontFamily: "'IBM Plex Mono', monospace", color: TOKENS.amber, background: TOKENS.amberSoft, padding: "1px 6px", borderRadius: 999 }}>✈️ {t.trip}</span>}
                </div>
                <div style={{ fontSize: 12, color: TOKENS.inkSoft, fontFamily: "'IBM Plex Mono', monospace" }}>
                  {new Date(t.date).toLocaleDateString("it-IT", { day: "2-digit", month: "short", year: "numeric" })}
                  {t.note ? ` · ${t.note}` : ""}
                </div>
              </div>
              <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontWeight: 600, fontSize: 14.5, color: t.type === "income" ? TOKENS.accent : TOKENS.negative, whiteSpace: "nowrap" }}>
                {t.type === "income" ? "+" : "−"}{eur(t.amount)}
              </div>
              <button onClick={() => { setEditingId(t.id); setShowForm(false); }}
                style={{ border: "none", background: "transparent", color: TOKENS.inkSoft, borderRadius: 6, padding: "6px 6px", cursor: "pointer", fontSize: 13, flexShrink: 0 }}>
                ✎
              </button>
              <button onClick={() => confirmId === t.id ? (onRemove(t.id), setConfirmId(null)) : setConfirmId(t.id)}
                style={{ border: "none", background: confirmId === t.id ? TOKENS.negative : "transparent", color: confirmId === t.id ? TOKENS.paper : TOKENS.inkSoft, borderRadius: 6, padding: "6px 8px", cursor: "pointer", fontSize: 11, display: "flex", alignItems: "center", gap: 4, flexShrink: 0 }}>
                <span>🗑</span>{confirmId === t.id ? "conferma" : ""}
              </button>
            </div>
          );
        })}
      </div>
    </>
  );
}

function TxForm({ categories, onSubmit, initial, onCancel, existingTrips = [] }) {
  const [type, setType] = useState(initial?.type || "expense");
  const [amount, setAmount] = useState(initial ? String(initial.amount) : "");
  const [categoryId, setCategoryId] = useState(initial?.categoryId || (categories.find(c => c.type === (initial?.type || "expense"))?.id || ""));
  const [date, setDate] = useState(initial?.date || todayISO());
  const [note, setNote] = useState(initial?.note || "");
  const [trip, setTrip] = useState(initial?.trip || "");
  const opts = categories.filter(c => c.type === type);
  const firstRun = useRef(true);

  useEffect(() => {
    if (firstRun.current) { firstRun.current = false; return; }
    setCategoryId(opts[0]?.id || "");
  }, [type]); // eslint-disable-line

  function submit(e) {
    e.preventDefault();
    const n = parseFloat(String(amount).replace(",", "."));
    if (!n || n <= 0 || !categoryId) return;
    onSubmit({ type, amount: n, categoryId, date, note: note.trim(), trip: trip.trim() });
  }

  return (
    <form onSubmit={submit} style={{ ...S.card, display: "flex", flexDirection: "column", gap: 12 }}>
      <div style={{ display: "flex", gap: 6 }}>
        {[["expense","Uscita"],["income","Entrata"]].map(([v,l]) => (
          <button type="button" key={v} onClick={()=>setType(v)} style={{
            flex: 1, padding: "9px 0", borderRadius: 8, cursor: "pointer", fontSize: 13.5, fontWeight: 500, border: "none",
            background: type===v ? (v==="income"?TOKENS.accentSoft:TOKENS.negativeSoft) : TOKENS.paper2,
            color: type===v ? (v==="income"?TOKENS.accent:TOKENS.negative) : TOKENS.inkSoft,
          }}>{l}</button>
        ))}
      </div>
      <div className="grid-2" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        <Field label="Importo (€)"><input required type="number" step="0.01" min="0" value={amount} onChange={e=>setAmount(e.target.value)} placeholder="0.00" style={inputStyle} /></Field>
        <Field label="Data"><input type="date" value={date} onChange={e=>setDate(e.target.value)} style={inputStyle} /></Field>
      </div>
      <Field label="Categoria">
        <select value={categoryId} onChange={e=>setCategoryId(e.target.value)} style={inputStyle}>
          {opts.map(c => <option key={c.id} value={c.id}>{c.icon} {c.name}</option>)}
        </select>
      </Field>
      <Field label="Nota (opzionale)"><input value={note} onChange={e=>setNote(e.target.value)} placeholder="es. cena con amici" style={inputStyle} /></Field>
      <Field label="Viaggio (opzionale)">
        <input value={trip} onChange={e=>setTrip(e.target.value)} placeholder="es. Grecia 2026" list="trip-tags-list" style={inputStyle} />
        <datalist id="trip-tags-list">
          {existingTrips.map(t => <option key={t} value={t} />)}
        </datalist>
      </Field>
      <div style={{ display: "flex", gap: 8 }}>
        <button type="submit" style={{ ...btnPrimary, justifyContent: "center", flex: 1 }}><span>✓</span> {initial ? "Salva modifiche" : "Salva transazione"}</button>
        {initial && <button type="button" onClick={onCancel} style={{ ...btnPrimary, background: TOKENS.paper2, color: TOKENS.ink }}>Annulla</button>}
      </div>
    </form>
  );
}

/* ---------- Categorie ---------- */

function Categorie({ categories, transactions, archives, onAdd, onUpdate, onRemove, onCloseYear, onEditArchiveIncome }) {
  const [showForm, setShowForm] = useState(false);
  const [confirmId, setConfirmId] = useState(null);
  const [yearToClose, setYearToClose] = useState("");
  const [yearToFix, setYearToFix] = useState("");
  const [incomeFix, setIncomeFix] = useState("");
  const [openCloseYear, setOpenCloseYear] = useState(false);
  const [openFixIncome, setOpenFixIncome] = useState(false);

  const liveYears = useMemo(() => {
    const ys = new Set(transactions.map(t => t.date.slice(0, 4)));
    ys.add(String(new Date().getFullYear()));
    return Array.from(ys);
  }, [transactions]);
  const archivedYearSet = useMemo(() => new Set(archives.map(a => a.year)), [archives]);
  const years = useMemo(() => Array.from(new Set([...liveYears, ...archivedYearSet])).sort().reverse(), [liveYears, archivedYearSet]);

  const rows = useMemo(() => {
    const currentExpenseIds = new Set(categories.filter(c => c.type === "expense").map(c => c.id));
    const allIds = new Set(currentExpenseIds);
    archives.forEach(a => Object.keys(a.categoryTotals || {}).forEach(id => allIds.add(id)));
    return Array.from(allIds).map(id => {
      const live = categories.find(c => c.id === id);
      let fallback = null;
      archives.forEach(a => { if (a.categoryNames && a.categoryNames[id]) fallback = a.categoryNames[id]; });
      return { id, name: live?.name || fallback?.name || "Categoria eliminata", icon: live?.icon || fallback?.icon || "🗂️" };
    });
  }, [categories, archives]);

  function cellValue(rowId, year) {
    if (archivedYearSet.has(year)) {
      const a = archives.find(x => x.year === year);
      return (a && a.categoryTotals[rowId]) || 0;
    }
    return transactions.filter(t => t.categoryId === rowId && t.type === "expense" && t.date.slice(0, 4) === year).reduce((s, t) => s + t.amount, 0);
  }
  function yearTotal(year) {
    if (archivedYearSet.has(year)) {
      const a = archives.find(x => x.year === year);
      return a ? a.totalExpense : 0;
    }
    return transactions.filter(t => t.type === "expense" && t.date.slice(0, 4) === year).reduce((s, t) => s + t.amount, 0);
  }

  const closableYears = liveYears.filter(y => transactions.some(t => t.date.slice(0,4) === y)).sort().reverse();

  return (
    <>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <h3 style={S.sectionTitle}>Le tue categorie</h3>
        <button onClick={()=>setShowForm(s=>!s)} style={btnPrimary}><span>{showForm ? "✕" : "+"}</span> {showForm ? "Chiudi" : "Nuova"}</button>
      </div>
      <p style={{ color: TOKENS.inkSoft, fontSize: 12.5, margin: "-10px 0 4px" }}>Imposta un budget mensile sulle categorie di spesa per ricevere un avviso automatico in dashboard quando ti avvicini al limite.</p>

      {showForm && <CatForm onSubmit={(c)=>{ onAdd(c); setShowForm(false); }} />}

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(170px,1fr))", gap: 8 }}>
        {categories.map(c => (
          <div key={c.id} style={{ ...S.card, padding: 10, display: "flex", flexDirection: "column", gap: 6 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 18 }}>{c.icon}</span>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 13, fontWeight: 500, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{c.name}</div>
                <div style={{ fontSize: 10.5, color: TOKENS.inkSoft, fontFamily: "'IBM Plex Mono', monospace" }}>{c.type === "income" ? "entrata" : "uscita"}</div>
              </div>
              <button onClick={() => confirmId === c.id ? (onRemove(c.id), setConfirmId(null)) : setConfirmId(c.id)}
                style={{ border: "none", background: "transparent", color: confirmId === c.id ? TOKENS.negative : TOKENS.line, cursor: "pointer", flexShrink: 0 }}>
                🗑
              </button>
            </div>
            {c.type === "expense" && (
              <input type="number" min="0" placeholder="budget mensile €" value={c.budget || ""} onChange={e=>onUpdate(c.id, { budget: parseFloat(e.target.value) || 0 })}
                style={{ ...inputStyle, padding: "5px 8px" }} />
            )}
          </div>
        ))}
      </div>

      <div style={S.card}>
        <h3 style={S.sectionTitle}>Confronto per anno</h3>
        <div style={{ overflowX: "auto" }}>
          <div style={{ minWidth: Math.max(340, 128 + years.length * 88) }}>
            <div style={{ display: "grid", gridTemplateColumns: `1.4fr repeat(${years.length}, 1fr)`, fontSize: 11, letterSpacing: 1, color: TOKENS.inkSoft, fontFamily: "'IBM Plex Mono', monospace", padding: "0 0 8px", borderBottom: `1px solid ${TOKENS.ink}` }}>
              <span>CATEGORIA</span>
              {years.map(y => <span key={y} style={{ textAlign: "right" }}>{y}{archivedYearSet.has(y) ? " 🔒" : ""}</span>)}
            </div>
            {rows.map(row => (
              <div key={row.id} style={{ display: "grid", gridTemplateColumns: `1.4fr repeat(${years.length}, 1fr)`, fontSize: 13, padding: "8px 0", borderBottom: `1px solid ${TOKENS.line}` }}>
                <span>{row.icon} {row.name}</span>
                {years.map(y => {
                  const v = cellValue(row.id, y);
                  return <span key={y} style={{ textAlign: "right", fontFamily: "'IBM Plex Mono', monospace", color: v ? TOKENS.ink : TOKENS.line }}>{v ? eur(v) : "—"}</span>;
                })}
              </div>
            ))}
            <div style={{ display: "grid", gridTemplateColumns: `1.4fr repeat(${years.length}, 1fr)`, fontSize: 13.5, fontWeight: 600, padding: "10px 0 0" }}>
              <span>Totale spese</span>
              {years.map(y => <span key={y} style={{ textAlign: "right", fontFamily: "'IBM Plex Mono', monospace", color: TOKENS.negative }}>{eur(yearTotal(y))}</span>)}
            </div>
          </div>
        </div>
        {archives.length > 0 && <p style={{ fontSize: 11.5, color: TOKENS.inkSoft, marginTop: 10 }}>🔒 = anno archiviato: le transazioni di dettaglio sono state eliminate, resta solo il totale per categoria.</p>}
      </div>

      <div style={S.card}>
        <button onClick={()=>setOpenCloseYear(o=>!o)} style={{ width: "100%", display: "flex", justifyContent: "space-between", alignItems: "center", background: "none", border: "none", cursor: "pointer", padding: 0 }}>
          <h3 style={{ ...S.sectionTitle, margin: 0 }}>Chiudi un anno</h3>
          <span style={{ transform: openCloseYear ? "rotate(180deg)" : "none", transition: "transform .2s", color: TOKENS.inkSoft, display: "inline-block" }}>▾</span>
        </button>
        {openCloseYear && (
          <div style={{ marginTop: 14 }}>
            <p style={{ color: TOKENS.inkSoft, fontSize: 13.5, lineHeight: 1.6, margin: "0 0 12px" }}>
              Gli anni ormai passati vengono chiusi da soli al primo avvio dell'app nell'anno nuovo: Registro calcola il totale per categoria (la tabella qui sopra), lo conserva per sempre, e cancella le singole transazioni per non appesantire l'app e il foglio di backup. Da qui puoi anche chiudere manualmente un anno in anticipo, se vuoi.
            </p>
            {closableYears.length === 0 ? (
              <p style={{ color: TOKENS.inkSoft, fontSize: 13.5 }}>Non ci sono anni con transazioni da chiudere al momento.</p>
            ) : (
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
                <select value={yearToClose} onChange={e=>setYearToClose(e.target.value)} style={inputStyle}>
                  <option value="">Scegli l'anno…</option>
                  {closableYears.map(y => <option key={y} value={y}>{y}{y === String(new Date().getFullYear()) ? " (in corso)" : ""}</option>)}
                </select>
                <button onClick={()=>{ if(yearToClose){ onCloseYear(yearToClose); setYearToClose(""); } }} disabled={!yearToClose}
                  style={{ ...btnPrimary, background: TOKENS.negative }}>
                  🔒 Chiudi e archivia
                </button>
              </div>
            )}
          </div>
        )}
      </div>

      {archives.length > 0 && (
        <div style={S.card}>
          <button onClick={()=>setOpenFixIncome(o=>!o)} style={{ width: "100%", display: "flex", justifyContent: "space-between", alignItems: "center", background: "none", border: "none", cursor: "pointer", padding: 0 }}>
            <h3 style={{ ...S.sectionTitle, margin: 0 }}>Correggi le entrate di un anno archiviato</h3>
            <span style={{ transform: openFixIncome ? "rotate(180deg)" : "none", transition: "transform .2s", color: TOKENS.inkSoft, display: "inline-block" }}>▾</span>
          </button>
          {openFixIncome && (
            <div style={{ marginTop: 14 }}>
              <p style={{ color: TOKENS.inkSoft, fontSize: 13.5, lineHeight: 1.6, margin: "0 0 12px" }}>
                Per gli anni chiusi prima di questa versione, o importati da un'altra fonte, le entrate potrebbero mancare (impostate a zero) — cosa che rende il saldo totale in alto poco preciso. Se conosci l'entrata reale di quell'anno, correggila qui.
              </p>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
                <select value={yearToFix} onChange={e=>{ setYearToFix(e.target.value); const a = archives.find(x=>x.year===e.target.value); setIncomeFix(a ? String(a.totalIncome || "") : ""); }} style={inputStyle}>
                  <option value="">Scegli l'anno…</option>
                  {archives.map(a => <option key={a.year} value={a.year}>{a.year} (entrate attuali: {eur(a.totalIncome || 0)})</option>)}
                </select>
                <input type="number" min="0" step="0.01" value={incomeFix} onChange={e=>setIncomeFix(e.target.value)} placeholder="entrate reali €" style={{ ...inputStyle, maxWidth: 160 }} disabled={!yearToFix} />
                <button onClick={()=>{ if(yearToFix){ onEditArchiveIncome(yearToFix, parseFloat(incomeFix) || 0); setYearToFix(""); setIncomeFix(""); } }} disabled={!yearToFix}
                  style={btnPrimary}>
                  <span>✓</span> Salva
                </button>
              </div>
            </div>
          )}
        </div>
      )}
    </>
  );
}

/* ---------- Risparmi ---------- */

function Risparmi({ savings, onAdd, onRemove }) {
  const [showForm, setShowForm] = useState(false);
  const [confirmId, setConfirmId] = useState(null);
  const [adjusting, setAdjusting] = useState(false);
  const [adjustValue, setAdjustValue] = useState("");

  const total = savings.reduce((s, m) => s + (m.type === "prelievo" ? -m.amount : m.amount), 0);

  function submitAdjust(e) {
    e.preventDefault();
    const target = parseFloat(String(adjustValue).replace(",", "."));
    if (isNaN(target)) return;
    const diff = +(target - total).toFixed(2);
    if (diff === 0) { setAdjusting(false); setAdjustValue(""); return; }
    onAdd({ type: diff > 0 ? "versamento" : "prelievo", amount: Math.abs(diff), date: todayISO(), note: "Rettifica saldo (es. arrotondamenti)" });
    setAdjusting(false); setAdjustValue("");
  }

  const sorted = useMemo(() => [...savings].sort((a, b) => a.date.localeCompare(b.date)), [savings]);
  const chartData = useMemo(() => {
    let running = 0;
    return sorted.map(m => {
      running += m.type === "prelievo" ? -m.amount : m.amount;
      return { date: m.date, label: new Date(m.date).toLocaleDateString("it-IT", { day: "2-digit", month: "short" }), value: +running.toFixed(2) };
    });
  }, [sorted]);

  return (
    <>
      <div style={S.card}>
        <p style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 1.5, color: TOKENS.amber, margin: "0 0 4px" }}>RISPARMI</p>
        <div style={{ fontFamily: "'Fraunces', serif", fontSize: 30, fontWeight: 600, color: TOKENS.accent }}>{eur(total)}</div>
        <p style={{ color: TOKENS.inkSoft, fontSize: 12.5, margin: "4px 0 0", lineHeight: 1.5 }}>
          Aggiornato a mano — utile per arrotondamenti, interessi o versamenti su un fondo separato (es. il "salvadanaio" di un conto), tenuto distinto dalle spese normali.
        </p>
        {!adjusting ? (
          <button onClick={()=>{ setAdjusting(true); setAdjustValue(total.toFixed(2)); }} style={{ ...btnPrimary, background: TOKENS.paper2, color: TOKENS.ink, marginTop: 12 }}>
            <span>⚖️</span> Aggiusta saldo
          </button>
        ) : (
          <form onSubmit={submitAdjust} style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 12, flexWrap: "wrap" }}>
            <Field label="Saldo reale attuale (€)">
              <input type="number" step="0.01" value={adjustValue} onChange={e=>setAdjustValue(e.target.value)} style={{ ...inputStyle, maxWidth: 160 }} autoFocus />
            </Field>
            <button type="submit" style={btnPrimary}><span>✓</span> Applica</button>
            <button type="button" onClick={()=>{ setAdjusting(false); setAdjustValue(""); }} style={{ ...btnPrimary, background: TOKENS.paper2, color: TOKENS.ink }}>Annulla</button>
          </form>
        )}
      </div>

      {chartData.length >= 2 && (
        <div style={S.card}>
          <h3 style={S.sectionTitle}>Andamento</h3>
          <ResponsiveContainer width="100%" height={180}>
            <AreaChart data={chartData} margin={{ top: 4, right: 4, left: -18, bottom: 0 }}>
              <defs>
                <linearGradient id="gSav" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="5%" stopColor={TOKENS.accent} stopOpacity={0.35}/>
                  <stop offset="95%" stopColor={TOKENS.accent} stopOpacity={0}/>
                </linearGradient>
              </defs>
              <CartesianGrid stroke={TOKENS.line} vertical={false} />
              <XAxis dataKey="label" tick={{ fontSize: 11, fill: TOKENS.inkSoft, fontFamily: "IBM Plex Mono" }} axisLine={{ stroke: TOKENS.line }} tickLine={false} />
              <YAxis tick={{ fontSize: 11, fill: TOKENS.inkSoft, fontFamily: "IBM Plex Mono" }} axisLine={false} tickLine={false} width={46} />
              <Tooltip formatter={(v) => eur(v)} contentStyle={{ fontFamily: "Inter", fontSize: 12, border: `1px solid ${TOKENS.line}`, borderRadius: 8, background: TOKENS.cardBg, color: TOKENS.ink }} itemStyle={{ color: TOKENS.ink }} labelStyle={{ color: TOKENS.inkSoft }} />
              <Area type="monotone" dataKey="value" stroke={TOKENS.accent} fill="url(#gSav)" strokeWidth={2} />
            </AreaChart>
          </ResponsiveContainer>
        </div>
      )}

      <div style={{ display: "flex", justifyContent: "flex-end" }}>
        <button onClick={()=>setShowForm(s=>!s)} style={btnPrimary}><span>{showForm ? "✕" : "+"}</span> {showForm ? "Chiudi" : "Nuovo movimento"}</button>
      </div>

      {showForm && <SavingForm onSubmit={(m)=>{ onAdd(m); setShowForm(false); }} />}

      <div style={{ ...S.card, padding: 0, overflow: "hidden" }}>
        {savings.length === 0 ? (
          <p style={{ color: TOKENS.inkSoft, fontSize: 13.5, padding: 18, margin: 0 }}>Nessun movimento ancora. Aggiungi il primo con "Nuovo movimento".</p>
        ) : [...savings].sort((a,b) => b.date.localeCompare(a.date)).map((m, i, arr) => (
          <div key={m.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 16px", borderBottom: i === arr.length-1 ? "none" : `1px solid ${TOKENS.line}` }}>
            <div style={{ width: 34, height: 34, borderRadius: 8, background: (m.type === "prelievo" ? TOKENS.negative : TOKENS.accent)+"22", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16, flexShrink: 0 }}>
              {m.type === "prelievo" ? "↘" : "🏦"}
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 14, fontWeight: 500 }}>{m.note || (m.type === "prelievo" ? "Prelievo" : "Versamento")}</div>
              <div style={{ fontSize: 12, color: TOKENS.inkSoft, fontFamily: "'IBM Plex Mono', monospace" }}>
                {new Date(m.date).toLocaleDateString("it-IT", { day: "2-digit", month: "short", year: "numeric" })}
              </div>
            </div>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontWeight: 600, fontSize: 14.5, color: m.type === "prelievo" ? TOKENS.negative : TOKENS.accent, whiteSpace: "nowrap" }}>
              {m.type === "prelievo" ? "−" : "+"}{eur(m.amount)}
            </div>
            <button onClick={() => confirmId === m.id ? (onRemove(m.id), setConfirmId(null)) : setConfirmId(m.id)}
              style={{ border: "none", background: confirmId === m.id ? TOKENS.negative : "transparent", color: confirmId === m.id ? TOKENS.paper : TOKENS.inkSoft, borderRadius: 6, padding: "6px 8px", cursor: "pointer", fontSize: 11, display: "flex", alignItems: "center", gap: 4, flexShrink: 0 }}>
              <span>🗑</span>{confirmId === m.id ? "conferma" : ""}
            </button>
          </div>
        ))}
      </div>
    </>
  );
}

function SavingForm({ onSubmit }) {
  const [type, setType] = useState("versamento");
  const [amount, setAmount] = useState("");
  const [date, setDate] = useState(todayISO());
  const [note, setNote] = useState("");

  function submit(e) {
    e.preventDefault();
    const n = parseFloat(String(amount).replace(",", "."));
    if (!n || n <= 0) return;
    onSubmit({ type, amount: n, date, note: note.trim() });
  }

  return (
    <form onSubmit={submit} style={{ ...S.card, display: "flex", flexDirection: "column", gap: 12 }}>
      <div style={{ display: "flex", gap: 6 }}>
        {[["versamento","Versamento"],["prelievo","Prelievo"]].map(([v,l]) => (
          <button type="button" key={v} onClick={()=>setType(v)} style={{
            flex: 1, padding: "9px 0", borderRadius: 8, cursor: "pointer", fontSize: 13.5, fontWeight: 500, border: "none",
            background: type===v ? (v==="versamento"?TOKENS.accentSoft:TOKENS.negativeSoft) : TOKENS.paper2,
            color: type===v ? (v==="versamento"?TOKENS.accent:TOKENS.negative) : TOKENS.inkSoft,
          }}>{l}</button>
        ))}
      </div>
      <div className="grid-2" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        <Field label="Importo (€)"><input required type="number" step="0.01" min="0" value={amount} onChange={e=>setAmount(e.target.value)} placeholder="0.00" style={inputStyle} /></Field>
        <Field label="Data"><input type="date" value={date} onChange={e=>setDate(e.target.value)} style={inputStyle} /></Field>
      </div>
      <Field label="Nota (opzionale)"><input value={note} onChange={e=>setNote(e.target.value)} placeholder="es. arrotondamenti, interessi" style={inputStyle} /></Field>
      <button type="submit" style={{ ...btnPrimary, justifyContent: "center" }}><span>✓</span> Salva movimento</button>
    </form>
  );
}

/* ---------- Backup su Google Sheets ---------- */

function Backup({ sheetUrl, onSaveUrl, lastSync, lastPull, syncing, pulling, onSyncAll, onPull, count, pendingCount, syncFailStreak, onExport, onImportFile }) {
  const [draft, setDraft] = useState(sheetUrl);
  const [openGuide, setOpenGuide] = useState(!sheetUrl);
  const [copied, setCopied] = useState(false);
  const fileInputRef = useRef(null);

  function copyCode() {
    navigator.clipboard.writeText(APPS_SCRIPT_CODE).then(() => { setCopied(true); setTimeout(()=>setCopied(false), 1800); });
  }

  return (
    <>
      {sheetUrl && syncFailStreak >= 3 && (
        <div style={{ ...S.card, padding: "12px 16px", display: "flex", alignItems: "center", gap: 10, background: TOKENS.negativeSoft, boxShadow: "none" }}>
          <span style={{ fontSize: 16 }}>⚠️</span>
          <div style={{ flex: 1, fontSize: 13.5 }}>
            Il collegamento al foglio Google non risponde da un po': controlla che l'URL qui sotto sia ancora corretto e che il deployment su Google sia ancora attivo.
          </div>
        </div>
      )}

      <div style={{ ...S.card, display: "flex", flexDirection: "column", gap: 4 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <div style={{ width: 10, height: 10, borderRadius: "50%", background: sheetUrl ? TOKENS.accent : TOKENS.line, flexShrink: 0 }} />
          <h3 style={{ ...S.sectionTitle, margin: 0 }}>{sheetUrl ? "Collegato a Google Sheets" : "Non ancora collegato"}</h3>
        </div>
        <p style={{ color: TOKENS.inkSoft, fontSize: 13.5, lineHeight: 1.6, margin: "6px 0 14px" }}>
          <b>Automatico, non serve fare nulla:</b> ogni transazione, categoria o risparmio che aggiungi, modifichi o elimini si invia da solo al foglio; ogni 5 minuti l'app controlla anche cosa è cambiato sugli altri dispositivi (comprese le eliminazioni fatte direttamente sul foglio) e si allinea da sola.
        </p>
        <Field label="URL dell'Apps Script (Web App)">
          <input value={draft} onChange={e=>setDraft(e.target.value)} placeholder="https://script.google.com/macros/s/…/exec" style={inputStyle} />
        </Field>
        <div style={{ marginTop: 10 }}>
          <button onClick={()=>onSaveUrl(draft.trim())} style={btnPrimary}><span>✓</span> Salva collegamento</button>
        </div>

        {sheetUrl && (
          <div style={{ marginTop: 18, paddingTop: 16, borderTop: `1px solid ${TOKENS.line}` }}>
            <p style={{ fontSize: 11, letterSpacing: 1, color: TOKENS.inkSoft, fontFamily: "'IBM Plex Mono', monospace", margin: "0 0 10px" }}>AZIONI MANUALI — di solito non servono</p>

            <div style={{ marginBottom: 14 }}>
              <button onClick={onSyncAll} disabled={syncing} style={{ ...btnPrimary, background: TOKENS.paper2, color: TOKENS.ink }}>
                <span>⟳</span> {syncing ? "Invio…" : `Invia tutto al foglio (${count})`}
              </button>
              <p style={{ fontSize: 12.5, color: TOKENS.inkSoft, margin: "6px 0 0", lineHeight: 1.5 }}>
                Rispedisce tutte le transazioni di questo dispositivo (senza creare doppioni). Usalo solo se sospetti che qualcosa non sia mai arrivato sul foglio — l'invio normale è già automatico ad ogni aggiunta.
              </p>
            </div>

            <div>
              <button onClick={onPull} disabled={pulling} style={{ ...btnPrimary, background: TOKENS.amberSoft, color: TOKENS.ink }}>
                <span>⬇</span> {pulling ? "Carico…" : "Carica tutto dal foglio"}
              </button>
              <p style={{ fontSize: 12.5, color: TOKENS.inkSoft, margin: "6px 0 0", lineHeight: 1.5 }}>
                <b>Sostituisce</b> tutti i dati di questo dispositivo con quelli del foglio. Usalo su un dispositivo nuovo appena collegato, per portarci subito lo storico esistente — oppure se vuoi essere sicuro di essere allineato subito, senza aspettare il controllo automatico dei 5 minuti.
              </p>
            </div>
          </div>
        )}

        {sheetUrl && (
          <p style={{ fontSize: 12, color: TOKENS.inkSoft, marginTop: 10, fontFamily: "'IBM Plex Mono', monospace" }}>
            ultimo invio: {timeAgo(lastSync)} · ultimo caricamento: {timeAgo(lastPull)}
            {pendingCount > 0 && <span style={{ color: TOKENS.amber }}> · {pendingCount} in attesa di rete</span>}
          </p>
        )}
      </div>

      <div style={S.card}>
        <h3 style={S.sectionTitle}>Backup locale</h3>
        <p style={{ color: TOKENS.inkSoft, fontSize: 13.5, lineHeight: 1.6, margin: "0 0 12px" }}>
          Un file sul tuo dispositivo, indipendente da Google: utile come rete di sicurezza in più, ad esempio prima di svuotare la cache del browser.
        </p>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button onClick={onExport} style={btnPrimary}><span>⬇</span> Scarica una copia</button>
          <button onClick={()=>fileInputRef.current?.click()} style={{ ...btnPrimary, background: TOKENS.paper2, color: TOKENS.ink }}><span>⬆</span> Ripristina da file</button>
          <input ref={fileInputRef} type="file" accept="application/json" style={{ display: "none" }}
            onChange={e => { const f = e.target.files?.[0]; onImportFile(f); e.target.value = ""; }} />
        </div>
      </div>

      <div style={S.card}>
        <button onClick={()=>setOpenGuide(o=>!o)} style={{ width: "100%", display: "flex", justifyContent: "space-between", alignItems: "center", background: "none", border: "none", cursor: "pointer", padding: 0 }}>
          <h3 style={{ ...S.sectionTitle, margin: 0 }}>Come creare il collegamento (5 minuti)</h3>
          <span style={{ transform: openGuide ? "rotate(180deg)" : "none", transition: "transform .2s", color: TOKENS.inkSoft, display: "inline-block" }}>▾</span>
        </button>
        {openGuide && (
          <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 10 }}>
            {[
              "Apri Google Sheets e crea un nuovo foglio vuoto (sarà il tuo backup, non serve intestarlo).",
              "Vai su Estensioni → Apps Script. Si apre un editor con del codice di esempio: cancellalo tutto.",
              "Incolla il codice qui sotto (tocca l'icona per copiarlo) e salva (icona a forma di dischetto).",
              "Clicca su Esegui il deployment → Nuovo deployment → tipo Web app.",
              "Imposta \"Esegui come\": Me, e \"Chi ha accesso\": Chiunque. Poi Esegui il deployment.",
              "Google chiederà di autorizzare lo script al primo avvio: sei tu il proprietario, quindi conferma.",
              "Copia l'URL che termina in /exec e incollalo nel campo sopra, su ogni dispositivo su cui apri l'app.",
              "Ogni volta che aggiorni questo codice in futuro: incolla la nuova versione E rifai anche Esegui il deployment → Gestisci i deployment → matita → Versione: Nuova versione → Deploy. Senza questo passaggio, l'URL continua a eseguire il codice vecchio.",
            ].map((step, i) => (
              <div key={i} style={{ display: "flex", gap: 10, fontSize: 13.5, lineHeight: 1.5 }}>
                <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: TOKENS.amber, flexShrink: 0 }}>{String(i+1).padStart(2,"0")}</span>
                <span>{step}</span>
              </div>
            ))}
            <div style={{ position: "relative", marginTop: 6 }}>
              <pre style={{ background: "#211F1C", color: "#E7E3D8", fontSize: 11.5, padding: 14, borderRadius: 10, overflowX: "auto", fontFamily: "'IBM Plex Mono', monospace", lineHeight: 1.6, margin: 0 }}>{APPS_SCRIPT_CODE}</pre>
              <button onClick={copyCode} style={{ position: "absolute", top: 8, right: 8, border: "none", background: "rgba(255,255,255,0.12)", color: "#fff", borderRadius: 6, padding: "5px 8px", cursor: "pointer", display: "flex", alignItems: "center", gap: 4, fontSize: 11 }}>
                <span>{copied ? "✓✓" : "⧉"}</span> {copied ? "copiato" : "copia"}
              </button>
            </div>
            <p style={{ fontSize: 12, color: TOKENS.inkSoft, lineHeight: 1.6, marginTop: 4 }}>
              Nota: l'URL dà lettura e scrittura su quel foglio a chiunque lo conosca — non condividerlo. "Invia tutto al foglio" spedisce le transazioni evitando duplicati; "Carica tutto dal foglio" fa il percorso inverso e sostituisce i dati locali, utile appena apri l'app su un nuovo dispositivo.
            </p>
            <p style={{ fontSize: 12, color: TOKENS.inkSoft, lineHeight: 1.6, marginTop: 0 }}>
              Per tenerlo leggero nel tempo, ci sono due livelli: lo script crea da solo un tab per anno (2026, 2027…) invece di un unico elenco infinito; e quando in Categorie usi "Chiudi un anno", quel tab con le transazioni sparisce del tutto dal foglio e resta solo una riga di totale per categoria nel tab "Archivio" — permanente, leggerissimo, per sempre.
            </p>
          </div>
        )}
      </div>
    </>
  );
}

/* ---------- pezzi UI condivisi ---------- */

function Field({ label, children }) {
  return (
    <label style={{ display: "flex", flexDirection: "column", gap: 5, fontSize: 12, color: TOKENS.inkSoft }}>
      {label}
      {children}
    </label>
  );
}
function SelectPill({ value, onChange, options }) {
  return (
    <select value={value} onChange={e=>onChange(e.target.value)} style={pillSelectStyle}>
      {options.map(([v,l]) => <option key={v} value={v}>{l}</option>)}
    </select>
  );
}

const inputStyle = { padding: "9px 10px", borderRadius: 8, border: `1px solid ${TOKENS.line}`, fontSize: 16, background: TOKENS.cardBg, color: TOKENS.ink, width: "100%" };
const pillSelectStyle = { padding: "7px 10px", borderRadius: 999, border: "none", fontSize: 16, background: TOKENS.paper2, color: TOKENS.inkSoft };
const btnPrimary = { display: "flex", alignItems: "center", gap: 6, padding: "9px 14px", borderRadius: 8, border: "none", background: TOKENS.ink, color: TOKENS.paper, fontSize: 13.5, fontWeight: 500, cursor: "pointer" };

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
<script>
  // Blocca lo zoom con due dita (pinch) e col doppio tap. Il meta viewport da solo
  // (maximum-scale=1, user-scalable=no) non basta su iOS Safari, che lo ignora
  // volutamente per accessibilità: serve intercettare anche i gesti a livello JS.
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  document.addEventListener("gesturechange", function (e) { e.preventDefault(); });
  document.addEventListener("touchmove", function (e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  var lastTouchEnd = 0;
  document.addEventListener("touchend", function (e) {
    var now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, false);
</script>
