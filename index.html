const APP_VERSION = "1.14.0";
const APPS_SCRIPT_CODE = `function getSheetForDate(ss, dateStr) {
  var year = String(dateStr).slice(0, 4);
  var sheet = ss.getSheetByName(year);
  if (!sheet) {
    sheet = ss.insertSheet(year);
    sheet.appendRow(['ID','Tipo','Importo','Categoria','Data','Nota','Viaggio','Eliminato']);
  }
  return sheet;
}

function markDeletedById(sheet, id, col) {
  var data = sheet.getDataRange().getValues();
  for (var i = 1; i < data.length; i++) {
    if (data[i][0] === id) { sheet.getRange(i + 1, col).setValue(true); return true; }
  }
  return false;
}

function doPost(e) {
  var body = JSON.parse(e.postData.contents);
  var ss = SpreadsheetApp.getActiveSpreadsheet();

  if (body.action === 'append') {
    var t = body.tx;
    var sheet = getSheetForDate(ss, t.date);
    sheet.appendRow([t.id, t.type, t.amount, t.categoryName, t.date, t.note || '', t.trip || '', false]);

  } else if (body.action === 'delete') {
    ss.getSheets().forEach(function(sheet) {
      if (!/^\\d{4}$/.test(sheet.getName())) return;
      markDeletedById(sheet, body.id, 8);
    });

  } else if (body.action === 'update') {
    ss.getSheets().forEach(function(sheet) {
      if (!/^\\d{4}$/.test(sheet.getName())) return;
      markDeletedById(sheet, body.id, 8);
    });
    var ut = body.tx;
    var usheet = getSheetForDate(ss, ut.date);
    usheet.appendRow([ut.id, ut.type, ut.amount, ut.categoryName, ut.date, ut.note || '', ut.trip || '', false]);

  } else if (body.action === 'bulk') {
    var byYear = {};
    body.txs.forEach(function(t) {
      var y = String(t.date).slice(0, 4);
      if (!byYear[y]) byYear[y] = [];
      byYear[y].push(t);
    });
    Object.keys(byYear).forEach(function(y) {
      var sheet = getSheetForDate(ss, byYear[y][0].date);
      var existing = sheet.getDataRange().getValues().slice(1).map(function(r){ return r[0]; });
      byYear[y].forEach(function(t) {
        if (existing.indexOf(t.id) === -1) {
          sheet.appendRow([t.id, t.type, t.amount, t.categoryName, t.date, t.note || '', t.trip || '', false]);
        }
      });
    });

  } else if (body.action === 'closeYear') {
    var year = String(body.year);
    var arch = ss.getSheetByName('Archivio') || ss.insertSheet('Archivio');
    if (arch.getLastRow() === 0) arch.appendRow(['Anno', 'Categoria', 'Totale']);
    var adata = arch.getDataRange().getValues();
    for (var j = adata.length - 1; j >= 1; j--) {
      if (String(adata[j][0]) === year) arch.deleteRow(j + 1);
    }
    (body.categories || []).forEach(function(c) {
      arch.appendRow([year, c.name, c.total]);
    });
    arch.appendRow([year, '__Entrate__', body.totalIncome || 0]);
    var yearSheet = ss.getSheetByName(year);
    if (yearSheet) ss.deleteSheet(yearSheet);

  } else if (body.action === 'categoriesSync') {
    var csheet = ss.getSheetByName('Categorie') || ss.insertSheet('Categorie');
    if (csheet.getLastRow() === 0) csheet.appendRow(['ID', 'Nome', 'Icona', 'Colore', 'Tipo', 'Budget', 'Eliminato']);
    var cdata = csheet.getDataRange().getValues();
    var idRow = {};
    for (var ci = 1; ci < cdata.length; ci++) idRow[cdata[ci][0]] = ci + 1;
    (body.categories || []).forEach(function(c) {
      var row = [c.id, c.name, c.icon, c.color, c.type, c.budget || 0, false];
      if (idRow[c.id]) csheet.getRange(idRow[c.id], 1, 1, 7).setValues([row]);
      else { csheet.appendRow(row); idRow[c.id] = csheet.getLastRow(); }
    });

  } else if (body.action === 'categoryDelete') {
    var csheet2 = ss.getSheetByName('Categorie');
    if (csheet2) markDeletedById(csheet2, body.id, 7);

  } else if (body.action === 'savingAppend') {
    var ssheet = ss.getSheetByName('Risparmi') || ss.insertSheet('Risparmi');
    if (ssheet.getLastRow() === 0) ssheet.appendRow(['ID', 'Tipo', 'Importo', 'Data', 'Nota', 'Eliminato']);
    var sv = body.saving;
    ssheet.appendRow([sv.id, sv.type, sv.amount, sv.date, sv.note || '', false]);

  } else if (body.action === 'savingDelete') {
    var ssheet2 = ss.getSheetByName('Risparmi');
    if (ssheet2) markDeletedById(ssheet2, body.id, 6);
  }
  return ContentService.createTextOutput(JSON.stringify({ ok: true })).setMimeType(ContentService.MimeType.JSON);
}

function doGet(e) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var tz = Session.getScriptTimeZone();
  var out = { transactions: [], archives: [], categories: [], savings: [], deletedTransactionIds: [], deletedCategoryIds: [], deletedSavingIds: [] };

  ss.getSheets().forEach(function(sheet) {
    if (!/^\\d{4}$/.test(sheet.getName())) return;
    if (sheet.getLastRow() <= 1) return;
    var rows = sheet.getDataRange().getValues().slice(1);
    rows.forEach(function(r) {
      if (r[7] === true) { out.deletedTransactionIds.push(r[0]); return; }
      var d = r[4];
      var dateStr = (d instanceof Date) ? Utilities.formatDate(d, tz, 'yyyy-MM-dd') : String(d);
      out.transactions.push({ id: r[0], type: r[1], amount: r[2], categoryName: r[3], date: dateStr, note: r[5] || '', trip: r[6] || '' });
    });
  });

  var arch = ss.getSheetByName('Archivio');
  if (arch && arch.getLastRow() > 1) {
    var byYear = {};
    var incomeByYear = {};
    arch.getDataRange().getValues().slice(1).forEach(function(r) {
      var y = String(r[0]);
      if (r[1] === '__Entrate__') { incomeByYear[y] = r[2]; return; }
      if (!byYear[y]) byYear[y] = {};
      byYear[y][r[1]] = r[2];
    });
    Object.keys(byYear).forEach(function(y) {
      out.archives.push({ year: y, categoryTotals: byYear[y], income: incomeByYear[y] || 0 });
    });
  }

  var csheet3 = ss.getSheetByName('Categorie');
  if (csheet3 && csheet3.getLastRow() > 1) {
    csheet3.getDataRange().getValues().slice(1).forEach(function(r) {
      if (r[6] === true) { out.deletedCategoryIds.push(r[0]); return; }
      out.categories.push({ id: r[0], name: r[1], icon: r[2], color: r[3], type: r[4], budget: r[5] || 0 });
    });
  }

  var ssheet3 = ss.getSheetByName('Risparmi');
  if (ssheet3 && ssheet3.getLastRow() > 1) {
    ssheet3.getDataRange().getValues().slice(1).forEach(function(r) {
      if (r[5] === true) { out.deletedSavingIds.push(r[0]); return; }
      var sd = r[3];
      var sdateStr = (sd instanceof Date) ? Utilities.formatDate(sd, tz, 'yyyy-MM-dd') : String(sd);
      out.savings.push({ id: r[0], type: r[1], amount: r[2], date: sdateStr, note: r[4] || '' });
    });
  }

  return ContentService.createTextOutput(JSON.stringify(out)).setMimeType(ContentService.MimeType.JSON);
}`;

const todayISO = () => new Date().toISOString().slice(0, 10);
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const eur = (n) => new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR" }).format(n || 0);
const monthKey = (d) => d.slice(0, 7);
const monthLabel = (k) => {
  const [y, m] = k.split("-");
  return new Date(Number(y), Number(m) - 1, 1).toLocaleDateString("it-IT", { month: "short", year: "numeric" });
};
const timeAgo = (iso) => {
  if (!iso) return "mai";
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return "adesso";
  if (diff < 3600) return `${Math.floor(diff / 60)} min fa`;
  if (diff < 86400) return `${Math.floor(diff / 3600)} h fa`;
  return `${Math.floor(diff / 86400)} g fa`;
};

/* ---------- persistenza locale (nel browser del dispositivo) ---------- */

function loadKey(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    if (v) return JSON.parse(v);
  } catch (e) { /* valore assente o non valido, uso il default */ }
  return fallback;
}
function saveKey(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { console.error("storage error", key, e); }
}

function App() {
  const [tab, setTab] = useState("dashboard");
  const [categories, setCategories] = useState(() => loadKey("categories", DEFAULT_CATEGORIES));
  const [transactions, setTransactions] = useState(() => loadKey("transactions", []));
  const [archives, setArchives] = useState(() => loadKey("archives", []));
  const [savings, setSavings] = useState(() => loadKey("savings", []));
  const [sheetUrl, setSheetUrlState] = useState(() => loadKey("sheet-url", ""));
  const [lastSync, setLastSync] = useState(() => loadKey("last-sync", ""));
  const [lastPull, setLastPull] = useState(() => loadKey("last-pull", ""));
  const [syncing, setSyncing] = useState(false);
  const [pulling, setPulling] = useState(false);
  const [autoClosedYears, setAutoClosedYears] = useState([]);
  const [pendingCount, setPendingCount] = useState(() => loadKey("pending-sync", []).length);
  const [syncFailStreak, setSyncFailStreak] = useState(() => loadKey("sync-fail-streak", 0));
  const [quickAdd, setQuickAdd] = useState(() => new URLSearchParams(window.location.search).get("add") === "1");
  const categorySyncTimer = useRef(null);

  // Aggiunge la categoria "Cloud" anche a chi ha già dei dati salvati: i DEFAULT_CATEGORIES
  // valgono solo per le installazioni nuove, quindi qui la inseriamo una volta sola se manca.
  useEffect(() => {
    setCategories(prev => {
      if (prev.some(c => c.name.toLowerCase() === "cloud")) return prev;
      const next = [...prev, { id: uid(), name: "Cloud", icon: "☁️", color: "#3B6FA8", type: "expense", budget: 0 }];
      saveKey("categories", next);
      return next;
    });
  }, []); // eslint-disable-line

  useEffect(() => {
    if (quickAdd) {
      const url = new URL(window.location.href);
      url.searchParams.delete("add");
      window.history.replaceState({}, "", url);
    }
  }, []); // eslint-disable-line

  const catMap = useMemo(() => Object.fromEntries(categories.map(c => [c.id, c])), [categories]);
  const existingTrips = useMemo(() => Array.from(new Set(transactions.map(t => t.trip).filter(Boolean))).sort(), [transactions]);

  function queueAdd(payload) {
    const q = loadKey("pending-sync", []);
    const next = [...q, { id: uid(), payload }];
    saveKey("pending-sync", next);
    setPendingCount(next.length);
  }
  function queueRemove(id) {
    const q = loadKey("pending-sync", []);
    const next = q.filter(i => i.id !== id);
    saveKey("pending-sync", next);
    setPendingCount(next.length);
  }

  // Riprova a inviare al foglio ciò che non era partito per mancanza di rete: al primo avvio
  // e ogni volta che il dispositivo torna online.
  useEffect(() => {
    async function flushQueue() {
      const url = loadKey("sheet-url", "");
      if (!url) return;
      const q = loadKey("pending-sync", []);
      for (const item of q) {
        try {
          await fetch(url, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(item.payload) });
          queueRemove(item.id);
          const ts = new Date().toISOString();
          setLastSync(ts); saveKey("last-sync", ts);
        } catch (e) { /* ancora offline, ci riproviamo più tardi */ }
      }
    }
    flushQueue();
    window.addEventListener("online", flushQueue);
    async function checkSyncHealth() {
      const url = loadKey("sheet-url", "");
      if (!url) return;
      try {
        const res = await fetch(url, { method: "GET" });
        if (!res.ok) throw new Error("bad status");
        await res.json();
        saveKey("sync-fail-streak", 0); setSyncFailStreak(0);
      } catch (e) {
        const streak = loadKey("sync-fail-streak", 0) + 1;
        saveKey("sync-fail-streak", streak); setSyncFailStreak(streak);
      }
    }
    checkSyncHealth();
    async function mergeFromSheet() {
      const url = loadKey("sheet-url", "");
      if (!url) return;
      try {
        const res = await fetch(url, { method: "GET" });
        if (!res.ok) return;
        const data = await res.json();

        // Transazioni: aggiungi le nuove, rimuovi quelle segnate come eliminate altrove
        const localTx = loadKey("transactions", []);
        const localIds = new Set(localTx.map(t => t.id));
        let cats = loadKey("categories", DEFAULT_CATEGORIES);
        const byName = {}; cats.forEach(c => { byName[c.name.trim().toLowerCase()] = c.id; });
        function ensureCat(name, type) {
          let id = byName[(name || "").trim().toLowerCase()];
          if (!id) {
            const nc = { id: uid(), name: name || "Altro", icon: "🏷️", color: "#8A8578", type: type || "expense", budget: 0 };
            cats.push(nc); byName[nc.name.toLowerCase()] = nc.id; id = nc.id;
          }
          return id;
        }
        const archivedYears = new Set((data.archives || []).map(a => a.year));
        const newOnes = (data.transactions || [])
          .filter(t => !localIds.has(t.id) && !archivedYears.has(String(t.date).slice(0, 4)))
          .map(t => ({ id: t.id, type: t.type, amount: parseFloat(t.amount) || 0, categoryId: ensureCat(t.categoryName, t.type), date: t.date, note: t.note || "", trip: t.trip || "" }));
        const deletedTxIds = new Set(data.deletedTransactionIds || []);
        let mergedTx = [...newOnes, ...localTx];
        let txChanged = newOnes.length > 0;
        if (deletedTxIds.size > 0) {
          const before = mergedTx.length;
          mergedTx = mergedTx.filter(t => !deletedTxIds.has(t.id));
          if (mergedTx.length !== before) txChanged = true;
        }
        if (txChanged) { setTransactions(mergedTx); saveKey("transactions", mergedTx); }

        // Categorie: aggiungi/aggiorna, rimuovi quelle segnate come eliminate altrove
        let catsChanged = false;
        if (Array.isArray(data.categories)) {
          const byId = Object.fromEntries(cats.map(c => [c.id, c]));
          data.categories.forEach(rc => {
            const incoming = { id: rc.id, name: rc.name, icon: rc.icon, color: rc.color, type: rc.type, budget: parseFloat(rc.budget) || 0 };
            const existing = byId[rc.id];
            if (!existing) { cats.push(incoming); byId[rc.id] = incoming; catsChanged = true; }
            else if (existing.name !== incoming.name || existing.icon !== incoming.icon || existing.color !== incoming.color || existing.type !== incoming.type || (existing.budget || 0) !== incoming.budget) {
              Object.assign(existing, incoming); catsChanged = true;
            }
          });
        }
        const deletedCatIds = new Set(data.deletedCategoryIds || []);
        if (deletedCatIds.size > 0) {
          const before = cats.length;
          cats = cats.filter(c => !deletedCatIds.has(c.id));
          if (cats.length !== before) catsChanged = true;
        }
        if (catsChanged) { setCategories(cats); saveKey("categories", cats); }

        // Risparmi: aggiungi i nuovi, rimuovi quelli segnati come eliminati altrove
        const localSav = loadKey("savings", []);
        const localSavIds = new Set(localSav.map(s => s.id));
        const newSavings = (data.savings || [])
          .filter(s => !localSavIds.has(s.id))
          .map(s => ({ id: s.id, type: s.type, amount: parseFloat(s.amount) || 0, date: s.date, note: s.note || "" }));
        const deletedSavIds = new Set(data.deletedSavingIds || []);
        let mergedSav = [...newSavings, ...localSav];
        let savChanged = newSavings.length > 0;
        if (deletedSavIds.size > 0) {
          const before = mergedSav.length;
          mergedSav = mergedSav.filter(s => !deletedSavIds.has(s.id));
          if (mergedSav.length !== before) savChanged = true;
        }
        if (savChanged) { setSavings(mergedSav); saveKey("savings", mergedSav); }

        const ts = new Date().toISOString();
        setLastPull(ts); saveKey("last-pull", ts);
      } catch (e) { /* prossimo giro va meglio */ }
    }
    mergeFromSheet();
    const interval = setInterval(() => { flushQueue(); checkSyncHealth(); mergeFromSheet(); }, 5 * 60 * 1000); // sincronizzazione e controllo automatici ogni 5 minuti, oltre a quello immediato a ogni transazione
    return () => { window.removeEventListener("online", flushQueue); clearInterval(interval); };
  }, []); // eslint-disable-line

  // Al primo avvio dell'app, chiude da solo qualunque anno ormai passato e mai archiviato:
  // così anche se ci si dimentica, nulla resta appeso e nulla va perso (i totali restano per sempre).
  useEffect(() => {
    (async () => {
      const currentYear = String(new Date().getFullYear());
      let txs = loadKey("transactions", []);
      let archs = loadKey("archives", []);
      const cats = loadKey("categories", DEFAULT_CATEGORIES);
      const catById = Object.fromEntries(cats.map(c => [c.id, c]));
      const pastYears = Array.from(new Set(txs.map(t => t.date.slice(0, 4))))
        .filter(y => y < currentYear && !archs.some(a => a.year === y))
        .sort();
      if (pastYears.length === 0) return;

      const url = loadKey("sheet-url", "");
      for (const year of pastYears) {
        const totals = {}; const names = {};
        let totalIncome = 0, totalExpense = 0;
        cats.forEach(c => { names[c.id] = { name: c.name, icon: c.icon }; });
        txs.forEach(t => {
          if (t.date.slice(0, 4) !== year) return;
          if (t.type === "income") totalIncome += t.amount;
          else { totalExpense += t.amount; totals[t.categoryId] = (totals[t.categoryId] || 0) + t.amount; }
        });
        archs = [...archs.filter(a => a.year !== year), { year, categoryTotals: totals, categoryNames: names, totalIncome, totalExpense, saldo: totalIncome - totalExpense, closedAt: new Date().toISOString() }];
        txs = txs.filter(t => t.date.slice(0, 4) !== year);
        if (url) {
          const catsPayload = Object.entries(totals).map(([id, total]) => ({ name: catById[id]?.name || names[id]?.name || "Altro", total }));
          try {
            await fetch(url, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "closeYear", year, categories: catsPayload, totalIncome }) });
          } catch (e) { console.error("auto-close sync error", e); }
        }
      }
      saveKey("transactions", txs);
      saveKey("archives", archs);
      setTransactions(txs);
      setArchives(archs);
      setAutoClosedYears(pastYears);
    })();
  }, []); // eslint-disable-line

  async function pushToSheet(payload) {
    if (!sheetUrl) return;
    try {
      await fetch(sheetUrl, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
      });
      const ts = new Date().toISOString();
      setLastSync(ts); saveKey("last-sync", ts);
    } catch (e) {
      console.error("sync error, messo in coda per riprovare al ritorno della rete", e);
      queueAdd(payload);
    }
  }

  function addTransaction(tx) {
    const full = { ...tx, id: uid() };
    const next = [full, ...transactions];
    setTransactions(next); saveKey("transactions", next);
    pushToSheet({ action: "append", tx: { ...full, categoryName: catMap[full.categoryId]?.name || full.categoryId } });
  }
  function removeTransaction(id) {
    const next = transactions.filter(t => t.id !== id);
    setTransactions(next); saveKey("transactions", next);
    pushToSheet({ action: "delete", id });
  }
  function updateTransaction(id, patch) {
    const next = transactions.map(t => t.id === id ? { ...t, ...patch } : t);
    setTransactions(next); saveKey("transactions", next);
    const updated = next.find(t => t.id === id);
    pushToSheet({ action: "update", id, tx: { ...updated, categoryName: catMap[updated.categoryId]?.name || updated.categoryId } });
  }
  function addSaving(entry) {
    const full = { ...entry, id: uid() };
    const next = [full, ...savings];
    setSavings(next); saveKey("savings", next);
    pushToSheet({ action: "savingAppend", saving: full });
  }
  function removeSaving(id) {
    const next = savings.filter(s => s.id !== id);
    setSavings(next); saveKey("savings", next);
    pushToSheet({ action: "savingDelete", id });
  }
  function exportBackup() {
    const data = { app: "Registro", version: APP_VERSION, exportedAt: new Date().toISOString(), categories, transactions, archives, savings };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `registro-backup-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function importBackupFile(file) {
    if (!file) return;
    if (!window.confirm("Questo sostituirà tutti i dati attuali su questo dispositivo con quelli del file. Continuare?")) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (Array.isArray(data.categories)) { setCategories(data.categories); saveKey("categories", data.categories); }
        if (Array.isArray(data.transactions)) { setTransactions(data.transactions); saveKey("transactions", data.transactions); }
        if (Array.isArray(data.archives)) { setArchives(data.archives); saveKey("archives", data.archives); }
        if (Array.isArray(data.savings)) { setSavings(data.savings); saveKey("savings", data.savings); }
        window.alert("Ripristino completato.");
      } catch (err) {
        window.alert("Il file non sembra un backup valido di Registro.");
      }
    };
    reader.readAsText(file);
  }
  async function syncAllNow() {
    if (!sheetUrl) return;
    setSyncing(true);
    await pushToSheet({ action: "bulk", txs: transactions.map(t => ({ ...t, categoryName: catMap[t.categoryId]?.name || t.categoryId })) });
    setSyncing(false);
  }
  async function pullFromSheet() {
    if (!sheetUrl) return;
    if (!window.confirm("Questo sostituirà transazioni, categorie, risparmi e archivi salvati su questo dispositivo con quelli presenti nel foglio Google. Continuare?")) return;
    setPulling(true);
    try {
      const res = await fetch(sheetUrl, { method: "GET" });
      const data = await res.json();
      const byName = {};
      let newCats = [...categories];
      newCats.forEach(c => { byName[c.name.toLowerCase()] = c.id; });
      function ensureCat(name, type) {
        let id = byName[(name || "").toLowerCase()];
        if (!id) {
          const nc = { id: uid(), name: name || "Altro", icon: "🏷️", color: "#8A8578", type: type || "expense", budget: 0 };
          newCats.push(nc); byName[nc.name.toLowerCase()] = nc.id; id = nc.id;
        }
        return id;
      }
      const archivedYears = new Set((data.archives || []).map(a => a.year));
      const mapped = (data.transactions || [])
        .filter(t => !archivedYears.has(String(t.date).slice(0, 4)))
        .map(t => ({ id: t.id, type: t.type, amount: parseFloat(t.amount) || 0, categoryId: ensureCat(t.categoryName, t.type), date: t.date, note: t.note || "", trip: t.trip || "" }));
      const mappedArchives = (data.archives || []).map(a => {
        const categoryTotals = {};
        const categoryNames = {};
        Object.entries(a.categoryTotals || {}).forEach(([name, total]) => {
          const id = ensureCat(name, "expense");
          categoryTotals[id] = parseFloat(total) || 0;
          categoryNames[id] = { name, icon: newCats.find(c => c.id === id)?.icon || "🏷️" };
        });
        const totalExpense = Object.values(categoryTotals).reduce((s, v) => s + v, 0);
        const totalIncome = parseFloat(a.income) || 0;
        return { year: a.year, categoryTotals, categoryNames, totalIncome, totalExpense, saldo: totalIncome - totalExpense, closedAt: new Date().toISOString() };
      });
      if (Array.isArray(data.categories)) {
        const byId = Object.fromEntries(newCats.map(c => [c.id, c]));
        data.categories.forEach(rc => {
          const incoming = { id: rc.id, name: rc.name, icon: rc.icon, color: rc.color, type: rc.type, budget: parseFloat(rc.budget) || 0 };
          if (byId[rc.id]) Object.assign(byId[rc.id], incoming);
          else { newCats.push(incoming); byId[rc.id] = incoming; }
        });
      }
      const deletedCatIds = new Set(data.deletedCategoryIds || []);
      if (deletedCatIds.size > 0) newCats = newCats.filter(c => !deletedCatIds.has(c.id));
      const mappedSavings = (data.savings || []).map(s => ({ id: s.id, type: s.type, amount: parseFloat(s.amount) || 0, date: s.date, note: s.note || "" }));
      setCategories(newCats); saveKey("categories", newCats);
      setTransactions(mapped); saveKey("transactions", mapped);
      setArchives(mappedArchives); saveKey("archives", mappedArchives);
      setSavings(mappedSavings); saveKey("savings", mappedSavings);
      const ts = new Date().toISOString();
      setLastPull(ts); saveKey("last-pull", ts);
    } catch (e) {
      console.error(e);
      window.alert("Non sono riuscito a leggere dal foglio. Controlla il link nella scheda Backup e riprova.");
    }
    setPulling(false);
  }
  function saveSheetUrl(url) { setSheetUrlState(url); saveKey("sheet-url", url); }

  async function setArchiveIncome(year, income) {
    const next = archives.map(a => a.year === year ? { ...a, totalIncome: income, saldo: income - a.totalExpense } : a);
    setArchives(next); saveKey("archives", next);
    const a = next.find(x => x.year === year);
    if (a) {
      const catsPayload = Object.entries(a.categoryTotals).map(([id, total]) => ({ name: a.categoryNames[id]?.name || "Altro", total }));
      await pushToSheet({ action: "closeYear", year, categories: catsPayload, totalIncome: income });
    }
  }

  async function closeYear(year) {
    const inArchive = archives.some(a => a.year === year);
    const msg = inArchive
      ? `Il ${year} è già archiviato: verrà ricalcolato da capo con le transazioni attuali. Continuare?`
      : `Le transazioni del ${year} verranno riassunte in un totale per categoria e poi eliminate in modo permanente da questo dispositivo (e dal foglio, se collegato). Non potrai più vederle giorno per giorno, solo il totale annuale. Continuare?`;
    if (!window.confirm(msg)) return;

    const totals = {}; const names = {};
    let totalIncome = 0, totalExpense = 0;
    categories.forEach(c => { names[c.id] = { name: c.name, icon: c.icon }; });
    transactions.forEach(t => {
      if (t.date.slice(0, 4) !== year) return;
      if (t.type === "income") totalIncome += t.amount;
      else { totalExpense += t.amount; totals[t.categoryId] = (totals[t.categoryId] || 0) + t.amount; }
    });
    const archive = { year, categoryTotals: totals, categoryNames: names, totalIncome, totalExpense, saldo: totalIncome - totalExpense, closedAt: new Date().toISOString() };
    const nextArchives = [...archives.filter(a => a.year !== year), archive];
    setArchives(nextArchives); saveKey("archives", nextArchives);

    const remaining = transactions.filter(t => t.date.slice(0, 4) !== year);
    setTransactions(remaining); saveKey("transactions", remaining);

    const catsPayload = Object.entries(totals).map(([id, total]) => ({ name: catMap[id]?.name || names[id]?.name || "Altro", total }));
    await pushToSheet({ action: "closeYear", year, categories: catsPayload, totalIncome });
  }

  function pushCategoriesToSheet(cats) {
    const payload = cats.map(c => ({ id: c.id, name: c.name, icon: c.icon, color: c.color, type: c.type, budget: c.budget || 0 }));
    pushToSheet({ action: "categoriesSync", categories: payload });
  }
  function pushCategoriesDebounced(cats) {
    clearTimeout(categorySyncTimer.current);
    categorySyncTimer.current = setTimeout(() => pushCategoriesToSheet(cats), 900);
  }
  function addCategory(cat) {
    const next = [...categories, { ...cat, id: uid() }];
    setCategories(next); saveKey("categories", next);
    pushCategoriesToSheet(next);
  }
  function updateCategory(id, patch) {
    const next = categories.map(c => c.id === id ? { ...c, ...patch } : c);
    setCategories(next); saveKey("categories", next);
    pushCategoriesDebounced(next);
  }
  function removeCategory(id) {
    const cat = categories.find(c => c.id === id);
    if (!cat) return;
    const affected = transactions.filter(t => t.categoryId === id);
    if (affected.length > 0) {
      const proceed = window.confirm(`Ci sono ${affected.length} transazioni con la categoria "${cat.name}". Verranno spostate su "Altro" prima di eliminarla, per non alterare i totali già calcolati. Continuare?`);
      if (!proceed) return;
      let altro = categories.find(c => c.type === cat.type && c.name.trim().toLowerCase() === "altro");
      let nextCats = categories;
      if (!altro) {
        altro = { id: uid(), name: "Altro", icon: "➕", color: "#8A8578", type: cat.type, budget: 0 };
        nextCats = [...categories, altro];
      }
      const nextTx = transactions.map(t => t.categoryId === id ? { ...t, categoryId: altro.id } : t);
      setTransactions(nextTx); saveKey("transactions", nextTx);
      const finalCats = nextCats.filter(c => c.id !== id);
      setCategories(finalCats); saveKey("categories", finalCats);
      pushCategoriesToSheet(finalCats);
      pushToSheet({ action: "categoryDelete", id });
      affected.forEach(t => {
        pushToSheet({ action: "update", id: t.id, tx: { ...t, categoryId: altro.id, categoryName: altro.name } });
      });
      return;
    }
    const next = categories.filter(c => c.id !== id);
    setCategories(next); saveKey("categories", next);
    pushCategoriesToSheet(next);
    pushToSheet({ action: "categoryDelete", id });
  }

  const balance = transactions.reduce((s, t) => s + (t.type === "income" ? t.amount : -t.amount), 0)
    + archives.reduce((s, a) => s + (a.saldo || 0), 0);

  return (
    <div style={S.app}>
      <div style={S.shell}>
        <header style={S.header}>
          <div>
            <div style={S.eyebrow}>MONEY TRACKER · SIMONE</div>
            <h1 style={S.h1}>Registro</h1>
          </div>
          <div style={S.headerBalance}>
            <span style={S.headerBalanceLabel}>saldo</span>
            <span style={{ ...S.headerBalanceNum, color: balance >= 0 ? TOKENS.accent : TOKENS.negative }}>{eur(balance)}</span>
          </div>
        </header>

        <div className="layout-row">
        <nav className="tabs-nav">
          <TabBtn active={tab==="dashboard"} onClick={()=>setTab("dashboard")} icon="▦" label="Dashboard" />
          <TabBtn active={tab==="transazioni"} onClick={()=>setTab("transazioni")} icon="☰" label="Transazioni" />
          <TabBtn active={tab==="categorie"} onClick={()=>setTab("categorie")} icon="🏷" label="Categorie" />
          <TabBtn active={tab==="risparmi"} onClick={()=>setTab("risparmi")} icon="🏦" label="Risparmi" />
          <TabBtn active={tab==="backup"} onClick={()=>setTab("backup")} icon="☁" label="Backup" dot={!sheetUrl || pendingCount > 0} />
        </nav>

        <div className="content-col">
        <main style={S.main}>
          {autoClosedYears.length > 0 && (
            <div style={{ ...S.card, padding: "12px 16px", display: "flex", alignItems: "center", gap: 10, background: TOKENS.accentSoft, boxShadow: "none" }}>
              <span style={{ fontSize: 16 }}>🔒</span>
              <div style={{ flex: 1, fontSize: 13.5 }}>
                Ho archiviato in automatico {autoClosedYears.length === 1 ? `l'anno ${autoClosedYears[0]}` : `gli anni ${autoClosedYears.join(", ")}`}: trovi i totali per categoria in Categorie → Confronto per anno.
              </div>
              <button onClick={()=>setAutoClosedYears([])} style={{ border: "none", background: "transparent", color: TOKENS.inkSoft, cursor: "pointer", fontSize: 14 }}>✕</button>
            </div>
          )}
          {tab === "dashboard" && <Dashboard transactions={transactions} categories={categories} catMap={catMap} archives={archives} />}
          {tab === "transazioni" && <Transazioni transactions={transactions} categories={categories} catMap={catMap} onAdd={addTransaction} onRemove={removeTransaction} onUpdate={updateTransaction} existingTrips={existingTrips} />}
          {tab === "categorie" && <Categorie categories={categories} transactions={transactions} archives={archives} onAdd={addCategory} onUpdate={updateCategory} onRemove={removeCategory} onCloseYear={closeYear} onEditArchiveIncome={setArchiveIncome} />}
          {tab === "risparmi" && <Risparmi savings={savings} onAdd={addSaving} onRemove={removeSaving} />}
          {tab === "backup" && <Backup sheetUrl={sheetUrl} onSaveUrl={saveSheetUrl} lastSync={lastSync} lastPull={lastPull} syncing={syncing} pulling={pulling} onSyncAll={syncAllNow} onPull={pullFromSheet} count={transactions.length} pendingCount={pendingCount} syncFailStreak={syncFailStreak} onExport={exportBackup} onImportFile={importBackupFile} />}
        </main>

        <button className="fab-btn" onClick={()=>setQuickAdd(true)} aria-label="Nuova transazione" style={S.fab}>+</button>

        {quickAdd && (
          <div style={S.modalOverlay} onClick={(e)=>{ if (e.target === e.currentTarget) setQuickAdd(false); }}>
            <div style={S.modalCard}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                <h3 style={{ ...S.sectionTitle, margin: 0 }}>Nuova transazione</h3>
                <button onClick={()=>setQuickAdd(false)} style={{ border: "none", background: "transparent", color: TOKENS.inkSoft, cursor: "pointer", fontSize: 18, padding: 4 }}>✕</button>
              </div>
              <TxForm categories={categories} existingTrips={existingTrips} onSubmit={(tx)=>{ addTransaction(tx); setQuickAdd(false); }} />
            </div>
          </div>
        )}

        <p style={S.footer}>Registro v{APP_VERSION} · vive su questo dispositivo, funziona anche offline. Collega il Backup per portare i dati anche su altri dispositivi.</p>
        </div>
        </div>
      </div>
    </div>
  );
}

/* ---------- Dashboard ---------- */

function Dashboard({ transactions, categories, catMap, archives }) {
  const [catPeriod, setCatPeriod] = useState("mese");
  const now = new Date();
  const thisMonthKey = now.toISOString().slice(0, 7);
  const thisYear = String(now.getFullYear());

  const totalIncome = transactions.filter(t => t.type === "income" && t.date.slice(0, 4) === thisYear).reduce((s, t) => s + t.amount, 0);
  const totalExpense = transactions.filter(t => t.type === "expense" && t.date.slice(0, 4) === thisYear).reduce((s, t) => s + t.amount, 0);

  const budgetAlerts = useMemo(() => {
    return categories.filter(c => c.type === "expense" && c.budget > 0).map(c => {
      const spent = transactions.filter(t => t.type === "expense" && t.categoryId === c.id && monthKey(t.date) === thisMonthKey).reduce((s, t) => s + t.amount, 0);
      return { ...c, spent, pct: spent / c.budget };
    }).filter(c => c.pct >= 0.8).sort((a, b) => b.pct - a.pct);
  }, [categories, transactions, thisMonthKey]);

  const monthly = useMemo(() => {
    const map = {};
    transactions.forEach(t => {
      const k = monthKey(t.date);
      if (!map[k]) map[k] = { key: k, entrate: 0, uscite: 0 };
      if (t.type === "income") map[k].entrate += t.amount; else map[k].uscite += t.amount;
    });
    return Object.values(map).sort((a, b) => a.key.localeCompare(b.key)).map(m => ({
      ...m, label: monthLabel(m.key), saldo: +(m.entrate - m.uscite).toFixed(2),
    }));
  }, [transactions]);

  const dailyThisMonth = useMemo(() => {
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    const today = now.getDate();
    const days = [];
    let cumEnt = 0, cumUsc = 0;
    for (let d = 1; d <= today; d++) {
      const dateStr = `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      transactions.forEach(t => {
        if (t.date !== dateStr) return;
        if (t.type === "income") cumEnt += t.amount; else cumUsc += t.amount;
      });
      days.push({ day: d, label: String(d), entrate: +cumEnt.toFixed(2), uscite: +cumUsc.toFixed(2) });
    }
    return days;
  }, [transactions]);

  const catData = useMemo(() => {
    const filtered = transactions.filter(t => {
      if (t.type !== "expense") return false;
      if (catPeriod === "mese") return monthKey(t.date) === thisMonthKey;
      if (catPeriod === "anno") return t.date.slice(0, 4) === thisYear;
      return true;
    });
    const map = {};
    filtered.forEach(t => { map[t.categoryId] = (map[t.categoryId] || 0) + t.amount; });
    return Object.entries(map)
      .map(([id, value]) => ({ id, value: +value.toFixed(2), name: catMap[id]?.name || "Altro", color: catMap[id]?.color || "#999" }))
      .sort((a, b) => b.value - a.value).slice(0, 8);
  }, [transactions, catPeriod, thisMonthKey, thisYear, catMap]);

  if (transactions.length === 0) {
    return (
      <div style={S.card}>
        <p style={{ fontFamily: "'Fraunces', serif", fontSize: 20, margin: "0 0 6px" }}>Il registro è vuoto.</p>
        <p style={{ color: TOKENS.inkSoft, fontSize: 14, lineHeight: 1.6, margin: 0 }}>
          Aggiungi la tua prima transazione dalla scheda "Transazioni": da lì Registro calcola tutto in automatico, andamento mensile, categorie principali e avvisi di budget.
        </p>
      </div>
    );
  }

  return (
    <>
      {budgetAlerts.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {budgetAlerts.map(c => {
            const over = c.pct >= 1;
            return (
              <div key={c.id} style={{ ...S.card, padding: "12px 16px", display: "flex", alignItems: "center", gap: 10, background: over ? TOKENS.negativeSoft : TOKENS.amberSoft, boxShadow: "none" }}>
                <span style={{ fontSize: 16 }}>⚠️</span>
                <div style={{ flex: 1, fontSize: 13.5 }}>
                  <b>{c.icon} {c.name}</b>: {eur(c.spent)} su {eur(c.budget)} {over ? "— budget superato" : "— quasi al limite"} questo mese
                </div>
              </div>
            );
          })}
        </div>
      )}

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px,1fr))", gap: 12 }}>
        <StatCard label={`Entrate ${thisYear}`} value={eur(totalIncome)} tone="pos" icon="↗" />
        <StatCard label={`Uscite ${thisYear}`} value={eur(totalExpense)} tone="neg" icon="↘" />
        <StatCard label="Transazioni" value={transactions.length} icon="◆" />
      </div>

      <div style={S.card}>
        <h3 style={S.sectionTitle}>Andamento del mese</h3>
        <ResponsiveContainer width="100%" height={220}>
          <AreaChart data={dailyThisMonth} margin={{ top: 4, right: 4, left: -18, bottom: 0 }}>
            <defs>
              <linearGradient id="gEnt" x1="0" y1="0" x2="0" y2="1">
                <stop offset="5%" stopColor={TOKENS.accent} stopOpacity={0.35}/>
                <stop offset="95%" stopColor={TOKENS.accent} stopOpacity={0}/>
              </linearGradient>
              <linearGradient id="gUsc" x1="0" y1="0" x2="0" y2="1">
                <stop offset="5%" stopColor={TOKENS.negative} stopOpacity={0.3}/>
                <stop offset="95%" stopColor={TOKENS.negative} stopOpacity={0}/>
              </linearGradient>
            </defs>
            <CartesianGrid stroke={TOKENS.line} vertical={false} />
            <XAxis dataKey="label" tick={{ fontSize: 11, fill: TOKENS.inkSoft, fontFamily: "IBM Plex Mono" }} axisLine={{ stroke: TOKENS.line }} tickLine={false} />
            <YAxis tick={{ fontSize: 11, fill: TOKENS.inkSoft, fontFamily: "IBM Plex Mono" }} axisLine={false} tickLine={false} width={46} />
            <Tooltip formatter={(v) => eur(v)} labelFormatter={(d) => `giorno ${d}`} contentStyle={{ fontFamily: "Inter", fontSize: 12, border: `1px solid ${TOKENS.line}`, borderRadius: 8 }} />
            <Area type="monotone" dataKey="entrate" stroke={TOKENS.accent} fill="url(#gEnt)" strokeWidth={2} />
            <Area type="monotone" dataKey="uscite" stroke={TOKENS.negative} fill="url(#gUsc)" strokeWidth={2} />
          </AreaChart>
        </ResponsiveContainer>
        <div style={{ display: "flex", gap: 16, marginTop: 6, fontSize: 12.5, color: TOKENS.inkSoft }}>
          <LegendDot color={TOKENS.accent} label="entrate (cumulate)" />
          <LegendDot color={TOKENS.negative} label="uscite (cumulate)" />
        </div>
      </div>

      <div style={S.card}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
          <h3 style={S.sectionTitle}>Categorie principali</h3>
          <div style={{ display: "flex", gap: 4 }}>
            {[["mese","mese"],["anno","anno"]].map(([v,l]) => (
              <button key={v} onClick={()=>setCatPeriod(v)} style={{
                fontSize: 11.5, padding: "5px 10px", borderRadius: 999, cursor: "pointer", border: "none",
                background: catPeriod===v?TOKENS.ink:TOKENS.paper2, color: catPeriod===v?TOKENS.paper:TOKENS.inkSoft,
              }}>{l}</button>
            ))}
          </div>
        </div>
        {catData.length === 0 ? (
          <p style={{ color: TOKENS.inkSoft, fontSize: 13.5 }}>Nessuna spesa in questo periodo.</p>
        ) : (
          <div style={{ display: "flex", gap: 20, flexWrap: "wrap", alignItems: "center" }}>
            <ResponsiveContainer width={180} height={180}>
              <PieChart>
                <Pie data={catData} dataKey="value" nameKey="name" innerRadius={48} outerRadius={78} paddingAngle={2}>
                  {catData.map((d, i) => <Cell key={i} fill={d.color} stroke="#fff" strokeWidth={1} />)}
                </Pie>
                <Tooltip formatter={(v) => eur(v)} contentStyle={{ fontFamily: "Inter", fontSize: 12, border: `1px solid ${TOKENS.line}`, borderRadius: 8 }} />
              </PieChart>
            </ResponsiveContainer>
            <div style={{ flex: 1, minWidth: 180, display: "flex", flexDirection: "column", gap: 8 }}>
              {catData.map(d => (
                <div key={d.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 13 }}>
                  <span style={{ display: "flex", alignItems: "center", gap: 7 }}>
                    <span style={{ width: 9, height: 9, borderRadius: 3, background: d.color, display: "inline-block" }} />
                    {d.name}
                  </span>
                  <span style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{eur(d.value)}</span>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>

      <div style={S.card}>
        <h3 style={S.sectionTitle}>Riepilogo mensile</h3>
        <div style={{ display: "flex", flexDirection: "column" }}>
          <div style={{ display: "grid", gridTemplateColumns: "1.3fr 1fr 1fr 1fr", fontSize: 11, letterSpacing: 1, color: TOKENS.inkSoft, fontFamily: "'IBM Plex Mono', monospace", padding: "0 0 8px", borderBottom: `1px solid ${TOKENS.ink}` }}>
            <span>MESE</span><span style={{ textAlign: "right" }}>ENTRATE</span><span style={{ textAlign: "right" }}>USCITE</span><span style={{ textAlign: "right" }}>SALDO</span>
          </div>
          {[...monthly].reverse().map(m => (
            <div key={m.key} style={{ display: "grid", gridTemplateColumns: "1.3fr 1fr 1fr 1fr", fontSize: 13.5, padding: "9px 0", borderBottom: `1px solid ${TOKENS.line}`, fontFamily: "'IBM Plex Mono', monospace" }}>
              <span style={{ fontFamily: "Inter" }}>{m.label}</span>
              <span style={{ textAlign: "right", color: TOKENS.accent }}>{eur(m.entrate)}</span>
              <span style={{ textAlign: "right", color: TOKENS.negative }}>{eur(m.uscite)}</span>
              <span style={{ textAlign: "right", fontWeight: 600, color: m.saldo >= 0 ? TOKENS.accent : TOKENS.negative }}>{eur(m.saldo)}</span>
            </div>
          ))}
        </div>
        {archives.length > 0 && (
          <p style={{ fontSize: 12, color: TOKENS.inkSoft, marginTop: 10 }}>
            Gli anni archiviati ({archives.map(a=>a.year).sort().join(", ")}) non compaiono qui in dettaglio mensile: trovi i loro totali per categoria in Categorie → Confronto per anno.
          </p>
        )}
      </div>
    </>
  );
}

function StatCard({ label, value, tone, icon }) {
  const color = tone === "pos" ? TOKENS.accent : tone === "neg" ? TOKENS.negative : TOKENS.ink;
  return (
    <div style={{ ...S.card, padding: 14 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 6, color: TOKENS.inkSoft, fontSize: 11.5, letterSpacing: 0.5, fontFamily: "'IBM Plex Mono', monospace" }}>
        <span>{icon}</span>{label.toUpperCase()}
      </div>
      <div style={{ fontFamily: "'Fraunces', serif", fontSize: 22, fontWeight: 600, color, marginTop: 4 }}>{value}</div>
    </div>
  );
}
function LegendDot({ color, label }) {
  return <span style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 8, height: 8, background: color, borderRadius: "50%", display: "inline-block" }} />{label}</span>;
}

/* ---------- Transazioni ---------- */

function Transazioni({ transactions, categories, catMap, onAdd, onRemove, onUpdate, existingTrips }) {
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [confirmId, setConfirmId] = useState(null);
  const [filterType, setFilterType] = useState("all");
  const [filterCat, setFilterCat] = useState("all");
  const [filterTrip, setFilterTrip] = useState("all");
  const [search, setSearch] = useState("");

  const editingTx = editingId ? transactions.find(t => t.id === editingId) : null;

  const filtered = transactions.filter(t =>
    (filterType === "all" || t.type === filterType) &&
    (filterCat === "all" || t.categoryId === filterCat) &&
    (filterTrip === "all" || t.trip === filterTrip) &&
    (search.trim() === "" || (t.note || "").toLowerCase().includes(search.trim().toLowerCase()))
  );

  const tripTotal = filterTrip !== "all" ? filtered.reduce((s, t) => s + (t.type === "income" ? t.amount : -t.amount), 0) : null;

  return (
    <>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", flex: 1, minWidth: 0 }}>
          <SelectPill value={filterType} onChange={setFilterType} options={[["all","Tutte"],["income","Entrate"],["expense","Uscite"]]} />
          <select value={filterCat} onChange={e=>setFilterCat(e.target.value)} style={pillSelectStyle}>
            <option value="all">Tutte le categorie</option>
            {categories.map(c => <option key={c.id} value={c.id}>{c.icon} {c.name}</option>)}
          </select>
          {existingTrips.length > 0 && (
            <select value={filterTrip} onChange={e=>setFilterTrip(e.target.value)} style={pillSelectStyle}>
              <option value="all">Tutti i viaggi</option>
              {existingTrips.map(t => <option key={t} value={t}>✈️ {t}</option>)}
            </select>
          )}
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Cerca nelle note…" style={{ ...pillSelectStyle, flex: 1, minWidth: 120 }} />
        </div>
        <button onClick={()=>{ setShowForm(s=>!s); setEditingId(null); }} style={btnPrimary}>
          <span>{showForm ? "✕" : "+"}</span> {showForm ? "Chiudi" : "Nuova"}
        </button>
      </div>

      {tripTotal !== null && (
        <div style={{ ...S.card, padding: "12px 16px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span style={{ fontSize: 13.5 }}>✈️ Totale "{filterTrip}"</span>
          <span style={{ fontFamily: "'Fraunces', serif", fontSize: 19, fontWeight: 600, color: tripTotal >= 0 ? TOKENS.accent : TOKENS.negative }}>{eur(tripTotal)}</span>
        </div>
      )}

      {showForm && <TxForm categories={categories} existingTrips={existingTrips} onSubmit={(tx)=>{ onAdd(tx); setShowForm(false); }} />}
      {editingTx && <TxForm categories={categories} existingTrips={existingTrips} initial={editingTx} onSubmit={(patch)=>{ onUpdate(editingTx.id, patch); setEditingId(null); }} onCancel={()=>setEditingId(null)} />}

      <div style={{ ...S.card, padding: 0, overflow: "hidden" }}>
        {filtered.length === 0 ? (
          <p style={{ color: TOKENS.inkSoft, fontSize: 13.5, padding: 18, margin: 0 }}>Nessuna transazione trovata.</p>
        ) : filtered.map((t, i) => {
          const c = catMap[t.categoryId];
          return (
            <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 16px", borderBottom: i === filtered.length-1 ? "none" : `1px solid ${TOKENS.line}` }}>
              <div style={{ width: 34, height: 34, borderRadius: 8, background: (c?.color||"#999")+"22", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16, flexShrink: 0 }}>{c?.icon || "•"}</div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 14, fontWeight: 500, display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                  {c?.name || "Senza categoria"}
                  {t.trip && <span style={{ fontSize: 10.5, fontFamily: "'IBM Plex Mono', monospace", color: TOKENS.amber, background: TOKENS.amberSoft, padding: "1px 6px", borderRadius: 999 }}>✈️ {t.trip}</span>}
                </div>
                <div style={{ fontSize: 12, color: TOKENS.inkSoft, fontFamily: "'IBM Plex Mono', monospace" }}>
                  {new Date(t.date).toLocaleDateString("it-IT", { day: "2-digit", month: "short", year: "numeric" })}
                  {t.note ? ` · ${t.note}` : ""}
                </div>
              </div>
              <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontWeight: 600, fontSize: 14.5, color: t.type === "income" ? TOKENS.accent : TOKENS.negative, whiteSpace: "nowrap" }}>
                {t.type === "income" ? "+" : "−"}{eur(t.amount)}
              </div>
              <button onClick={() => { setEditingId(t.id); setShowForm(false); }}
                style={{ border: "none", background: "transparent", color: TOKENS.inkSoft, borderRadius: 6, padding: "6px 6px", cursor: "pointer", fontSize: 13, flexShrink: 0 }}>
                ✎
              </button>
              <button onClick={() => confirmId === t.id ? (onRemove(t.id), setConfirmId(null)) : setConfirmId(t.id)}
                style={{ border: "none", background: confirmId === t.id ? TOKENS.negative : "transparent", color: confirmId === t.id ? "#fff" : TOKENS.inkSoft, borderRadius: 6, padding: "6px 8px", cursor: "pointer", fontSize: 11, display: "flex", alignItems: "center", gap: 4, flexShrink: 0 }}>
                <span>🗑</span>{confirmId === t.id ? "conferma" : ""}
              </button>
            </div>
          );
        })}
      </div>
    </>
  );
}

function TxForm({ categories, onSubmit, initial, onCancel, existingTrips = [] }) {
  const [type, setType] = useState(initial?.type || "expense");
  const [amount, setAmount] = useState(initial ? String(initial.amount) : "");
  const [categoryId, setCategoryId] = useState(initial?.categoryId || (categories.find(c => c.type === (initial?.type || "expense"))?.id || ""));
  const [date, setDate] = useState(initial?.date || todayISO());
  const [note, setNote] = useState(initial?.note || "");
  const [trip, setTrip] = useState(initial?.trip || "");
  const opts = categories.filter(c => c.type === type);
  const firstRun = useRef(true);

  useEffect(() => {
    if (firstRun.current) { firstRun.current = false; return; }
    setCategoryId(opts[0]?.id || "");
  }, [type]); // eslint-disable-line

  function submit(e) {
    e.preventDefault();
    const n = parseFloat(String(amount).replace(",", "."));
    if (!n || n <= 0 || !categoryId) return;
    onSubmit({ type, amount: n, categoryId, date, note: note.trim(), trip: trip.trim() });
  }

  return (
    <form onSubmit={submit} style={{ ...S.card, display: "flex", flexDirection: "column", gap: 12 }}>
      <div style={{ display: "flex", gap: 6 }}>
        {[["expense","Uscita"],["income","Entrata"]].map(([v,l]) => (
          <button type="button" key={v} onClick={()=>setType(v)} style={{
            flex: 1, padding: "9px 0", borderRadius: 8, cursor: "pointer", fontSize: 13.5, fontWeight: 500, border: "none",
            background: type===v ? (v==="income"?TOKENS.accentSoft:TOKENS.negativeSoft) : TOKENS.paper2,
            color: type===v ? (v==="income"?TOKENS.accent:TOKENS.negative) : TOKENS.inkSoft,
          }}>{l}</button>
        ))}
      </div>
      <div className="grid-2" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        <Field label="Importo (€)"><input required type="number" step="0.01" min="0" value={amount} onChange={e=>setAmount(e.target.value)} placeholder="0.00" style={inputStyle} /></Field>
        <Field label="Data"><input type="date" value={date} onChange={e=>setDate(e.target.value)} style={inputStyle} /></Field>
      </div>
      <Field label="Categoria">
        <select value={categoryId} onChange={e=>setCategoryId(e.target.value)} style={inputStyle}>
          {opts.map(c => <option key={c.id} value={c.id}>{c.icon} {c.name}</option>)}
        </select>
      </Field>
      <Field label="Nota (opzionale)"><input value={note} onChange={e=>setNote(e.target.value)} placeholder="es. cena con amici" style={inputStyle} /></Field>
      <Field label="Viaggio (opzionale)">
        <input value={trip} onChange={e=>setTrip(e.target.value)} placeholder="es. Grecia 2026" list="trip-tags-list" style={inputStyle} />
        <datalist id="trip-tags-list">
          {existingTrips.map(t => <option key={t} value={t} />)}
        </datalist>
      </Field>
      <div style={{ display: "flex", gap: 8 }}>
        <button type="submit" style={{ ...btnPrimary, justifyContent: "center", flex: 1 }}><span>✓</span> {initial ? "Salva modifiche" : "Salva transazione"}</button>
        {initial && <button type="button" onClick={onCancel} style={{ ...btnPrimary, background: TOKENS.paper2, color: TOKENS.ink }}>Annulla</button>}
      </div>
    </form>
  );
}

/* ---------- Categorie ---------- */

function Categorie({ categories, transactions, archives, onAdd, onUpdate, onRemove, onCloseYear, onEditArchiveIncome }) {
  const [showForm, setShowForm] = useState(false);
  const [confirmId, setConfirmId] = useState(null);
  const [yearToClose, setYearToClose] = useState("");
  const [yearToFix, setYearToFix] = useState("");
  const [incomeFix, setIncomeFix] = useState("");

  const liveYears = useMemo(() => {
    const ys = new Set(transactions.map(t => t.date.slice(0, 4)));
    ys.add(String(new Date().getFullYear()));
    return Array.from(ys);
  }, [transactions]);
  const archivedYearSet = useMemo(() => new Set(archives.map(a => a.year)), [archives]);
  const years = useMemo(() => Array.from(new Set([...liveYears, ...archivedYearSet])).sort().reverse(), [liveYears, archivedYearSet]);

  // righe: categorie di spesa attuali + eventuali categorie storiche non più esistenti ma presenti negli archivi
  const rows = useMemo(() => {
    const currentExpenseIds = new Set(categories.filter(c => c.type === "expense").map(c => c.id));
    const allIds = new Set(currentExpenseIds);
    archives.forEach(a => Object.keys(a.categoryTotals || {}).forEach(id => allIds.add(id)));
    return Array.from(allIds).map(id => {
      const live = categories.find(c => c.id === id);
      let fallback = null;
      archives.forEach(a => { if (a.categoryNames && a.categoryNames[id]) fallback = a.categoryNames[id]; });
      return { id, name: live?.name || fallback?.name || "Categoria eliminata", icon: live?.icon || fallback?.icon || "🗂️" };
    });
  }, [categories, archives]);

  function cellValue(rowId, year) {
    if (archivedYearSet.has(year)) {
      const a = archives.find(x => x.year === year);
      return (a && a.categoryTotals[rowId]) || 0;
    }
    return transactions.filter(t => t.categoryId === rowId && t.type === "expense" && t.date.slice(0, 4) === year).reduce((s, t) => s + t.amount, 0);
  }
  function yearTotal(year) {
    if (archivedYearSet.has(year)) {
      const a = archives.find(x => x.year === year);
      return a ? a.totalExpense : 0;
    }
    return transactions.filter(t => t.type === "expense" && t.date.slice(0, 4) === year).reduce((s, t) => s + t.amount, 0);
  }

  const closableYears = liveYears.filter(y => transactions.some(t => t.date.slice(0,4) === y)).sort().reverse();

  return (
    <>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <h3 style={S.sectionTitle}>Le tue categorie</h3>
        <button onClick={()=>setShowForm(s=>!s)} style={btnPrimary}><span>{showForm ? "✕" : "+"}</span> {showForm ? "Chiudi" : "Nuova"}</button>
      </div>
      <p style={{ color: TOKENS.inkSoft, fontSize: 12.5, margin: "-10px 0 4px" }}>Imposta un budget mensile sulle categorie di spesa per ricevere un avviso automatico in dashboard quando ti avvicini al limite.</p>

      {showForm && <CatForm onSubmit={(c)=>{ onAdd(c); setShowForm(false); }} />}

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(170px,1fr))", gap: 8 }}>
        {categories.map(c => (
          <div key={c.id} style={{ ...S.card, padding: 10, display: "flex", flexDirection: "column", gap: 6 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 18 }}>{c.icon}</span>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 13, fontWeight: 500, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{c.name}</div>
                <div style={{ fontSize: 10.5, color: TOKENS.inkSoft, fontFamily: "'IBM Plex Mono', monospace" }}>{c.type === "income" ? "entrata" : "uscita"}</div>
              </div>
              <button onClick={() => confirmId === c.id ? (onRemove(c.id), setConfirmId(null)) : setConfirmId(c.id)}
                style={{ border: "none", background: "transparent", color: confirmId === c.id ? TOKENS.negative : TOKENS.line, cursor: "pointer", flexShrink: 0 }}>
                🗑
              </button>
            </div>
            {c.type === "expense" && (
              <input type="number" min="0" placeholder="budget mensile €" value={c.budget || ""} onChange={e=>onUpdate(c.id, { budget: parseFloat(e.target.value) || 0 })}
                style={{ ...inputStyle, padding: "5px 8px" }} />
            )}
          </div>
        ))}
      </div>

      <div style={S.card}>
        <h3 style={S.sectionTitle}>Confronto per anno</h3>
        <div style={{ overflowX: "auto" }}>
          <div style={{ minWidth: 340 }}>
            <div style={{ display: "grid", gridTemplateColumns: `1.4fr repeat(${years.length}, 1fr)`, fontSize: 11, letterSpacing: 1, color: TOKENS.inkSoft, fontFamily: "'IBM Plex Mono', monospace", padding: "0 0 8px", borderBottom: `1px solid ${TOKENS.ink}` }}>
              <span>CATEGORIA</span>
              {years.map(y => <span key={y} style={{ textAlign: "right" }}>{y}{archivedYearSet.has(y) ? " 🔒" : ""}</span>)}
            </div>
            {rows.map(row => (
              <div key={row.id} style={{ display: "grid", gridTemplateColumns: `1.4fr repeat(${years.length}, 1fr)`, fontSize: 13, padding: "8px 0", borderBottom: `1px solid ${TOKENS.line}` }}>
                <span>{row.icon} {row.name}</span>
                {years.map(y => {
                  const v = cellValue(row.id, y);
                  return <span key={y} style={{ textAlign: "right", fontFamily: "'IBM Plex Mono', monospace", color: v ? TOKENS.ink : TOKENS.line }}>{v ? eur(v) : "—"}</span>;
                })}
              </div>
            ))}
            <div style={{ display: "grid", gridTemplateColumns: `1.4fr repeat(${years.length}, 1fr)`, fontSize: 13.5, fontWeight: 600, padding: "10px 0 0" }}>
              <span>Totale spese</span>
              {years.map(y => <span key={y} style={{ textAlign: "right", fontFamily: "'IBM Plex Mono', monospace", color: TOKENS.negative }}>{eur(yearTotal(y))}</span>)}
            </div>
          </div>
        </div>
        {archives.length > 0 && <p style={{ fontSize: 11.5, color: TOKENS.inkSoft, marginTop: 10 }}>🔒 = anno archiviato: le transazioni di dettaglio sono state eliminate, resta solo il totale per categoria.</p>}
      </div>

      <div style={S.card}>
        <h3 style={S.sectionTitle}>Chiudi un anno</h3>
        <p style={{ color: TOKENS.inkSoft, fontSize: 13.5, lineHeight: 1.6, margin: "0 0 12px" }}>
          Gli anni ormai passati vengono chiusi da soli al primo avvio dell'app nell'anno nuovo: Registro calcola il totale per categoria (la tabella qui sopra), lo conserva per sempre, e cancella le singole transazioni per non appesantire l'app e il foglio di backup. Da qui puoi anche chiudere manualmente un anno in anticipo, se vuoi.
        </p>
        {closableYears.length === 0 ? (
          <p style={{ color: TOKENS.inkSoft, fontSize: 13.5 }}>Non ci sono anni con transazioni da chiudere al momento.</p>
        ) : (
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
            <select value={yearToClose} onChange={e=>setYearToClose(e.target.value)} style={inputStyle}>
              <option value="">Scegli l'anno…</option>
              {closableYears.map(y => <option key={y} value={y}>{y}{y === String(new Date().getFullYear()) ? " (in corso)" : ""}</option>)}
            </select>
            <button onClick={()=>{ if(yearToClose){ onCloseYear(yearToClose); setYearToClose(""); } }} disabled={!yearToClose}
              style={{ ...btnPrimary, background: TOKENS.negative }}>
              🔒 Chiudi e archivia
            </button>
          </div>
        )}
      </div>

      {archives.length > 0 && (
        <div style={S.card}>
          <h3 style={S.sectionTitle}>Correggi le entrate di un anno archiviato</h3>
          <p style={{ color: TOKENS.inkSoft, fontSize: 13.5, lineHeight: 1.6, margin: "0 0 12px" }}>
            Per gli anni chiusi prima di questa versione, o importati da un'altra fonte, le entrate potrebbero mancare (impostate a zero) — cosa che rende il saldo totale in alto poco preciso. Se conosci l'entrata reale di quell'anno, correggila qui.
          </p>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
            <select value={yearToFix} onChange={e=>{ setYearToFix(e.target.value); const a = archives.find(x=>x.year===e.target.value); setIncomeFix(a ? String(a.totalIncome || "") : ""); }} style={inputStyle}>
              <option value="">Scegli l'anno…</option>
              {archives.map(a => <option key={a.year} value={a.year}>{a.year} (entrate attuali: {eur(a.totalIncome || 0)})</option>)}
            </select>
            <input type="number" min="0" step="0.01" value={incomeFix} onChange={e=>setIncomeFix(e.target.value)} placeholder="entrate reali €" style={{ ...inputStyle, maxWidth: 160 }} disabled={!yearToFix} />
            <button onClick={()=>{ if(yearToFix){ onEditArchiveIncome(yearToFix, parseFloat(incomeFix) || 0); setYearToFix(""); setIncomeFix(""); } }} disabled={!yearToFix}
              style={btnPrimary}>
              <span>✓</span> Salva
            </button>
          </div>
        </div>
      )}
    </>
  );
}

function CatForm({ onSubmit }) {
  const [name, setName] = useState("");
  const [icon, setIcon] = useState("🏷️");
  const [type, setType] = useState("expense");
  const [color, setColor] = useState("#2F6F5E");

  function submit(e) {
    e.preventDefault();
    if (!name.trim()) return;
    onSubmit({ name: name.trim(), icon: icon || "🏷️", type, color, budget: 0 });
  }

  return (
    <form onSubmit={submit} style={{ ...S.card, display: "flex", flexDirection: "column", gap: 12 }}>
      <div style={{ display: "grid", gridTemplateColumns: "60px 1fr", gap: 10 }}>
        <Field label="Icona"><input value={icon} onChange={e=>setIcon(e.target.value)} maxLength={2} style={{ ...inputStyle, textAlign: "center" }} /></Field>
        <Field label="Nome"><input value={name} onChange={e=>setName(e.target.value)} placeholder="es. Regali" style={inputStyle} /></Field>
      </div>
      <div className="grid-2" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        <Field label="Tipo">
          <select value={type} onChange={e=>setType(e.target.value)} style={inputStyle}>
            <option value="expense">Uscita</option><option value="income">Entrata</option>
          </select>
        </Field>
        <Field label="Colore"><input type="color" value={color} onChange={e=>setColor(e.target.value)} style={{ ...inputStyle, padding: 3, height: 38 }} /></Field>
      </div>
      <button type="submit" style={{ ...btnPrimary, justifyContent: "center" }}><span>✓</span> Aggiungi categoria</button>
