}


/* ---------- Backup su Google Sheets ---------- */

function Backup({ sheetUrl, onSaveUrl, lastSync, lastPull, syncing, pulling, onSyncAll, onPull, count, pendingCount, syncFailStreak, onExport, onImportFile }) {
  const [draft, setDraft] = useState(sheetUrl);
  const [openGuide, setOpenGuide] = useState(!sheetUrl);
  const [copied, setCopied] = useState(false);
  const fileInputRef = useRef(null);

  function copyCode() {
    navigator.clipboard.writeText(APPS_SCRIPT_CODE).then(() => { setCopied(true); setTimeout(()=>setCopied(false), 1800); });
  }

  return (
    <>
      {sheetUrl && syncFailStreak >= 3 && (
        <div style={{ ...S.card, padding: "12px 16px", display: "flex", alignItems: "center", gap: 10, background: TOKENS.negativeSoft, boxShadow: "none" }}>
          <span style={{ fontSize: 16 }}>⚠️</span>
          <div style={{ flex: 1, fontSize: 13.5 }}>
            Il collegamento al foglio Google non risponde da un po': controlla che l'URL qui sotto sia ancora corretto e che il deployment su Google sia ancora attivo.
          </div>
        </div>
      )}

      <div style={{ ...S.card, display: "flex", flexDirection: "column", gap: 4 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <div style={{ width: 10, height: 10, borderRadius: "50%", background: sheetUrl ? TOKENS.accent : TOKENS.line, flexShrink: 0 }} />
          <h3 style={{ ...S.sectionTitle, margin: 0 }}>{sheetUrl ? "Collegato a Google Sheets" : "Non ancora collegato"}</h3>
        </div>
        <p style={{ color: TOKENS.inkSoft, fontSize: 13.5, lineHeight: 1.6, margin: "6px 0 14px" }}>
          Ogni transazione nuova si invia da sola quando la aggiungi, e ogni 5 minuti l'app controlla il foglio e aggiunge in automatico quelle inserite da un altro dispositivo — utile se usi telefono e computer nella stessa giornata. Modifiche ed eliminazioni fatte altrove, invece, non si propagano da sole: per quelle usa "Carica da questo foglio" qui sotto, che sostituisce tutto con l'ultima versione del foglio.
        </p>
        <Field label="URL dell'Apps Script (Web App)">
          <input value={draft} onChange={e=>setDraft(e.target.value)} placeholder="https://script.google.com/macros/s/…/exec" style={inputStyle} />
        </Field>
        <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
          <button onClick={()=>onSaveUrl(draft.trim())} style={btnPrimary}><span>✓</span> Salva collegamento</button>
          {sheetUrl && (
            <button onClick={onSyncAll} disabled={syncing} style={{ ...btnPrimary, background: TOKENS.paper2, color: TOKENS.ink }}>
              <span>⟳</span> {syncing ? "Sincronizzo…" : `Invia tutto al foglio (${count})`}
            </button>
          )}
          {sheetUrl && (
            <button onClick={onPull} disabled={pulling} style={{ ...btnPrimary, background: TOKENS.amberSoft, color: TOKENS.ink }}>
              <span>⬇</span> {pulling ? "Carico…" : "Carica da questo foglio"}
            </button>
          )}
        </div>
        {sheetUrl && (
          <p style={{ fontSize: 12, color: TOKENS.inkSoft, marginTop: 10, fontFamily: "'IBM Plex Mono', monospace" }}>
            ultimo invio: {timeAgo(lastSync)} · ultimo caricamento: {timeAgo(lastPull)}
            {pendingCount > 0 && <span style={{ color: TOKENS.amber }}> · {pendingCount} in attesa di rete</span>}
          </p>
        )}
      </div>

      <div style={S.card}>
        <h3 style={S.sectionTitle}>Backup locale</h3>
        <p style={{ color: TOKENS.inkSoft, fontSize: 13.5, lineHeight: 1.6, margin: "0 0 12px" }}>
          Un file sul tuo dispositivo, indipendente da Google: utile come rete di sicurezza in più, ad esempio prima di svuotare la cache del browser.
        </p>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button onClick={onExport} style={btnPrimary}><span>⬇</span> Scarica una copia</button>
          <button onClick={()=>fileInputRef.current?.click()} style={{ ...btnPrimary, background: TOKENS.paper2, color: TOKENS.ink }}><span>⬆</span> Ripristina da file</button>
          <input ref={fileInputRef} type="file" accept="application/json" style={{ display: "none" }}
            onChange={e => { const f = e.target.files?.[0]; onImportFile(f); e.target.value = ""; }} />
        </div>
      </div>

      <div style={S.card}>
        <button onClick={()=>setOpenGuide(o=>!o)} style={{ width: "100%", display: "flex", justifyContent: "space-between", alignItems: "center", background: "none", border: "none", cursor: "pointer", padding: 0 }}>
          <h3 style={{ ...S.sectionTitle, margin: 0 }}>Come creare il collegamento (5 minuti)</h3>
          <span style={{ transform: openGuide ? "rotate(180deg)" : "none", transition: "transform .2s", color: TOKENS.inkSoft, display: "inline-block" }}>▾</span>
        </button>
        {openGuide && (
          <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 10 }}>
            {[
              "Apri Google Sheets e crea un nuovo foglio vuoto (sarà il tuo backup, non serve intestarlo).",
              "Vai su Estensioni → Apps Script. Si apre un editor con del codice di esempio: cancellalo tutto.",
              "Incolla il codice qui sotto (tocca l'icona per copiarlo) e salva (icona a forma di dischetto).",
              "Clicca su Esegui il deployment → Nuovo deployment → tipo Web app.",
              "Imposta \"Esegui come\": Me, e \"Chi ha accesso\": Chiunque. Poi Esegui il deployment.",
              "Google chiederà di autorizzare lo script al primo avvio: sei tu il proprietario, quindi conferma.",
              "Copia l'URL che termina in /exec e incollalo nel campo sopra, su ogni dispositivo su cui apri l'app.",
            ].map((step, i) => (
              <div key={i} style={{ display: "flex", gap: 10, fontSize: 13.5, lineHeight: 1.5 }}>
                <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: TOKENS.amber, flexShrink: 0 }}>{String(i+1).padStart(2,"0")}</span>
                <span>{step}</span>
              </div>
            ))}
            <div style={{ position: "relative", marginTop: 6 }}>
              <pre style={{ background: TOKENS.ink, color: "#E7E3D8", fontSize: 11.5, padding: 14, borderRadius: 10, overflowX: "auto", fontFamily: "'IBM Plex Mono', monospace", lineHeight: 1.6, margin: 0 }}>{APPS_SCRIPT_CODE}</pre>
              <button onClick={copyCode} style={{ position: "absolute", top: 8, right: 8, border: "none", background: "rgba(255,255,255,0.12)", color: "#fff", borderRadius: 6, padding: "5px 8px", cursor: "pointer", display: "flex", alignItems: "center", gap: 4, fontSize: 11 }}>
                <span>{copied ? "✓✓" : "⧉"}</span> {copied ? "copiato" : "copia"}
              </button>
            </div>
            <p style={{ fontSize: 12, color: TOKENS.inkSoft, lineHeight: 1.6, marginTop: 4 }}>
              Nota: l'URL dà lettura e scrittura su quel foglio a chiunque lo conosca — non condividerlo. "Invia tutto al foglio" spedisce le transazioni evitando duplicati; "Carica da questo foglio" fa il percorso inverso e sostituisce i dati locali, utile appena apri l'app su un nuovo dispositivo.
            </p>
            <p style={{ fontSize: 12, color: TOKENS.inkSoft, lineHeight: 1.6, marginTop: 0 }}>
              Per tenerlo leggero nel tempo, ci sono due livelli: lo script crea da solo un tab per anno (2026, 2027…) invece di un unico elenco infinito; e quando in Categorie usi "Chiudi un anno", quel tab con le transazioni sparisce del tutto dal foglio e resta solo una riga di totale per categoria nel tab "Archivio" — permanente, leggerissimo, per sempre.
            </p>
          </div>
        )}
      </div>
    </>
  );
}

/* ---------- Risparmi ---------- */

function Risparmi({ savings, onAdd, onRemove }) {
  const [showForm, setShowForm] = useState(false);
  const [confirmId, setConfirmId] = useState(null);
  const [adjusting, setAdjusting] = useState(false);
  const [adjustValue, setAdjustValue] = useState("");

  const total = savings.reduce((s, m) => s + (m.type === "prelievo" ? -m.amount : m.amount), 0);

  function submitAdjust(e) {
    e.preventDefault();
    const target = parseFloat(String(adjustValue).replace(",", "."));
    if (isNaN(target)) return;
    const diff = +(target - total).toFixed(2);
    if (diff === 0) { setAdjusting(false); setAdjustValue(""); return; }
    onAdd({ type: diff > 0 ? "versamento" : "prelievo", amount: Math.abs(diff), date: todayISO(), note: "Rettifica saldo (es. arrotondamenti)" });
    setAdjusting(false); setAdjustValue("");
  }

  const sorted = useMemo(() => [...savings].sort((a, b) => a.date.localeCompare(b.date)), [savings]);
  const chartData = useMemo(() => {
    let running = 0;
    return sorted.map(m => {
      running += m.type === "prelievo" ? -m.amount : m.amount;
      return { date: m.date, label: new Date(m.date).toLocaleDateString("it-IT", { day: "2-digit", month: "short" }), value: +running.toFixed(2) };
    });
  }, [sorted]);

  return (
    <>
      <div style={S.card}>
        <p style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 1.5, color: TOKENS.amber, margin: "0 0 4px" }}>RISPARMI</p>
        <div style={{ fontFamily: "'Fraunces', serif", fontSize: 30, fontWeight: 600, color: TOKENS.accent }}>{eur(total)}</div>
        <p style={{ color: TOKENS.inkSoft, fontSize: 12.5, margin: "4px 0 0", lineHeight: 1.5 }}>
          Aggiornato a mano — utile per arrotondamenti, interessi o versamenti su un fondo separato (es. il "salvadanaio" di un conto), tenuto distinto dalle spese normali.
        </p>
        {!adjusting ? (
          <button onClick={()=>{ setAdjusting(true); setAdjustValue(total.toFixed(2)); }} style={{ ...btnPrimary, background: TOKENS.paper2, color: TOKENS.ink, marginTop: 12 }}>
            <span>⚖️</span> Aggiusta saldo
          </button>
        ) : (
          <form onSubmit={submitAdjust} style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 12, flexWrap: "wrap" }}>
            <Field label="Saldo reale attuale (€)">
              <input type="number" step="0.01" value={adjustValue} onChange={e=>setAdjustValue(e.target.value)} style={{ ...inputStyle, maxWidth: 160 }} autoFocus />
            </Field>
            <button type="submit" style={btnPrimary}><span>✓</span> Applica</button>
            <button type="button" onClick={()=>{ setAdjusting(false); setAdjustValue(""); }} style={{ ...btnPrimary, background: TOKENS.paper2, color: TOKENS.ink }}>Annulla</button>
          </form>
        )}
      </div>

      {chartData.length >= 2 && (
        <div style={S.card}>
          <h3 style={S.sectionTitle}>Andamento</h3>
          <ResponsiveContainer width="100%" height={180}>
            <AreaChart data={chartData} margin={{ top: 4, right: 4, left: -18, bottom: 0 }}>
              <defs>
                <linearGradient id="gSav" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="5%" stopColor={TOKENS.accent} stopOpacity={0.35}/>
                  <stop offset="95%" stopColor={TOKENS.accent} stopOpacity={0}/>
                </linearGradient>
              </defs>
              <CartesianGrid stroke={TOKENS.line} vertical={false} />
              <XAxis dataKey="label" tick={{ fontSize: 11, fill: TOKENS.inkSoft, fontFamily: "IBM Plex Mono" }} axisLine={{ stroke: TOKENS.line }} tickLine={false} />
              <YAxis tick={{ fontSize: 11, fill: TOKENS.inkSoft, fontFamily: "IBM Plex Mono" }} axisLine={false} tickLine={false} width={46} />
              <Tooltip formatter={(v) => eur(v)} contentStyle={{ fontFamily: "Inter", fontSize: 12, border: `1px solid ${TOKENS.line}`, borderRadius: 8 }} />
              <Area type="monotone" dataKey="value" stroke={TOKENS.accent} fill="url(#gSav)" strokeWidth={2} />
            </AreaChart>
          </ResponsiveContainer>
        </div>
      )}

      <div style={{ display: "flex", justifyContent: "flex-end" }}>
        <button onClick={()=>setShowForm(s=>!s)} style={btnPrimary}><span>{showForm ? "✕" : "+"}</span> {showForm ? "Chiudi" : "Nuovo movimento"}</button>
      </div>

      {showForm && <SavingForm onSubmit={(m)=>{ onAdd(m); setShowForm(false); }} />}

      <div style={{ ...S.card, padding: 0, overflow: "hidden" }}>
        {savings.length === 0 ? (
          <p style={{ color: TOKENS.inkSoft, fontSize: 13.5, padding: 18, margin: 0 }}>Nessun movimento ancora. Aggiungi il primo con "Nuovo movimento".</p>
        ) : [...savings].sort((a,b) => b.date.localeCompare(a.date)).map((m, i, arr) => (
          <div key={m.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 16px", borderBottom: i === arr.length-1 ? "none" : `1px solid ${TOKENS.line}` }}>
            <div style={{ width: 34, height: 34, borderRadius: 8, background: (m.type === "prelievo" ? TOKENS.negative : TOKENS.accent)+"22", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16, flexShrink: 0 }}>
              {m.type === "prelievo" ? "↘" : "🏦"}
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 14, fontWeight: 500 }}>{m.note || (m.type === "prelievo" ? "Prelievo" : "Versamento")}</div>
              <div style={{ fontSize: 12, color: TOKENS.inkSoft, fontFamily: "'IBM Plex Mono', monospace" }}>
                {new Date(m.date).toLocaleDateString("it-IT", { day: "2-digit", month: "short", year: "numeric" })}
              </div>
            </div>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontWeight: 600, fontSize: 14.5, color: m.type === "prelievo" ? TOKENS.negative : TOKENS.accent, whiteSpace: "nowrap" }}>
              {m.type === "prelievo" ? "−" : "+"}{eur(m.amount)}
            </div>
            <button onClick={() => confirmId === m.id ? (onRemove(m.id), setConfirmId(null)) : setConfirmId(m.id)}
              style={{ border: "none", background: confirmId === m.id ? TOKENS.negative : "transparent", color: confirmId === m.id ? "#fff" : TOKENS.inkSoft, borderRadius: 6, padding: "6px 8px", cursor: "pointer", fontSize: 11, display: "flex", alignItems: "center", gap: 4, flexShrink: 0 }}>
              <span>🗑</span>{confirmId === m.id ? "conferma" : ""}
            </button>
          </div>
        ))}
      </div>
    </>
  );
}

function SavingForm({ onSubmit }) {
  const [type, setType] = useState("versamento");
  const [amount, setAmount] = useState("");
  const [date, setDate] = useState(todayISO());
  const [note, setNote] = useState("");

  function submit(e) {
    e.preventDefault();
    const n = parseFloat(String(amount).replace(",", "."));
    if (!n || n <= 0) return;
    onSubmit({ type, amount: n, date, note: note.trim() });
  }

  return (
    <form onSubmit={submit} style={{ ...S.card, display: "flex", flexDirection: "column", gap: 12 }}>
      <div style={{ display: "flex", gap: 6 }}>
        {[["versamento","Versamento"],["prelievo","Prelievo"]].map(([v,l]) => (
          <button type="button" key={v} onClick={()=>setType(v)} style={{
            flex: 1, padding: "9px 0", borderRadius: 8, cursor: "pointer", fontSize: 13.5, fontWeight: 500, border: "none",
            background: type===v ? (v==="versamento"?TOKENS.accentSoft:TOKENS.negativeSoft) : TOKENS.paper2,
            color: type===v ? (v==="versamento"?TOKENS.accent:TOKENS.negative) : TOKENS.inkSoft,
          }}>{l}</button>
        ))}
      </div>
      <div className="grid-2" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        <Field label="Importo (€)"><input required type="number" step="0.01" min="0" value={amount} onChange={e=>setAmount(e.target.value)} placeholder="0.00" style={inputStyle} /></Field>
        <Field label="Data"><input type="date" value={date} onChange={e=>setDate(e.target.value)} style={inputStyle} /></Field>
      </div>
      <Field label="Nota (opzionale)"><input value={note} onChange={e=>setNote(e.target.value)} placeholder="es. arrotondamenti, interessi" style={inputStyle} /></Field>
      <button type="submit" style={{ ...btnPrimary, justifyContent: "center" }}><span>✓</span> Salva movimento</button>
    </form>
  );
}

/* ---------- pezzi UI condivisi ---------- */

function Field({ label, children }) {
  return (
    <label style={{ display: "flex", flexDirection: "column", gap: 5, fontSize: 12, color: TOKENS.inkSoft }}>
      {label}
      {children}
    </label>
  );
}
function SelectPill({ value, onChange, options }) {
  return (
    <select value={value} onChange={e=>onChange(e.target.value)} style={pillSelectStyle}>
      {options.map(([v,l]) => <option key={v} value={v}>{l}</option>)}
    </select>
  );
}

const inputStyle = { padding: "9px 10px", borderRadius: 8, border: `1px solid ${TOKENS.line}`, fontSize: 16, background: "#fff", color: TOKENS.ink, width: "100%" };
const pillSelectStyle = { padding: "7px 10px", borderRadius: 999, border: "none", fontSize: 16, background: TOKENS.paper2, color: TOKENS.inkSoft };
const btnPrimary = { display: "flex", alignItems: "center", gap: 6, padding: "9px 14px", borderRadius: 8, border: "none", background: TOKENS.ink, color: TOKENS.paper, fontSize: 13.5, fontWeight: 500, cursor: "pointer" };

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
</html>
