const { useState, useEffect, useMemo, useRef } = React;

/* ---------- dati di partenza ---------- */

const DEFAULT_CATEGORIES = [

const APP_VERSION = "1.24.1";
const APPS_SCRIPT_CODE = `function getSheetForDate(ss, dateStr) {
  var year = String(dateStr).slice(0, 4);
  var sheet = ss.getSheetByName(year);
  if (!sheet) {
    sheet = ss.insertSheet(year);
    sheet.appendRow(['ID','Tipo','Importo','Categoria','Data','Nota','Viaggio','Eliminato']);
  }
  return sheet;
}

function markDeletedById(sheet, id, col) {
  var data = sheet.getDataRange().getValues();
  for (var i = 1; i < data.length; i++) {
    if (data[i][0] === id) { sheet.getRange(i + 1, col).setValue(true); return true; }
  }
  return false;
}

function doPost(e) {
  var body = JSON.parse(e.postData.contents);
  var ss = SpreadsheetApp.getActiveSpreadsheet();

  if (body.action === 'append') {
    var t = body.tx;
    var sheet = getSheetForDate(ss, t.date);
    sheet.appendRow([t.id, t.type, t.amount, t.categoryName, t.date, t.note || '', t.trip || '', false]);

  } else if (body.action === 'delete') {
    ss.getSheets().forEach(function(sheet) {
      if (!/^\\d{4}$/.test(sheet.getName())) return;
      markDeletedById(sheet, body.id, 8);
    });

  } else if (body.action === 'update') {
    ss.getSheets().forEach(function(sheet) {
      if (!/^\\d{4}$/.test(sheet.getName())) return;
      markDeletedById(sheet, body.id, 8);
    });
    var ut = body.tx;
    var usheet = getSheetForDate(ss, ut.date);
    usheet.appendRow([ut.id, ut.type, ut.amount, ut.categoryName, ut.date, ut.note || '', ut.trip || '', false]);

  } else if (body.action === 'bulk') {
    var byYear = {};
    body.txs.forEach(function(t) {
      var y = String(t.date).slice(0, 4);
      if (!byYear[y]) byYear[y] = [];
      byYear[y].push(t);
    });
    Object.keys(byYear).forEach(function(y) {
      var sheet = getSheetForDate(ss, byYear[y][0].date);
      var existing = sheet.getDataRange().getValues().slice(1).map(function(r){ return r[0]; });
      byYear[y].forEach(function(t) {
        if (existing.indexOf(t.id) === -1) {
          sheet.appendRow([t.id, t.type, t.amount, t.categoryName, t.date, t.note || '', t.trip || '', false]);
        }
      });
    });

  } else if (body.action === 'closeYear') {
    var year = String(body.year);
    var arch = ss.getSheetByName('Archivio') || ss.insertSheet('Archivio');
    if (arch.getLastRow() === 0) arch.appendRow(['Anno', 'Categoria', 'Totale']);
    var adata = arch.getDataRange().getValues();
    for (var j = adata.length - 1; j >= 1; j--) {
      if (String(adata[j][0]) === year) arch.deleteRow(j + 1);
    }
    (body.categories || []).forEach(function(c) {
      arch.appendRow([year, c.name, c.total]);
    });
    arch.appendRow([year, '__Entrate__', body.totalIncome || 0]);
    var yearSheet = ss.getSheetByName(year);
    if (yearSheet) ss.deleteSheet(yearSheet);

  } else if (body.action === 'categoriesSync') {
    var csheet = ss.getSheetByName('Categorie') || ss.insertSheet('Categorie');
    if (csheet.getLastRow() === 0) csheet.appendRow(['ID', 'Nome', 'Icona', 'Colore', 'Tipo', 'Budget', 'Eliminato']);
    var cdata = csheet.getDataRange().getValues();
    var idRow = {};
    for (var ci = 1; ci < cdata.length; ci++) idRow[cdata[ci][0]] = ci + 1;
    (body.categories || []).forEach(function(c) {
      var row = [c.id, c.name, c.icon, c.color, c.type, c.budget || 0, false];
      if (idRow[c.id]) csheet.getRange(idRow[c.id], 1, 1, 7).setValues([row]);
      else { csheet.appendRow(row); idRow[c.id] = csheet.getLastRow(); }
    });

  } else if (body.action === 'categoryDelete') {
    var csheet2 = ss.getSheetByName('Categorie');
    if (csheet2) markDeletedById(csheet2, body.id, 7);

  } else if (body.action === 'savingAppend') {
    var ssheet = ss.getSheetByName('Risparmi') || ss.insertSheet('Risparmi');
    if (ssheet.getLastRow() === 0) ssheet.appendRow(['ID', 'Tipo', 'Importo', 'Data', 'Nota', 'Eliminato']);
    var sv = body.saving;
    ssheet.appendRow([sv.id, sv.type, sv.amount, sv.date, sv.note || '', false]);

  } else if (body.action === 'savingDelete') {
    var ssheet2 = ss.getSheetByName('Risparmi');
    if (ssheet2) markDeletedById(ssheet2, body.id, 6);

  } else if (body.action === 'profileSync') {
    var psheet = ss.getSheetByName('Profilo') || ss.insertSheet('Profilo');
    if (psheet.getLastRow() === 0) psheet.appendRow(['Nome', 'DataNascita']);
    var prow = [body.name || '', body.birthdate || ''];
    if (psheet.getLastRow() < 2) psheet.appendRow(prow);
    else psheet.getRange(2, 1, 1, 2).setValues([prow]);
  }
  return ContentService.createTextOutput(JSON.stringify({ ok: true })).setMimeType(ContentService.MimeType.JSON);
}

function doGet(e) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var tz = Session.getScriptTimeZone();
  var out = { transactions: [], archives: [], categories: [], savings: [], deletedTransactionIds: [], deletedCategoryIds: [], deletedSavingIds: [], profile: null };

  ss.getSheets().forEach(function(sheet) {
    if (!/^\\d{4}$/.test(sheet.getName())) return;
    if (sheet.getLastRow() <= 1) return;
    var rows = sheet.getDataRange().getValues().slice(1);
    rows.forEach(function(r) {
      if (r[7] === true) { out.deletedTransactionIds.push(r[0]); return; }
      var d = r[4];
      var dateStr = (d instanceof Date) ? Utilities.formatDate(d, tz, 'yyyy-MM-dd') : String(d);
      out.transactions.push({ id: r[0], type: r[1], amount: r[2], categoryName: r[3], date: dateStr, note: r[5] || '', trip: r[6] || '' });
    });
  });

  var arch = ss.getSheetByName('Archivio');
  if (arch && arch.getLastRow() > 1) {
    var byYear = {};
    var incomeByYear = {};
    arch.getDataRange().getValues().slice(1).forEach(function(r) {
      var y = String(r[0]);
      if (r[1] === '__Entrate__') { incomeByYear[y] = r[2]; return; }
      if (!byYear[y]) byYear[y] = {};
      byYear[y][r[1]] = r[2];
    });
    Object.keys(byYear).forEach(function(y) {
      out.archives.push({ year: y, categoryTotals: byYear[y], income: incomeByYear[y] || 0 });
    });
  }

  var csheet3 = ss.getSheetByName('Categorie');
  if (csheet3 && csheet3.getLastRow() > 1) {
    csheet3.getDataRange().getValues().slice(1).forEach(function(r) {
      if (r[6] === true) { out.deletedCategoryIds.push(r[0]); return; }
      out.categories.push({ id: r[0], name: r[1], icon: r[2], color: r[3], type: r[4], budget: r[5] || 0 });
    });
  }

  var ssheet3 = ss.getSheetByName('Risparmi');
  if (ssheet3 && ssheet3.getLastRow() > 1) {
    ssheet3.getDataRange().getValues().slice(1).forEach(function(r) {
      if (r[5] === true) { out.deletedSavingIds.push(r[0]); return; }
      var sd = r[3];
      var sdateStr = (sd instanceof Date) ? Utilities.formatDate(sd, tz, 'yyyy-MM-dd') : String(sd);
      out.savings.push({ id: r[0], type: r[1], amount: r[2], date: sdateStr, note: r[4] || '' });
    });
  }

  var psheet3 = ss.getSheetByName('Profilo');
  if (psheet3 && psheet3.getLastRow() > 1) {
    var prow = psheet3.getDataRange().getValues()[1];
    var pbirth = prow[1];
    var pbirthStr = (pbirth instanceof Date) ? Utilities.formatDate(pbirth, tz, 'yyyy-MM-dd') : String(pbirth || '');
    out.profile = { name: prow[0] || '', birthdate: pbirthStr };
  }

  return ContentService.createTextOutput(JSON.stringify(out)).setMimeType(ContentService.MimeType.JSON);
}`;

const LEVELS_UNUSED = null;
const todayISO = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
};
const thisMonthKeyLocal = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
};
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const eur = (n) => new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR" }).format(n || 0);
const monthKey = (d) => d.slice(0, 7);
const monthLabel = (k) => {
  const [y, m] = k.split("-");
  return new Date(Number(y), Number(m) - 1, 1).toLocaleDateString("it-IT", { month: "short", year: "numeric" });
};
const timeAgo = (iso) => {
  if (!iso) return "mai";
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return "adesso";
  if (diff < 3600) return `${Math.floor(diff / 60)} min fa`;
  if (diff < 86400) return `${Math.floor(diff / 3600)} h fa`;
  return `${Math.floor(diff / 86400)} g fa`;
};

/* ---------- persistenza locale (nel browser del dispositivo) ---------- */

function loadKey(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    if (v) return JSON.parse(v);
  } catch (e) { /* valore assente o non valido, uso il default */ }
  return fallback;
}
function saveKey(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { console.error("storage error", key, e); }
}

function App() {
  const [tab, setTab] = useState("dashboard");
  const [categories, setCategories] = useState(() => loadKey("categories", DEFAULT_CATEGORIES));
  const [transactions, setTransactions] = useState(() => loadKey("transactions", []));
  const [archives, setArchives] = useState(() => loadKey("archives", []));
  const [savings, setSavings] = useState(() => loadKey("savings", []));
  const [profileName, setProfileNameState] = useState(() => loadKey("profile-name", ""));
  const [profileBirthdate, setProfileBirthdateState] = useState(() => loadKey("profile-birthdate", ""));
  const [sheetUrl, setSheetUrlState] = useState(() => loadKey("sheet-url", ""));
  const [lastSync, setLastSync] = useState(() => loadKey("last-sync", ""));
  const [lastPull, setLastPull] = useState(() => loadKey("last-pull", ""));
  const [syncing, setSyncing] = useState(false);
  const [pulling, setPulling] = useState(false);
  const [autoClosedYears, setAutoClosedYears] = useState([]);
  const [pendingCount, setPendingCount] = useState(() => loadKey("pending-sync", []).length);
  const [syncFailStreak, setSyncFailStreak] = useState(() => loadKey("sync-fail-streak", 0));
  const [toastMsg, setToastMsg] = useState(null);
  const [forcingSync, setForcingSync] = useState(false);
  const [theme, setTheme] = useState(() => loadKey("theme", "system"));
  const [showSettings, setShowSettings] = useState(false);
  const [showMenu, setShowMenu] = useState(false);
  const [quickAdd, setQuickAdd] = useState(() => new URLSearchParams(window.location.search).get("add") === "1");
  const categorySyncTimer = useRef(null);
  const profileSyncTimer = useRef(null);
  const toastTimer = useRef(null);

  function showToast(message, type = "info") {
    setToastMsg({ message, type });
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToastMsg(null), 3200);
  }

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    document.documentElement.style.colorScheme = theme === "system" ? "light dark" : theme;
    const isDark = theme === "dark" || (theme === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", isDark ? "#1C1A17" : "#F7F5F1");
  }, [theme]);
  function chooseTheme(t) { setTheme(t); saveKey("theme", t); }

  useEffect(() => {
    if (quickAdd) {
      const url = new URL(window.location.href);
      url.searchParams.delete("add");

  }, []); // eslint-disable-line

  const catMap = useMemo(() => Object.fromEntries(categories.map(c => [c.id, c])), [categories]);
  const existingTrips = useMemo(() => Array.from(new Set(transactions.map(t => t.trip).filter(Boolean))).sort(), [transactions]);

  // Aggiunge la categoria "Cloud" anche a chi ha già dei dati salvati (i DEFAULT_CATEGORIES
  // valgono solo per le installazioni nuove).
  useEffect(() => {
    setCategories(prev => {
      if (prev.some(c => c.name.toLowerCase() === "cloud")) return prev;
      const next = [...prev, { id: uid(), name: "Cloud", icon: "☁️", color: "#3B6FA8", type: "expense", budget: 0 }];
      saveKey("categories", next);
      return next;
    });
  }, []); // eslint-disable-line

  // Rinomina la vecchia categoria di entrata "Altro" (id altro-i) in "Paghetta", anche per chi
  // ha già dei dati salvati. Tocca solo quella specifica categoria di sistema, mai una eventuale
  // categoria "Altro" creata a mano dall'utente in seguito.
  useEffect(() => {
    setCategories(prev => {
      const target = prev.find(c => c.id === "altro-i" && c.name.trim().toLowerCase() === "altro");
      if (!target) return prev;
      const next = prev.map(c => c.id === "altro-i" ? { ...c, name: "Paghetta" } : c);
      saveKey("categories", next);
      pushCategoriesToSheet(next);
      return next;
    });
  }, []); // eslint-disable-line

  function queueAdd(payload) {
    const q = loadKey("pending-sync", []);
    const next = [...q, { id: uid(), payload }];
    saveKey("pending-sync", next);
    setPendingCount(next.length);
  }
  function queueRemove(id) {
    const q = loadKey("pending-sync", []);
    const next = q.filter(i => i.id !== id);
    saveKey("pending-sync", next);
    setPendingCount(next.length);
  }

  async function pushToSheet(payload) {
    if (!sheetUrl) return;
    try {
      const res = await fetch(sheetUrl, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
      });
      const text = await res.text();
      let json;
      try { json = JSON.parse(text); } catch (parseErr) { throw new Error("il foglio non ha risposto con dati validi: " + text.slice(0, 120)); }
      if (!res.ok || !json || json.ok !== true) throw new Error("il foglio ha segnalato un errore");
      const ts = new Date().toISOString();
      setLastSync(ts); saveKey("last-sync", ts);
      showToast("Sincronizzato ✓", "success");
    } catch (e) {
      console.error("sync error, messo in coda per riprovare al ritorno della rete", e);
      queueAdd(payload);
      showToast("Non sincronizzato — in coda, riproverà da solo", "warn");
    }
  }

  function addTransaction(tx) {
    const full = { ...tx, id: uid() };
    const next = [full, ...transactions];
    setTransactions(next); saveKey("transactions", next);
    pushToSheet({ action: "append", tx: { ...full, categoryName: catMap[full.categoryId]?.name || full.categoryId } });
  }
  function removeTransaction(id) {
    const next = transactions.filter(t => t.id !== id);
    setTransactions(next); saveKey("transactions", next);
    pushToSheet({ action: "delete", id });
  }
  function updateTransaction(id, patch) {
    const next = transactions.map(t => t.id === id ? { ...t, ...patch } : t);
    setTransactions(next); saveKey("transactions", next);
    const updated = next.find(t => t.id === id);
    pushToSheet({ action: "update", id, tx: { ...updated, categoryName: catMap[updated.categoryId]?.name || updated.categoryId } });
  }

  function pushCategoriesToSheet(cats) {
    const payload = cats.map(c => ({ id: c.id, name: c.name, icon: c.icon, color: c.color, type: c.type, budget: c.budget || 0 }));
    pushToSheet({ action: "categoriesSync", categories: payload });
  }
  function pushCategoriesDebounced(cats) {
    clearTimeout(categorySyncTimer.current);
    categorySyncTimer.current = setTimeout(() => pushCategoriesToSheet(cats), 900);
  }
  function pushProfileToSheet(name, birthdate) {
    pushToSheet({ action: "profileSync", name, birthdate });
  }
  function pushProfileDebounced(name, birthdate) {
    clearTimeout(profileSyncTimer.current);
    profileSyncTimer.current = setTimeout(() => pushProfileToSheet(name, birthdate), 900);
  }
  function updateProfile(name, birthdate) {
    setProfileNameState(name); saveKey("profile-name", name);
    setProfileBirthdateState(birthdate); saveKey("profile-birthdate", birthdate);
    pushProfileDebounced(name, birthdate);
  }
  function addCategory(cat) {
    const next = [...categories, { ...cat, id: uid() }];
    setCategories(next); saveKey("categories", next);
    pushCategoriesToSheet(next);
  }
  function updateCategory(id, patch) {
    const next = categories.map(c => c.id === id ? { ...c, ...patch } : c);
    setCategories(next); saveKey("categories", next);
    pushCategoriesDebounced(next);
  }
  function removeCategory(id) {
    const cat = categories.find(c => c.id === id);
    if (!cat) return;
    const affected = transactions.filter(t => t.categoryId === id);
    if (affected.length > 0) {
      const proceed = window.confirm(`Ci sono ${affected.length} transazioni con la categoria "${cat.name}". Verranno spostate su "Altro" prima di eliminarla, per non alterare i totali già calcolati. Continuare?`);
      if (!proceed) return;
      let altro = categories.find(c => c.type === cat.type && c.name.trim().toLowerCase() === "altro");
      let nextCats = categories;
      if (!altro) {
        altro = { id: uid(), name: "Altro", icon: "➕", color: "#8A8578", type: cat.type, budget: 0 };
        nextCats = [...categories, altro];
      }
      const nextTx = transactions.map(t => t.categoryId === id ? { ...t, categoryId: altro.id } : t);
      setTransactions(nextTx); saveKey("transactions", nextTx);
      const finalCats = nextCats.filter(c => c.id !== id);
      setCategories(finalCats); saveKey("categories", finalCats);
      pushCategoriesToSheet(finalCats);
      pushToSheet({ action: "categoryDelete", id });
      affected.forEach(t => {
        pushToSheet({ action: "update", id: t.id, tx: { ...t, categoryId: altro.id, categoryName: altro.name } });
      });
      return;
    }
    const next = categories.filter(c => c.id !== id);
    setCategories(next); saveKey("categories", next);
    pushCategoriesToSheet(next);
    pushToSheet({ action: "categoryDelete", id });
  }

  function addSaving(entry) {
    const full = { ...entry, id: uid() };
    const next = [full, ...savings];
    setSavings(next); saveKey("savings", next);
    pushToSheet({ action: "savingAppend", saving: full });
  }
  function removeSaving(id) {
    const next = savings.filter(s => s.id !== id);
    setSavings(next); saveKey("savings", next);
    pushToSheet({ action: "savingDelete", id });
  }

  async function closeYear(year) {
    const inArchive = archives.some(a => a.year === year);
    const msg = inArchive
      ? `Il ${year} è già archiviato: verrà ricalcolato da capo con le transazioni attuali. Continuare?`
      : `Le transazioni del ${year} verranno riassunte in un totale per categoria e poi eliminate in modo permanente da questo dispositivo (e dal foglio, se collegato). Non potrai più vederle giorno per giorno, solo il totale annuale. Continuare?`;
    if (!window.confirm(msg)) return;

    const totals = {}; const names = {};
    let totalIncome = 0, totalExpense = 0;
    categories.forEach(c => { names[c.id] = { name: c.name, icon: c.icon }; });
    transactions.forEach(t => {
      if (t.date.slice(0, 4) !== year) return;
      if (t.type === "income") totalIncome += t.amount;
      else { totalExpense += t.amount; totals[t.categoryId] = (totals[t.categoryId] || 0) + t.amount; }
    });
    const archive = { year, categoryTotals: totals, categoryNames: names, totalIncome, totalExpense, saldo: totalIncome - totalExpense, closedAt: new Date().toISOString() };
    const nextArchives = [...archives.filter(a => a.year !== year), archive];
    setArchives(nextArchives); saveKey("archives", nextArchives);

    const remaining = transactions.filter(t => t.date.slice(0, 4) !== year);
    setTransactions(remaining); saveKey("transactions", remaining);

    const catsPayload = Object.entries(totals).map(([id, total]) => ({ name: catMap[id]?.name || names[id]?.name || "Altro", total }));
    await pushToSheet({ action: "closeYear", year, categories: catsPayload, totalIncome });
  }

  async function setArchiveIncome(year, income) {
    const next = archives.map(a => a.year === year ? { ...a, totalIncome: income, saldo: income - a.totalExpense } : a);
    setArchives(next); saveKey("archives", next);
    const a = next.find(x => x.year === year);
    if (a) {
      const catsPayload = Object.entries(a.categoryTotals).map(([id, total]) => ({ name: a.categoryNames[id]?.name || "Altro", total }));
      await pushToSheet({ action: "closeYear", year, categories: catsPayload, totalIncome: income });
    }
  }

  function exportBackup() {
    const data = { app: "Registro", version: APP_VERSION, exportedAt: new Date().toISOString(), categories, transactions, archives, savings };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `registro-backup-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function importBackupFile(file) {
    if (!file) return;
    if (!window.confirm("Questo sostituirà tutti i dati attuali su questo dispositivo con quelli del file. Continuare?")) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (Array.isArray(data.categories)) { setCategories(data.categories); saveKey("categories", data.categories); }
        if (Array.isArray(data.transactions)) { setTransactions(data.transactions); saveKey("transactions", data.transactions); }
        if (Array.isArray(data.archives)) { setArchives(data.archives); saveKey("archives", data.archives); }
        if (Array.isArray(data.savings)) { setSavings(data.savings); saveKey("savings", data.savings); }
        window.alert("Ripristino completato.");
      } catch (err) {
        window.alert("Il file non sembra un backup valido di Registro.");
      }
    };
    reader.readAsText(file);
  }

  async function syncAllNow() {
    if (!sheetUrl) return;
    setSyncing(true);
    await pushToSheet({ action: "bulk", txs: transactions.map(t => ({ ...t, categoryName: catMap[t.categoryId]?.name || t.categoryId })) });
    setSyncing(false);
  }

  async function pullFromSheet() {
    if (!sheetUrl) return;
    if (!window.confirm("Questo sostituirà transazioni, categorie, risparmi e archivi salvati su questo dispositivo con quelli presenti nel foglio Google. Continuare?")) return;
    setPulling(true);
    try {
      const res = await fetch(sheetUrl, { method: "GET" });
      const data = await res.json();
      const byName = {};
      let newCats = [...categories];
      newCats.forEach(c => { byName[c.name.toLowerCase()] = c.id; });
      function ensureCat(name, type) {
        let id = byName[(name || "").toLowerCase()];
        if (!id) {
          const nc = { id: uid(), name: name || "Altro", icon: "🏷️", color: "#8A8578", type: type || "expense", budget: 0 };
          newCats.push(nc); byName[nc.name.toLowerCase()] = nc.id; id = nc.id;
        }
        return id;
      }
      const archivedYears = new Set((data.archives || []).map(a => a.year));
      const mapped = (data.transactions || [])
        .filter(t => !archivedYears.has(String(t.date).slice(0, 4)))
        .map(t => ({ id: t.id, type: t.type, amount: parseFloat(t.amount) || 0, categoryId: ensureCat(t.categoryName, t.type), date: t.date, note: t.note || "", trip: t.trip || "" }));
      const mappedArchives = (data.archives || []).map(a => {
        const categoryTotals = {};
        const categoryNames = {};
        Object.entries(a.categoryTotals || {}).forEach(([name, total]) => {
          const id = ensureCat(name, "expense");
          categoryTotals[id] = parseFloat(total) || 0;
          categoryNames[id] = { name, icon: newCats.find(c => c.id === id)?.icon || "🏷️" };
        });
        const totalExpense = Object.values(categoryTotals).reduce((s, v) => s + v, 0);
        const totalIncome = parseFloat(a.income) || 0;
        return { year: a.year, categoryTotals, categoryNames, totalIncome, totalExpense, saldo: totalIncome - totalExpense, closedAt: new Date().toISOString() };
      });
      if (Array.isArray(data.categories)) {
        const byId = Object.fromEntries(newCats.map(c => [c.id, c]));
        data.categories.forEach(rc => {
          const incoming = { id: rc.id, name: rc.name, icon: rc.icon, color: rc.color, type: rc.type, budget: parseFloat(rc.budget) || 0 };
          if (byId[rc.id]) Object.assign(byId[rc.id], incoming);
          else { newCats.push(incoming); byId[rc.id] = incoming; }
        });
      }
      const deletedCatIds = new Set(data.deletedCategoryIds || []);
      if (deletedCatIds.size > 0) newCats = newCats.filter(c => !deletedCatIds.has(c.id));
      const mappedSavings = (data.savings || []).map(s => ({ id: s.id, type: s.type, amount: parseFloat(s.amount) || 0, date: s.date, note: s.note || "" }));
      setCategories(newCats); saveKey("categories", newCats);
      setTransactions(mapped); saveKey("transactions", mapped);
      setArchives(mappedArchives); saveKey("archives", mappedArchives);
      setSavings(mappedSavings); saveKey("savings", mappedSavings);
      if (data.profile) {
        setProfileNameState(data.profile.name || ""); saveKey("profile-name", data.profile.name || "");
        setProfileBirthdateState(data.profile.birthdate || ""); saveKey("profile-birthdate", data.profile.birthdate || "");
      }
      const ts = new Date().toISOString();
      setLastPull(ts); saveKey("last-pull", ts);
    } catch (e) {
      console.error(e);
      window.alert("Non sono riuscito a leggere dal foglio. Controlla il link nella scheda Backup e riprova.");
    }
    setPulling(false);
  }
  function saveSheetUrl(url) { setSheetUrlState(url); saveKey("sheet-url", url); }

  async function flushQueue() {
    const url = loadKey("sheet-url", "");
    if (!url) return;
    const q = loadKey("pending-sync", []);
    let sentAny = false;
    for (const item of q) {
      try {
        const res = await fetch(url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(item.payload) });
        if (!res.ok) throw new Error("risposta non valida dal foglio");
        queueRemove(item.id);
        const ts = new Date().toISOString();
        setLastSync(ts); saveKey("last-sync", ts);
        sentAny = true;
      } catch (e) { /* ancora offline, ci riproviamo più tardi */ }
    }
    if (sentAny) showToast("Inviato ✓ (era in attesa di rete)", "success");
  }

  async function checkSyncHealth() {
    const url = loadKey("sheet-url", "");
    if (!url) return;
    try {
      const res = await fetch(url, { method: "GET" });
      if (!res.ok) throw new Error("bad status");
      await res.json();
      saveKey("sync-fail-streak", 0); setSyncFailStreak(0);
    } catch (e) {
      const streak = loadKey("sync-fail-streak", 0) + 1;
      saveKey("sync-fail-streak", streak); setSyncFailStreak(streak);
    }
  }

  // Sincronizzazione periodica: aggiunge le novità, rimuove ciò che è stato eliminato altrove
  // (sia in modo "esplicito", marcato Eliminato dall'app, sia perché una riga è semplicemente
  // sparita dal foglio — es. cancellata a mano — purché non fosse ancora in attesa di invio).
  async function mergeFromSheet() {
    const url = loadKey("sheet-url", "");
    if (!url) return false;
    try {
      const res = await fetch(url, { method: "GET" });
      if (!res.ok) return false;
      const data = await res.json();
      const pending = loadKey("pending-sync", []);
      const pendingTxIds = new Set(pending.map(i => i.payload?.tx?.id || i.payload?.id).filter(Boolean));
      const pendingCatIds = new Set(pending.map(i => (i.payload?.action === "categoriesSync" ? (i.payload.categories || []).map(c => c.id) : [])).flat());
      const pendingSavIds = new Set(pending.map(i => (i.payload?.action === "savingAppend" ? i.payload.saving?.id : null)).filter(Boolean));
      const pendingProfileEdit = pending.some(i => i.payload?.action === "profileSync");

      // Transazioni
      const localTx = loadKey("transactions", []);
      const localIds = new Set(localTx.map(t => t.id));
      let cats = loadKey("categories", DEFAULT_CATEGORIES);
      const byName = {}; cats.forEach(c => { byName[c.name.trim().toLowerCase()] = c.id; });
      function ensureCat(name, type) {
        let id = byName[(name || "").trim().toLowerCase()];
        if (!id) {
          const nc = { id: uid(), name: name || "Altro", icon: "🏷️", color: "#8A8578", type: type || "expense", budget: 0 };
          cats.push(nc); byName[nc.name.toLowerCase()] = nc.id; id = nc.id;
        }
        return id;
      }
      const archivedYears = new Set((data.archives || []).map(a => a.year));
      const sheetTxIds = new Set((data.transactions || []).map(t => t.id));
      const newOnes = (data.transactions || [])
        .filter(t => !localIds.has(t.id) && !archivedYears.has(String(t.date).slice(0, 4)))
        .map(t => ({ id: t.id, type: t.type, amount: parseFloat(t.amount) || 0, categoryId: ensureCat(t.categoryName, t.type), date: t.date, note: t.note || "", trip: t.trip || "" }));
      const deletedTxIds = new Set(data.deletedTransactionIds || []);
      let mergedTx = [...newOnes, ...localTx];
      let txChanged = newOnes.length > 0;
      const before1 = mergedTx.length;
      mergedTx = mergedTx.filter(t => {
        if (deletedTxIds.has(t.id)) return false; // eliminata esplicitamente altrove
        if (archivedYears.has(t.date.slice(0, 4))) return true;
        if (sheetTxIds.has(t.id)) return true;
        if (pendingTxIds.has(t.id)) return true; // non ancora inviata da qui, non toccarla
        return false; // sparita dal foglio senza essere in attesa: considerata eliminata a mano
      });
      if (mergedTx.length !== before1) txChanged = true;
      if (txChanged) { setTransactions(mergedTx); saveKey("transactions", mergedTx); }

      // Categorie
      let catsChanged = false;
      const sheetCatIds = new Set((data.categories || []).map(c => c.id));
      if (Array.isArray(data.categories)) {
        const byId = Object.fromEntries(cats.map(c => [c.id, c]));
        data.categories.forEach(rc => {
          const incoming = { id: rc.id, name: rc.name, icon: rc.icon, color: rc.color, type: rc.type, budget: parseFloat(rc.budget) || 0 };
          const existing = byId[rc.id];
          if (!existing) { cats.push(incoming); byId[rc.id] = incoming; catsChanged = true; }
          else if (existing.name !== incoming.name || existing.icon !== incoming.icon || existing.color !== incoming.color || existing.type !== incoming.type || (existing.budget || 0) !== incoming.budget) {
            Object.assign(existing, incoming); catsChanged = true;
          }
        });
      }
      const deletedCatIds = new Set(data.deletedCategoryIds || []);
      const beforeC = cats.length;
      cats = cats.filter(c => {
        if (deletedCatIds.has(c.id)) return false;
        if (sheetCatIds.has(c.id)) return true;
        if (pendingCatIds.has(c.id)) return true;
        // categorie mai sincronizzate (es. installazione locale non ancora collegata) restano
        return !sheetUrl || true;
      });
      if (cats.length !== beforeC) catsChanged = true;
      if (catsChanged) { setCategories(cats); saveKey("categories", cats); }

      // Risparmi
      const localSav = loadKey("savings", []);
      const localSavIds = new Set(localSav.map(s => s.id));
      const sheetSavIds = new Set((data.savings || []).map(s => s.id));
      const newSavings = (data.savings || [])
        .filter(s => !localSavIds.has(s.id))
        .map(s => ({ id: s.id, type: s.type, amount: parseFloat(s.amount) || 0, date: s.date, note: s.note || "" }));
      const deletedSavIds = new Set(data.deletedSavingIds || []);
      let mergedSav = [...newSavings, ...localSav];
      let savChanged = newSavings.length > 0;
      const beforeS = mergedSav.length;
      mergedSav = mergedSav.filter(s => {
        if (deletedSavIds.has(s.id)) return false;
        if (sheetSavIds.has(s.id)) return true;
        if (pendingSavIds.has(s.id)) return true;
        return false;
      });
      if (mergedSav.length !== beforeS) savChanged = true;
      if (savChanged) { setSavings(mergedSav); saveKey("savings", mergedSav); }

      // Profilo (nome e data di nascita, sincronizzati)
      if (data.profile && !pendingProfileEdit) {
        const localName = loadKey("profile-name", "");
        const localBirth = loadKey("profile-birthdate", "");
        const remoteName = data.profile.name || "";
        const remoteBirth = data.profile.birthdate || "";
        if (remoteName !== localName || remoteBirth !== localBirth) {
          setProfileNameState(remoteName); saveKey("profile-name", remoteName);
          setProfileBirthdateState(remoteBirth); saveKey("profile-birthdate", remoteBirth);
        }
      }

      const ts = new Date().toISOString();
      setLastPull(ts); saveKey("last-pull", ts);
      const changed = txChanged || catsChanged || savChanged;
      if (changed) showToast("Aggiornato da un altro dispositivo ✓", "success");
      return changed;
    } catch (e) { return false; }
  }

  async function forceSyncNow() {
    if (!sheetUrl) { showToast("Nessun foglio collegato", "warn"); return; }
    setForcingSync(true);
    try {
      await flushQueue();
      await pushToSheet({ action: "bulk", txs: transactions.map(t => ({ ...t, categoryName: catMap[t.categoryId]?.name || t.categoryId })) });
      pushCategoriesToSheet(categories);
      const changed = await mergeFromSheet();
      await checkSyncHealth();
      if (!changed) showToast("Sincronizzato ✓ (tutto già aggiornato)", "success");
    } catch (e) {
      showToast("Sincronizzazione non riuscita", "error");
    }
    setForcingSync(false);
  }

  // Al primo avvio dell'app, chiude da solo qualunque anno ormai passato e mai archiviato.
  useEffect(() => {
    (async () => {
      const currentYear = String(new Date().getFullYear());
      let txs = loadKey("transactions", []);
      let archs = loadKey("archives", []);
      const cats = loadKey("categories", DEFAULT_CATEGORIES);
      const catById = Object.fromEntries(cats.map(c => [c.id, c]));
      const pastYears = Array.from(new Set(txs.map(t => t.date.slice(0, 4))))
        .filter(y => y < currentYear && !archs.some(a => a.year === y))
        .sort();
      if (pastYears.length === 0) return;

      const url = loadKey("sheet-url", "");
      for (const year of pastYears) {
        const totals = {}; const names = {};
        let totalIncome = 0, totalExpense = 0;
        cats.forEach(c => { names[c.id] = { name: c.name, icon: c.icon }; });
        txs.forEach(t => {
          if (t.date.slice(0, 4) !== year) return;
          if (t.type === "income") totalIncome += t.amount;
          else { totalExpense += t.amount; totals[t.categoryId] = (totals[t.categoryId] || 0) + t.amount; }
        });
        archs = [...archs.filter(a => a.year !== year), { year, categoryTotals: totals, categoryNames: names, totalIncome, totalExpense, saldo: totalIncome - totalExpense, closedAt: new Date().toISOString() }];
        txs = txs.filter(t => t.date.slice(0, 4) !== year);
        if (url) {
          const catsPayload = Object.entries(totals).map(([id, total]) => ({ name: catById[id]?.name || names[id]?.name || "Altro", total }));
          try {
            const res = await fetch(url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "closeYear", year, categories: catsPayload, totalIncome }) });
            if (!res.ok) throw new Error("risposta non valida dal foglio");
          } catch (e) { console.error("auto-close sync error", e); }
        }
      }
      saveKey("transactions", txs);
      saveKey("archives", archs);
      setTransactions(txs);
      setArchives(archs);
      setAutoClosedYears(pastYears);
    })();
  }, []); // eslint-disable-line

  // Riprova a inviare al foglio ciò che non era partito per mancanza di rete: al primo avvio
  // e ogni volta che il dispositivo torna online. Controllo periodico ogni 5 minuti.
  useEffect(() => {
    flushQueue();
    window.addEventListener("online", flushQueue);
    checkSyncHealth();
    mergeFromSheet();
    const interval = setInterval(() => { flushQueue(); checkSyncHealth(); mergeFromSheet(); }, 5 * 60 * 1000);
    return () => { window.removeEventListener("online", flushQueue); clearInterval(interval); };
  }, []); // eslint-disable-line

  const balance = transactions.reduce((s, t) => s + (t.type === "income" ? t.amount : -t.amount), 0)
    + archives.reduce((s, a) => s + (a.saldo || 0), 0);

  return (
    <div style={S.app}>
      <div style={S.shell}>
        <header style={S.header}>
          <div>
            <span style={S.eyebrow}>MONEY TRACKER{profileName ? ` · ${profileName.toUpperCase()}` : ""}</span>
            <h1 style={S.h1}>Registro</h1>
          </div>
          <div style={{ display: "flex", alignItems: "flex-start", gap: 6 }}>
            <div style={S.headerBalance}>
              <span style={S.headerBalanceLabel}>saldo</span>
              <span style={{ ...S.headerBalanceNum, color: balance >= 0 ? TOKENS.accent : TOKENS.negative }}>{eur(balance)}</span>
              {sheetUrl && (
                <button onClick={forceSyncNow} disabled={forcingSync} style={{ border: "none", background: "none", color: TOKENS.inkSoft, fontSize: 11.5, marginTop: 4, cursor: "pointer", display: "flex", alignItems: "center", gap: 4, padding: 0 }}>
                  <span style={{ display: "inline-block", animation: forcingSync ? "spin 0.9s linear infinite" : "none" }}>⟳</span> {forcingSync ? "sincronizzo…" : "sincronizza ora"}
                </button>
              )}
            </div>
            <div style={{ position: "relative" }}>
              <button onClick={()=>setShowMenu(v=>!v)} aria-label="Menu" style={{
                border: "none", background: TOKENS.paper2, color: TOKENS.ink, cursor: "pointer",
                fontSize: 21, width: 42, height: 42, borderRadius: 12, lineHeight: 1,
                display: "flex", alignItems: "center", justifyContent: "center", position: "relative",
              }}>
                ☰
                {(!sheetUrl || pendingCount > 0) && <span style={{ position: "absolute", top: 6, right: 6, width: 7, height: 7, borderRadius: "50%", background: TOKENS.amber }} />}
              </button>
              {showMenu && (
                <>
                  <div onClick={()=>setShowMenu(false)} style={{ position: "fixed", inset: 0, zIndex: 39 }} />
                  <div style={{
                    position: "absolute", top: 48, right: 0, zIndex: 40, background: TOKENS.paper,
                    borderRadius: 12, boxShadow: `0 8px 26px ${TOKENS.shadow2}`, minWidth: 190, overflow: "hidden",
                    border: `1px solid ${TOKENS.line}`,
                  }}>
                    {[
                      ["analisi", "◫", "Analisi", false],
                      ["backup", "☁", "Backup", !sheetUrl || pendingCount > 0],
                    ].map(([key, icon, label, dot]) => (
                      <button key={key} onClick={()=>{ setTab(key); setShowMenu(false); }} style={{
                        display: "flex", alignItems: "center", gap: 10, width: "100%", border: "none",
                        background: tab === key ? TOKENS.paper2 : "transparent", color: TOKENS.ink,
                        padding: "12px 14px", fontSize: 14, cursor: "pointer", textAlign: "left",
                      }}>
                        <span style={{ fontSize: 16, width: 18, textAlign: "center" }}>{icon}</span>
                        <span style={{ flex: 1 }}>{label}</span>
                        {dot && <span style={{ width: 7, height: 7, borderRadius: "50%", background: TOKENS.amber }} />}
                      </button>
                    ))}
                    <button onClick={()=>{ setShowSettings(true); setShowMenu(false); }} style={{
                      display: "flex", alignItems: "center", gap: 10, width: "100%", border: "none", borderTop: `1px solid ${TOKENS.line}`,
                      background: "transparent", color: TOKENS.ink, padding: "12px 14px", fontSize: 14, cursor: "pointer", textAlign: "left",
                    }}>
                      <span style={{ fontSize: 16, width: 18, textAlign: "center" }}>⚙</span>
                      <span style={{ flex: 1 }}>Impostazioni</span>
                    </button>
                  </div>
                </>
              )}
            </div>
          </div>
        </header>

        {showSettings && (
          <div style={S.modalOverlay} onClick={(e)=>{ if (e.target === e.currentTarget) setShowSettings(false); }}>
            <div style={S.modalCard}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                <h3 style={{ ...S.sectionTitle, margin: 0 }}>Impostazioni</h3>
                <button onClick={()=>setShowSettings(false)} style={{ border: "none", background: "transparent", color: TOKENS.inkSoft, cursor: "pointer", fontSize: 18, padding: 4 }}>✕</button>
              </div>
              <p style={{ fontSize: 12.5, color: TOKENS.inkSoft, margin: "8px 0 10px" }}>Tema</p>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {[["light","☀️","Chiaro"],["dark","🌙","Scuro"],["system","◐","Segui il sistema"]].map(([v,icon,label]) => (
                  <button key={v} onClick={()=>chooseTheme(v)} style={{
                    display: "flex", alignItems: "center", gap: 10, padding: "11px 14px", borderRadius: 10, border: "none", cursor: "pointer",
                    background: theme === v ? TOKENS.paper2 : "transparent", color: TOKENS.ink, fontSize: 14, textAlign: "left",
                  }}>
                    <span style={{ fontSize: 16 }}>{icon}</span>
                    <span style={{ flex: 1 }}>{label}</span>
                    {theme === v && <span style={{ color: TOKENS.accent }}>✓</span>}
                  </button>
                ))}
              </div>

              <p style={{ fontSize: 12.5, color: TOKENS.inkSoft, margin: "18px 0 10px" }}>Profilo{sheetUrl ? " · sincronizzato tra i dispositivi" : ""}</p>
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                <div>
                  <label style={{ fontSize: 12, color: TOKENS.inkSoft, display: "block", marginBottom: 4 }}>Nome</label>
                  <input type="text" value={profileName} onChange={(e)=>updateProfile(e.target.value, profileBirthdate)} placeholder="Il tuo nome" style={inputStyle} />
                </div>
                <div>
                  <label style={{ fontSize: 12, color: TOKENS.inkSoft, display: "block", marginBottom: 4 }}>Data di nascita <span style={{ opacity: 0.7 }}>(facoltativa)</span></label>
                  <input type="date" value={profileBirthdate} onChange={(e)=>updateProfile(profileName, e.target.value)} style={inputStyle} />
                </div>
              </div>
            </div>
          </div>
        )}

        {toastMsg && (
          <div style={{
            position: "fixed", top: "calc(14px + env(safe-area-inset-top))", left: "50%", transform: "translateX(-50%)",
            zIndex: 45, padding: "8px 16px", borderRadius: 999, fontSize: 12.5, fontWeight: 500,
            background: toastMsg.type === "error" ? TOKENS.negative : toastMsg.type === "warn" ? TOKENS.amber : TOKENS.ink,
            color: TOKENS.paper, boxShadow: "0 4px 14px rgba(33,31,28,0.25)", whiteSpace: "nowrap", maxWidth: "90vw",
            overflow: "hidden", textOverflow: "ellipsis",
          }}>
            {toastMsg.message}
          </div>
        )}

        <div className="layout-row">
        <nav className="tabs-nav">
          <TabBtn active={tab==="dashboard"} onClick={()=>setTab("dashboard")} icon="▦" label="Dashboard" />
          <TabBtn active={tab==="transazioni"} onClick={()=>setTab("transazioni")} icon="☰" label="Transazioni" />
          <TabBtn active={tab==="categorie"} onClick={()=>setTab("categorie")} icon="🏷" label="Categorie" />
          <TabBtn active={tab==="risparmi"} onClick={()=>setTab("risparmi")} icon="🏦" label="Risparmi" />
        </nav>

        <div className="content-col">
        <main style={S.main}>
          {autoClosedYears.length > 0 && (
            <div style={{ ...S.card, padding: "12px 16px", display: "flex", alignItems: "center", gap: 10, background: TOKENS.accentSoft, boxShadow: "none" }}>
              <span style={{ fontSize: 16 }}>🔒</span>
              <div style={{ flex: 1, fontSize: 13.5 }}>
                Ho archiviato in automatico {autoClosedYears.length === 1 ? `l'anno ${autoClosedYears[0]}` : `gli anni ${autoClosedYears.join(", ")}`}: trovi i totali per categoria in Categorie → Confronto per anno.
              </div>
              <button onClick={()=>setAutoClosedYears([])} style={{ border: "none", background: "transparent", color: TOKENS.inkSoft, cursor: "pointer", fontSize: 14 }}>✕</button>
            </div>
          )}
          {tab === "dashboard" && <Dashboard transactions={transactions} categories={categories} catMap={catMap} archives={archives} />}
          {tab === "transazioni" && <Transazioni transactions={transactions} categories={categories} catMap={catMap} onAdd={addTransaction} onRemove={removeTransaction} onUpdate={updateTransaction} existingTrips={existingTrips} />}
          {tab === "categorie" && <Categorie categories={categories} transactions={transactions} archives={archives} onAdd={addCategory} onUpdate={updateCategory} onRemove={removeCategory} onCloseYear={closeYear} onEditArchiveIncome={setArchiveIncome} />}
          {tab === "analisi" && <Analisi transactions={transactions} categories={categories} catMap={catMap} />}
          {tab === "risparmi" && <Risparmi savings={savings} onAdd={addSaving} onRemove={removeSaving} />}
          {tab === "backup" && <Backup sheetUrl={sheetUrl} onSaveUrl={saveSheetUrl} lastSync={lastSync} lastPull={lastPull} syncing={syncing} pulling={pulling} onSyncAll={syncAllNow} onPull={pullFromSheet} count={transactions.length} pendingCount={pendingCount} syncFailStreak={syncFailStreak} onExport={exportBackup} onImportFile={importBackupFile} />}
        </main>

        <p style={S.footer}>Registro v{APP_VERSION} · vive su questo dispositivo, funziona anche offline. Collega il Backup per portare i dati anche su altri dispositivi.</p>
        </div>
        </div>

        <button className="fab-btn" onClick={()=>setQuickAdd(true)} aria-label="Nuova transazione" style={S.fab}>+</button>

        {quickAdd && (
          <div style={S.modalOverlay} onClick={(e)=>{ if (e.target === e.currentTarget) setQuickAdd(false); }}>
            <div style={S.modalCard}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                <h3 style={{ ...S.sectionTitle, margin: 0 }}>Nuova transazione</h3>
                <button onClick={()=>setQuickAdd(false)} style={{ border: "none", background: "transparent", color: TOKENS.inkSoft, cursor: "pointer", fontSize: 18, padding: 4 }}>✕</button>
              </div>
              <TxForm categories={categories} existingTrips={existingTrips} onSubmit={(tx)=>{ addTransaction(tx); setQuickAdd(false); }} />
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------- Dashboard ---------- */

function DeltaBadge({ pct }) {
  if (pct === null || pct === undefined) return null;
  if (pct === Infinity) {
    return <span style={{ fontSize: 10.5, fontFamily: "'IBM Plex Mono', monospace", color: TOKENS.inkSoft, background: TOKENS.paper2, padding: "2px 6px", borderRadius: 999 }}>nuovo</span>;
  }
  if (Math.abs(pct) < 3) {
    return <span style={{ fontSize: 10.5, fontFamily: "'IBM Plex Mono', monospace", color: TOKENS.inkSoft, background: TOKENS.paper2, padding: "2px 6px", borderRadius: 999 }}>=</span>;
  }
  const up = pct > 0;
  return (
    <span style={{
      fontSize: 10.5, fontFamily: "'IBM Plex Mono', monospace",
      color: up ? TOKENS.negative : TOKENS.accent,
      background: up ? TOKENS.negativeSoft : TOKENS.accentSoft,
      padding: "2px 6px", borderRadius: 999,
    }}>{up ? "+" : ""}{Math.round(pct)}%</span>
  );
}

function Dashboard({ transactions, categories, catMap, archives }) {
  const [catPeriod, setCatPeriod] = useState("mese");
  const now = new Date();
  const thisMonthKey = thisMonthKeyLocal();
  const thisYear = String(now.getFullYear());
  const [tmY, tmM] = thisMonthKey.split("-").map(Number);
  const prevMonthKey = tmM === 1 ? `${tmY - 1}-12` : `${tmY}-${String(tmM - 1).padStart(2, "0")}`;

  const totalIncome = transactions.filter(t => t.type === "income" && t.date.slice(0, 4) === thisYear).reduce((s, t) => s + t.amount, 0);
  const totalExpense = transactions.filter(t => t.type === "expense" && t.date.slice(0, 4) === thisYear).reduce((s, t) => s + t.amount, 0);

  const budgetAlerts = useMemo(() => {
    return categories.filter(c => c.type === "expense" && c.budget > 0).map(c => {
      const spent = transactions.filter(t => t.type === "expense" && t.categoryId === c.id && monthKey(t.date) === thisMonthKey).reduce((s, t) => s + t.amount, 0);
      return { ...c, spent, pct: spent / c.budget };
    }).filter(c => c.pct >= 0.8).sort((a, b) => b.pct - a.pct);
  }, [categories, transactions, thisMonthKey]);

  const monthly = useMemo(() => {
    const map = {};
    transactions.forEach(t => {
      const k = monthKey(t.date);
      if (!map[k]) map[k] = { key: k, entrate: 0, uscite: 0 };
      if (t.type === "income") map[k].entrate += t.amount; else map[k].uscite += t.amount;
    });
    return Object.values(map).sort((a, b) => a.key.localeCompare(b.key)).map(m => ({
      ...m, label: monthLabel(m.key), saldo: +(m.entrate - m.uscite).toFixed(2),
    }));
  }, [transactions]);

  const dailyThisMonth = useMemo(() => {
    const y = now.getFullYear(), m = now.getMonth();
    const today = now.getDate();
    const days = [];
    let cumEnt = 0, cumUsc = 0;
    for (let d = 1; d <= today; d++) {
      const dateStr = `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      transactions.forEach(t => {
        if (t.date !== dateStr) return;
        if (t.type === "income") cumEnt += t.amount; else cumUsc += t.amount;
      });
      days.push({ day: d, label: String(d), entrate: +cumEnt.toFixed(2), uscite: +cumUsc.toFixed(2) });
    }
    return days;
  }, [transactions]);

  const catData = useMemo(() => {
    const filtered = transactions.filter(t => {
      if (t.type !== "expense") return false;
      if (catPeriod === "mese") return monthKey(t.date) === thisMonthKey;
      if (catPeriod === "anno") return t.date.slice(0, 4) === thisYear;
      return true;
    });
    const map = {};
    filtered.forEach(t => { map[t.categoryId] = (map[t.categoryId] || 0) + t.amount; });

    let prevMap = {};
    if (catPeriod === "mese") {
      transactions.forEach(t => {
        if (t.type === "expense" && monthKey(t.date) === prevMonthKey) {
          prevMap[t.categoryId] = (prevMap[t.categoryId] || 0) + t.amount;
        }
      });
    }

    return Object.entries(map)
      .map(([id, value]) => {
        const prevValue = prevMap[id] || 0;
        let deltaPct = null;
        if (catPeriod === "mese") {
          deltaPct = prevValue > 0 ? ((value - prevValue) / prevValue) * 100 : (value > 0 ? Infinity : null);
        }
        return { id, value: +value.toFixed(2), name: catMap[id]?.name || "Altro", color: catMap[id]?.color || "#999", deltaPct };
      })
      .sort((a, b) => b.value - a.value).slice(0, 8);
  }, [transactions, catPeriod, thisMonthKey, prevMonthKey, thisYear, catMap]);

  if (transactions.length === 0) {
    return (
      <div style={S.card}>
        <p style={{ fontFamily: "'Fraunces', serif", fontSize: 20, margin: "0 0 6px" }}>Il registro è vuoto.</p>
        <p style={{ color: TOKENS.inkSoft, fontSize: 14, lineHeight: 1.6, margin: 0 }}>
          Aggiungi la tua prima transazione dalla scheda "Transazioni": da lì Registro calcola tutto in automatico, andamento mensile, categorie principali e avvisi di budget.
        </p>
      </div>
    );
  }

  return (
    <>
      {budgetAlerts.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {budgetAlerts.map(c => {
            const over = c.pct >= 1;
