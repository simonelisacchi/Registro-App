const LEVELS = ["Base", "Intermedio", "Avanzato"];
const APP_VERSION = "1.3.0";
const APPS_SCRIPT_CODE = `function getSheetForDate(ss, dateStr) {
  var year = String(dateStr).slice(0, 4);
  var sheet = ss.getSheetByName(year);
  if (!sheet) {
    sheet = ss.insertSheet(year);
    sheet.appendRow(['ID','Tipo','Importo','Categoria','Data','Nota']);
  }
  return sheet;
}

function doPost(e) {
  var body = JSON.parse(e.postData.contents);
  var ss = SpreadsheetApp.getActiveSpreadsheet();

  if (body.action === 'append') {
    var t = body.tx;
    var sheet = getSheetForDate(ss, t.date);
    sheet.appendRow([t.id, t.type, t.amount, t.categoryName, t.date, t.note || '']);

  } else if (body.action === 'delete') {
    ss.getSheets().forEach(function(sheet) {
      if (!/^\\d{4}$/.test(sheet.getName())) return;
      var data = sheet.getDataRange().getValues();
      for (var i = data.length - 1; i >= 1; i--) {
        if (data[i][0] === body.id) { sheet.deleteRow(i + 1); break; }
      }
    });

  } else if (body.action === 'bulk') {
    var byYear = {};
    body.txs.forEach(function(t) {
      var y = String(t.date).slice(0, 4);
      if (!byYear[y]) byYear[y] = [];
      byYear[y].push(t);
    });
    Object.keys(byYear).forEach(function(y) {
      var sheet = getSheetForDate(ss, byYear[y][0].date);
      var existing = sheet.getDataRange().getValues().slice(1).map(function(r){ return r[0]; });
      byYear[y].forEach(function(t) {
        if (existing.indexOf(t.id) === -1) {
          sheet.appendRow([t.id, t.type, t.amount, t.categoryName, t.date, t.note || '']);
        }
      });
    });

  } else if (body.action === 'closeYear') {
    var year = String(body.year);
    var arch = ss.getSheetByName('Archivio') || ss.insertSheet('Archivio');
    if (arch.getLastRow() === 0) arch.appendRow(['Anno', 'Categoria', 'Totale']);
    var adata = arch.getDataRange().getValues();
    for (var j = adata.length - 1; j >= 1; j--) {
      if (String(adata[j][0]) === year) arch.deleteRow(j + 1);
    }
    (body.categories || []).forEach(function(c) {
      arch.appendRow([year, c.name, c.total]);
    });
    var yearSheet = ss.getSheetByName(year);
    if (yearSheet) ss.deleteSheet(yearSheet);
  }
  return ContentService.createTextOutput(JSON.stringify({ ok: true })).setMimeType(ContentService.MimeType.JSON);
}

function doGet(e) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var tz = Session.getScriptTimeZone();
  var out = { transactions: [], archives: [] };
  ss.getSheets().forEach(function(sheet) {
    if (!/^\\d{4}$/.test(sheet.getName())) return;
    if (sheet.getLastRow() <= 1) return;
    var rows = sheet.getDataRange().getValues().slice(1);
    rows.forEach(function(r) {
      var d = r[4];
      var dateStr = (d instanceof Date) ? Utilities.formatDate(d, tz, 'yyyy-MM-dd') : String(d);
      out.transactions.push({ id: r[0], type: r[1], amount: r[2], categoryName: r[3], date: dateStr, note: r[5] || '' });
    });
  });
  var arch = ss.getSheetByName('Archivio');
  if (arch && arch.getLastRow() > 1) {
    var byYear = {};
    arch.getDataRange().getValues().slice(1).forEach(function(r) {
      var y = String(r[0]);
      if (!byYear[y]) byYear[y] = {};
      byYear[y][r[1]] = r[2];
    });
    Object.keys(byYear).forEach(function(y) {
      out.archives.push({ year: y, categoryTotals: byYear[y] });
    });
  }
  return ContentService.createTextOutput(JSON.stringify(out)).setMimeType(ContentService.MimeType.JSON);
}`;

const todayISO = () => new Date().toISOString().slice(0, 10);
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const eur = (n) => new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR" }).format(n || 0);
const monthKey = (d) => d.slice(0, 7);
const monthLabel = (k) => {
  const [y, m] = k.split("-");
  return new Date(Number(y), Number(m) - 1, 1).toLocaleDateString("it-IT", { month: "short", year: "numeric" });
};
const timeAgo = (iso) => {
  if (!iso) return "mai";
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return "adesso";
  if (diff < 3600) return `${Math.floor(diff / 60)} min fa`;
  if (diff < 86400) return `${Math.floor(diff / 3600)} h fa`;
  return `${Math.floor(diff / 86400)} g fa`;
};

/* ---------- persistenza locale (nel browser del dispositivo) ---------- */

function loadKey(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    if (v) return JSON.parse(v);
  } catch (e) { /* valore assente o non valido, uso il default */ }
  return fallback;
}
function saveKey(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { console.error("storage error", key, e); }
}

function App() {
  const [tab, setTab] = useState("dashboard");
  const [categories, setCategories] = useState(() => loadKey("categories", DEFAULT_CATEGORIES));
  const [transactions, setTransactions] = useState(() => loadKey("transactions", []));
  const [topics] = useState(() => loadKey("topics", DEFAULT_TOPICS));
  const [progress, setProgress] = useState(() => loadKey("progress", []));
  const [resources, setResources] = useState(() => loadKey("resources", []));
  const [archives, setArchives] = useState(() => loadKey("archives", []));
  const [notes, setNotes] = useState(() => loadKey("notes", ""));
  const [sheetUrl, setSheetUrlState] = useState(() => loadKey("sheet-url", ""));
  const [lastSync, setLastSync] = useState(() => loadKey("last-sync", ""));
  const [lastPull, setLastPull] = useState(() => loadKey("last-pull", ""));
  const [syncing, setSyncing] = useState(false);
  const [pulling, setPulling] = useState(false);
  const [autoClosedYears, setAutoClosedYears] = useState([]);
  const [pendingCount, setPendingCount] = useState(() => loadKey("pending-sync", []).length);
  const [quickAdd, setQuickAdd] = useState(false);

  const catMap = useMemo(() => Object.fromEntries(categories.map(c => [c.id, c])), [categories]);

  function queueAdd(payload) {
    const q = loadKey("pending-sync", []);
    const next = [...q, { id: uid(), payload }];
    saveKey("pending-sync", next);
    setPendingCount(next.length);
  }
  function queueRemove(id) {
    const q = loadKey("pending-sync", []);
    const next = q.filter(i => i.id !== id);
    saveKey("pending-sync", next);
    setPendingCount(next.length);
  }

  // Riprova a inviare al foglio ciò che non era partito per mancanza di rete: al primo avvio
  // e ogni volta che il dispositivo torna online.
  useEffect(() => {
    async function flushQueue() {
      const url = loadKey("sheet-url", "");
      if (!url) return;
      const q = loadKey("pending-sync", []);
      for (const item of q) {
        try {
          await fetch(url, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(item.payload) });
          queueRemove(item.id);
          const ts = new Date().toISOString();
          setLastSync(ts); saveKey("last-sync", ts);
        } catch (e) { /* ancora offline, ci riproviamo più tardi */ }
      }
    }
    flushQueue();
    window.addEventListener("online", flushQueue);
    const interval = setInterval(flushQueue, 5 * 60 * 1000); // sincronizzazione automatica ogni 5 minuti, oltre a quella immediata a ogni transazione
    return () => { window.removeEventListener("online", flushQueue); clearInterval(interval); };
  }, []); // eslint-disable-line

  // Al primo avvio dell'app, chiude da solo qualunque anno ormai passato e mai archiviato:
  // così anche se ci si dimentica, nulla resta appeso e nulla va perso (i totali restano per sempre).
  useEffect(() => {
    (async () => {
      const currentYear = String(new Date().getFullYear());
      let txs = loadKey("transactions", []);
      let archs = loadKey("archives", []);
      const cats = loadKey("categories", DEFAULT_CATEGORIES);
      const catById = Object.fromEntries(cats.map(c => [c.id, c]));
      const pastYears = Array.from(new Set(txs.map(t => t.date.slice(0, 4))))
        .filter(y => y < currentYear && !archs.some(a => a.year === y))
        .sort();
      if (pastYears.length === 0) return;

      const url = loadKey("sheet-url", "");
      for (const year of pastYears) {
        const totals = {}; const names = {};
        let totalIncome = 0, totalExpense = 0;
        cats.forEach(c => { names[c.id] = { name: c.name, icon: c.icon }; });
        txs.forEach(t => {
          if (t.date.slice(0, 4) !== year) return;
          if (t.type === "income") totalIncome += t.amount;
          else { totalExpense += t.amount; totals[t.categoryId] = (totals[t.categoryId] || 0) + t.amount; }
        });
        archs = [...archs.filter(a => a.year !== year), { year, categoryTotals: totals, categoryNames: names, totalIncome, totalExpense, saldo: totalIncome - totalExpense, closedAt: new Date().toISOString() }];
        txs = txs.filter(t => t.date.slice(0, 4) !== year);
        if (url) {
          const catsPayload = Object.entries(totals).map(([id, total]) => ({ name: catById[id]?.name || names[id]?.name || "Altro", total }));
          try {
            await fetch(url, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "closeYear", year, categories: catsPayload }) });
          } catch (e) { console.error("auto-close sync error", e); }
        }
      }
      saveKey("transactions", txs);
      saveKey("archives", archs);
      setTransactions(txs);
      setArchives(archs);
      setAutoClosedYears(pastYears);
    })();
  }, []); // eslint-disable-line

  async function pushToSheet(payload) {
    if (!sheetUrl) return;
    try {
      await fetch(sheetUrl, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
      });
      const ts = new Date().toISOString();
      setLastSync(ts); saveKey("last-sync", ts);
    } catch (e) {
      console.error("sync error, messo in coda per riprovare al ritorno della rete", e);
      queueAdd(payload);
    }
  }

  function addTransaction(tx) {
    const full = { ...tx, id: uid() };
    const next = [full, ...transactions];
    setTransactions(next); saveKey("transactions", next);
    pushToSheet({ action: "append", tx: { ...full, categoryName: catMap[full.categoryId]?.name || full.categoryId } });
  }
  function removeTransaction(id) {
    const next = transactions.filter(t => t.id !== id);
    setTransactions(next); saveKey("transactions", next);
    pushToSheet({ action: "delete", id });
  }
  async function syncAllNow() {
    if (!sheetUrl) return;
    setSyncing(true);
    await pushToSheet({ action: "bulk", txs: transactions.map(t => ({ ...t, categoryName: catMap[t.categoryId]?.name || t.categoryId })) });
    setSyncing(false);
  }
  async function pullFromSheet() {
    if (!sheetUrl) return;
    if (!window.confirm("Questo sostituirà le transazioni e gli archivi salvati su questo dispositivo con quelli presenti nel foglio Google. Continuare?")) return;
    setPulling(true);
    try {
      const res = await fetch(sheetUrl, { method: "GET" });
      const data = await res.json();
      const byName = {};
      let newCats = [...categories];
      newCats.forEach(c => { byName[c.name.toLowerCase()] = c.id; });
      function ensureCat(name, type) {
        let id = byName[(name || "").toLowerCase()];
        if (!id) {
          const nc = { id: uid(), name: name || "Altro", icon: "🏷️", color: "#8A8578", type: type || "expense", budget: 0 };
          newCats.push(nc); byName[nc.name.toLowerCase()] = nc.id; id = nc.id;
        }
        return id;
      }
      const archivedYears = new Set((data.archives || []).map(a => a.year));
      const mapped = (data.transactions || [])
        .filter(t => !archivedYears.has(String(t.date).slice(0, 4)))
        .map(t => ({ id: t.id, type: t.type, amount: parseFloat(t.amount) || 0, categoryId: ensureCat(t.categoryName, t.type), date: t.date, note: t.note || "" }));
      const mappedArchives = (data.archives || []).map(a => {
        const categoryTotals = {};
        const categoryNames = {};
        Object.entries(a.categoryTotals || {}).forEach(([name, total]) => {
          const id = ensureCat(name, "expense");
          categoryTotals[id] = parseFloat(total) || 0;
          categoryNames[id] = { name, icon: newCats.find(c => c.id === id)?.icon || "🏷️" };
        });
        const totalExpense = Object.values(categoryTotals).reduce((s, v) => s + v, 0);
        return { year: a.year, categoryTotals, categoryNames, totalIncome: 0, totalExpense, saldo: -totalExpense, closedAt: new Date().toISOString() };
      });
      setCategories(newCats); saveKey("categories", newCats);
      setTransactions(mapped); saveKey("transactions", mapped);
      setArchives(mappedArchives); saveKey("archives", mappedArchives);
      const ts = new Date().toISOString();
      setLastPull(ts); saveKey("last-pull", ts);
    } catch (e) {
      console.error(e);
      window.alert("Non sono riuscito a leggere dal foglio. Controlla il link nella scheda Backup e riprova.");
    }
    setPulling(false);
  }
  function saveSheetUrl(url) { setSheetUrlState(url); saveKey("sheet-url", url); }

  async function closeYear(year) {
    const inArchive = archives.some(a => a.year === year);
    const msg = inArchive
      ? `Il ${year} è già archiviato: verrà ricalcolato da capo con le transazioni attuali. Continuare?`
      : `Le transazioni del ${year} verranno riassunte in un totale per categoria e poi eliminate in modo permanente da questo dispositivo (e dal foglio, se collegato). Non potrai più vederle giorno per giorno, solo il totale annuale. Continuare?`;
    if (!window.confirm(msg)) return;

    const totals = {}; const names = {};
    let totalIncome = 0, totalExpense = 0;
    categories.forEach(c => { names[c.id] = { name: c.name, icon: c.icon }; });
    transactions.forEach(t => {
      if (t.date.slice(0, 4) !== year) return;
      if (t.type === "income") totalIncome += t.amount;
      else { totalExpense += t.amount; totals[t.categoryId] = (totals[t.categoryId] || 0) + t.amount; }
    });
    const archive = { year, categoryTotals: totals, categoryNames: names, totalIncome, totalExpense, saldo: totalIncome - totalExpense, closedAt: new Date().toISOString() };
    const nextArchives = [...archives.filter(a => a.year !== year), archive];
    setArchives(nextArchives); saveKey("archives", nextArchives);

    const remaining = transactions.filter(t => t.date.slice(0, 4) !== year);
    setTransactions(remaining); saveKey("transactions", remaining);

    const catsPayload = Object.entries(totals).map(([id, total]) => ({ name: catMap[id]?.name || names[id]?.name || "Altro", total }));
    await pushToSheet({ action: "closeYear", year, categories: catsPayload });
  }

  function addCategory(cat) {
    const next = [...categories, { ...cat, id: uid() }];
    setCategories(next); saveKey("categories", next);
  }
  function updateCategory(id, patch) {
    const next = categories.map(c => c.id === id ? { ...c, ...patch } : c);
    setCategories(next); saveKey("categories", next);
  }
  function removeCategory(id) {
    const next = categories.filter(c => c.id !== id);
    setCategories(next); saveKey("categories", next);
  }
  function toggleTopic(id) {
    const next = progress.includes(id) ? progress.filter(p => p !== id) : [...progress, id];
    setProgress(next); saveKey("progress", next);
  }
  function addResource(res) {
    const next = [{ ...res, id: uid(), done: false }, ...resources];
    setResources(next); saveKey("resources", next);
  }
  function toggleResource(id) {
    const next = resources.map(r => r.id === id ? { ...r, done: !r.done } : r);
    setResources(next); saveKey("resources", next);
  }
  function removeResource(id) {
    const next = resources.filter(r => r.id !== id);
    setResources(next); saveKey("resources", next);
  }
  function saveNotes(v) { setNotes(v); saveKey("notes", v); }

  const balance = transactions.reduce((s, t) => s + (t.type === "income" ? t.amount : -t.amount), 0)
    + archives.reduce((s, a) => s + (a.saldo || 0), 0);

  return (
    <div style={S.app}>
      <div style={S.shell}>
        <header style={S.header}>
          <div>
            <div style={S.eyebrow}>MONEY TRACKER · SIMONE</div>
            <h1 style={S.h1}>Registro</h1>
          </div>
          <div style={S.headerBalance}>
            <span style={S.headerBalanceLabel}>saldo</span>
            <span style={{ ...S.headerBalanceNum, color: balance >= 0 ? TOKENS.accent : TOKENS.negative }}>{eur(balance)}</span>
          </div>
        </header>

        <nav style={S.tabs}>
          <TabBtn active={tab==="dashboard"} onClick={()=>setTab("dashboard")} icon="▦" label="Dashboard" />
          <TabBtn active={tab==="transazioni"} onClick={()=>setTab("transazioni")} icon="☰" label="Transazioni" />
          <TabBtn active={tab==="categorie"} onClick={()=>setTab("categorie")} icon="🏷" label="Categorie" />
          <TabBtn active={tab==="investimenti"} onClick={()=>setTab("investimenti")} icon="📖" label="Investimenti" />
          <TabBtn active={tab==="backup"} onClick={()=>setTab("backup")} icon="☁" label="Backup" dot={!sheetUrl || pendingCount > 0} />
        </nav>

        <main style={S.main}>
          {autoClosedYears.length > 0 && (
            <div style={{ ...S.card, padding: "12px 16px", display: "flex", alignItems: "center", gap: 10, background: TOKENS.accentSoft, boxShadow: "none" }}>
              <span style={{ fontSize: 16 }}>🔒</span>
              <div style={{ flex: 1, fontSize: 13.5 }}>
                Ho archiviato in automatico {autoClosedYears.length === 1 ? `l'anno ${autoClosedYears[0]}` : `gli anni ${autoClosedYears.join(", ")}`}: trovi i totali per categoria in Categorie → Confronto per anno.
              </div>
              <button onClick={()=>setAutoClosedYears([])} style={{ border: "none", background: "transparent", color: TOKENS.inkSoft, cursor: "pointer", fontSize: 14 }}>✕</button>
            </div>
          )}
          {tab === "dashboard" && <Dashboard transactions={transactions} categories={categories} catMap={catMap} archives={archives} />}
          {tab === "transazioni" && <Transazioni transactions={transactions} categories={categories} catMap={catMap} onAdd={addTransaction} onRemove={removeTransaction} />}
          {tab === "categorie" && <Categorie categories={categories} transactions={transactions} archives={archives} onAdd={addCategory} onUpdate={updateCategory} onRemove={removeCategory} onCloseYear={closeYear} />}
          {tab === "investimenti" && <Investimenti topics={topics} progress={progress} onToggleTopic={toggleTopic} resources={resources} onAddResource={addResource} onToggleResource={toggleResource} onRemoveResource={removeResource} notes={notes} onSaveNotes={saveNotes} />}
          {tab === "backup" && <Backup sheetUrl={sheetUrl} onSaveUrl={saveSheetUrl} lastSync={lastSync} lastPull={lastPull} syncing={syncing} pulling={pulling} onSyncAll={syncAllNow} onPull={pullFromSheet} count={transactions.length} pendingCount={pendingCount} />}
        </main>

        <button onClick={()=>setQuickAdd(true)} aria-label="Nuova transazione" style={S.fab}>+</button>

        {quickAdd && (
          <div style={S.modalOverlay} onClick={(e)=>{ if (e.target === e.currentTarget) setQuickAdd(false); }}>
            <div style={S.modalCard}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                <h3 style={{ ...S.sectionTitle, margin: 0 }}>Nuova transazione</h3>
                <button onClick={()=>setQuickAdd(false)} style={{ border: "none", background: "transparent", color: TOKENS.inkSoft, cursor: "pointer", fontSize: 18, padding: 4 }}>✕</button>
              </div>
              <TxForm categories={categories} onSubmit={(tx)=>{ addTransaction(tx); setQuickAdd(false); }} />
            </div>
          </div>
        )}

        <p style={S.footer}>Registro v{APP_VERSION} · vive su questo dispositivo, funziona anche offline. Collega il Backup per portare i dati anche su altri dispositivi.</p>
      </div>
    </div>
  );
}

/* ---------- Dashboard ---------- */

function Dashboard({ transactions, categories, catMap, archives }) {
  const [catPeriod, setCatPeriod] = useState("mese");
  const now = new Date();
  const thisMonthKey = now.toISOString().slice(0, 7);
  const thisYear = String(now.getFullYear());

  const totalIncome = transactions.filter(t => t.type === "income").reduce((s, t) => s + t.amount, 0)
    + archives.reduce((s, a) => s + (a.totalIncome || 0), 0);
  const totalExpense = transactions.filter(t => t.type === "expense").reduce((s, t) => s + t.amount, 0)
    + archives.reduce((s, a) => s + (a.totalExpense || 0), 0);

  const budgetAlerts = useMemo(() => {
    return categories.filter(c => c.type === "expense" && c.budget > 0).map(c => {
      const spent = transactions.filter(t => t.type === "expense" && t.categoryId === c.id && monthKey(t.date) === thisMonthKey).reduce((s, t) => s + t.amount, 0);
      return { ...c, spent, pct: spent / c.budget };
    }).filter(c => c.pct >= 0.8).sort((a, b) => b.pct - a.pct);
  }, [categories, transactions, thisMonthKey]);

  const monthly = useMemo(() => {
    const map = {};
    transactions.forEach(t => {
      const k = monthKey(t.date);
      if (!map[k]) map[k] = { key: k, entrate: 0, uscite: 0 };
      if (t.type === "income") map[k].entrate += t.amount; else map[k].uscite += t.amount;
    });
    return Object.values(map).sort((a, b) => a.key.localeCompare(b.key)).map(m => ({
      ...m, label: monthLabel(m.key), saldo: +(m.entrate - m.uscite).toFixed(2),
    }));
  }, [transactions]);

  const catData = useMemo(() => {
    const filtered = transactions.filter(t => {
      if (t.type !== "expense") return false;
      if (catPeriod === "mese") return monthKey(t.date) === thisMonthKey;
      if (catPeriod === "anno") return t.date.slice(0, 4) === thisYear;
      return true;
    });
    const map = {};
    filtered.forEach(t => { map[t.categoryId] = (map[t.categoryId] || 0) + t.amount; });
    return Object.entries(map)
      .map(([id, value]) => ({ id, value: +value.toFixed(2), name: catMap[id]?.name || "Altro", color: catMap[id]?.color || "#999" }))
      .sort((a, b) => b.value - a.value).slice(0, 8);
  }, [transactions, catPeriod, thisMonthKey, thisYear, catMap]);

  if (transactions.length === 0) {
    return (
      <div style={S.card}>
        <p style={{ fontFamily: "'Fraunces', serif", fontSize: 20, margin: "0 0 6px" }}>Il registro è vuoto.</p>
        <p style={{ color: TOKENS.inkSoft, fontSize: 14, lineHeight: 1.6, margin: 0 }}>
          Aggiungi la tua prima transazione dalla scheda "Transazioni": da lì Registro calcola tutto in automatico, andamento mensile, categorie principali e avvisi di budget.
        </p>
      </div>
    );
  }

  return (
    <>
      {budgetAlerts.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {budgetAlerts.map(c => {
            const over = c.pct >= 1;
            return (
              <div key={c.id} style={{ ...S.card, padding: "12px 16px", display: "flex", alignItems: "center", gap: 10, background: over ? TOKENS.negativeSoft : TOKENS.amberSoft, boxShadow: "none" }}>
                <span style={{ fontSize: 16 }}>⚠️</span>
                <div style={{ flex: 1, fontSize: 13.5 }}>
                  <b>{c.icon} {c.name}</b>: {eur(c.spent)} su {eur(c.budget)} {over ? "— budget superato" : "— quasi al limite"} questo mese
                </div>
              </div>
            );
          })}
        </div>
      )}

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px,1fr))", gap: 12 }}>
        <StatCard label="Entrate totali" value={eur(totalIncome)} tone="pos" icon="↗" />
        <StatCard label="Uscite totali" value={eur(totalExpense)} tone="neg" icon="↘" />
        <StatCard label="Transazioni" value={transactions.length} icon="◆" />
      </div>

      <div style={S.card}>
        <h3 style={S.sectionTitle}>Andamento mensile</h3>
        <ResponsiveContainer width="100%" height={220}>
          <AreaChart data={monthly} margin={{ top: 4, right: 4, left: -18, bottom: 0 }}>
            <defs>
              <linearGradient id="gEnt" x1="0" y1="0" x2="0" y2="1">
                <stop offset="5%" stopColor={TOKENS.accent} stopOpacity={0.35}/>
                <stop offset="95%" stopColor={TOKENS.accent} stopOpacity={0}/>
              </linearGradient>
              <linearGradient id="gUsc" x1="0" y1="0" x2="0" y2="1">
                <stop offset="5%" stopColor={TOKENS.negative} stopOpacity={0.3}/>
                <stop offset="95%" stopColor={TOKENS.negative} stopOpacity={0}/>
              </linearGradient>
            </defs>
            <CartesianGrid stroke={TOKENS.line} vertical={false} />
            <XAxis dataKey="label" tick={{ fontSize: 11, fill: TOKENS.inkSoft, fontFamily: "IBM Plex Mono" }} axisLine={{ stroke: TOKENS.line }} tickLine={false} />
            <YAxis tick={{ fontSize: 11, fill: TOKENS.inkSoft, fontFamily: "IBM Plex Mono" }} axisLine={false} tickLine={false} width={46} />
            <Tooltip formatter={(v) => eur(v)} contentStyle={{ fontFamily: "Inter", fontSize: 12, border: `1px solid ${TOKENS.line}`, borderRadius: 8 }} />
            <Area type="monotone" dataKey="entrate" stroke={TOKENS.accent} fill="url(#gEnt)" strokeWidth={2} />
            <Area type="monotone" dataKey="uscite" stroke={TOKENS.negative} fill="url(#gUsc)" strokeWidth={2} />
          </AreaChart>
        </ResponsiveContainer>
        <div style={{ display: "flex", gap: 16, marginTop: 6, fontSize: 12.5, color: TOKENS.inkSoft }}>
          <LegendDot color={TOKENS.accent} label="entrate" />
          <LegendDot color={TOKENS.negative} label="uscite" />
        </div>
      </div>

      <div style={S.card}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
          <h3 style={S.sectionTitle}>Categorie principali</h3>
          <div style={{ display: "flex", gap: 4 }}>
            {[["mese","mese"],["anno","anno"],["sempre","sempre"]].map(([v,l]) => (
              <button key={v} onClick={()=>setCatPeriod(v)} style={{
                fontSize: 11.5, padding: "5px 10px", borderRadius: 999, cursor: "pointer", border: "none",
                background: catPeriod===v?TOKENS.ink:TOKENS.paper2, color: catPeriod===v?TOKENS.paper:TOKENS.inkSoft,
              }}>{l}</button>
            ))}
          </div>
        </div>
        {catData.length === 0 ? (
          <p style={{ color: TOKENS.inkSoft, fontSize: 13.5 }}>Nessuna spesa in questo periodo.</p>
        ) : (
          <div style={{ display: "flex", gap: 20, flexWrap: "wrap", alignItems: "center" }}>
            <ResponsiveContainer width={180} height={180}>
              <PieChart>
                <Pie data={catData} dataKey="value" nameKey="name" innerRadius={48} outerRadius={78} paddingAngle={2}>
                  {catData.map((d, i) => <Cell key={i} fill={d.color} stroke="#fff" strokeWidth={1} />)}
                </Pie>
                <Tooltip formatter={(v) => eur(v)} contentStyle={{ fontFamily: "Inter", fontSize: 12, border: `1px solid ${TOKENS.line}`, borderRadius: 8 }} />
              </PieChart>
            </ResponsiveContainer>
            <div style={{ flex: 1, minWidth: 180, display: "flex", flexDirection: "column", gap: 8 }}>
              {catData.map(d => (
                <div key={d.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 13 }}>
                  <span style={{ display: "flex", alignItems: "center", gap: 7 }}>
                    <span style={{ width: 9, height: 9, borderRadius: 3, background: d.color, display: "inline-block" }} />
                    {d.name}
                  </span>
                  <span style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{eur(d.value)}</span>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>

      <div style={S.card}>
        <h3 style={S.sectionTitle}>Riepilogo mensile</h3>
        <div style={{ display: "flex", flexDirection: "column" }}>
          <div style={{ display: "grid", gridTemplateColumns: "1.3fr 1fr 1fr 1fr", fontSize: 11, letterSpacing: 1, color: TOKENS.inkSoft, fontFamily: "'IBM Plex Mono', monospace", padding: "0 0 8px", borderBottom: `1px solid ${TOKENS.ink}` }}>
            <span>MESE</span><span style={{ textAlign: "right" }}>ENTRATE</span><span style={{ textAlign: "right" }}>USCITE</span><span style={{ textAlign: "right" }}>SALDO</span>
          </div>
          {[...monthly].reverse().map(m => (
            <div key={m.key} style={{ display: "grid", gridTemplateColumns: "1.3fr 1fr 1fr 1fr", fontSize: 13.5, padding: "9px 0", borderBottom: `1px solid ${TOKENS.line}`, fontFamily: "'IBM Plex Mono', monospace" }}>
              <span style={{ fontFamily: "Inter" }}>{m.label}</span>
              <span style={{ textAlign: "right", color: TOKENS.accent }}>{eur(m.entrate)}</span>
              <span style={{ textAlign: "right", color: TOKENS.negative }}>{eur(m.uscite)}</span>
              <span style={{ textAlign: "right", fontWeight: 600, color: m.saldo >= 0 ? TOKENS.accent : TOKENS.negative }}>{eur(m.saldo)}</span>
            </div>
          ))}
        </div>
        {archives.length > 0 && (
          <p style={{ fontSize: 12, color: TOKENS.inkSoft, marginTop: 10 }}>
            Gli anni archiviati ({archives.map(a=>a.year).sort().join(", ")}) non compaiono qui in dettaglio mensile: trovi i loro totali per categoria in Categorie → Confronto per anno.
          </p>
        )}
      </div>
    </>
  );
}

/* ---------- Categorie ---------- */

function Categorie({ categories, transactions, archives, onAdd, onUpdate, onRemove, onCloseYear }) {
  const [showForm, setShowForm] = useState(false);
  const [confirmId, setConfirmId] = useState(null);
  const [yearToClose, setYearToClose] = useState("");

  const liveYears = useMemo(() => {
    const ys = new Set(transactions.map(t => t.date.slice(0, 4)));
    ys.add(String(new Date().getFullYear()));
    return Array.from(ys);
  }, [transactions]);
  const archivedYearSet = useMemo(() => new Set(archives.map(a => a.year)), [archives]);
  const years = useMemo(() => Array.from(new Set([...liveYears, ...archivedYearSet])).sort().reverse(), [liveYears, archivedYearSet]);

  // righe: categorie di spesa attuali + eventuali categorie storiche non più esistenti ma presenti negli archivi
  const rows = useMemo(() => {
    const currentExpenseIds = new Set(categories.filter(c => c.type === "expense").map(c => c.id));
    const allIds = new Set(currentExpenseIds);
    archives.forEach(a => Object.keys(a.categoryTotals || {}).forEach(id => allIds.add(id)));
    return Array.from(allIds).map(id => {
      const live = categories.find(c => c.id === id);
      let fallback = null;
      archives.forEach(a => { if (a.categoryNames && a.categoryNames[id]) fallback = a.categoryNames[id]; });
      return { id, name: live?.name || fallback?.name || "Categoria eliminata", icon: live?.icon || fallback?.icon || "🗂️" };
    });
  }, [categories, archives]);

  function cellValue(rowId, year) {
    if (archivedYearSet.has(year)) {
      const a = archives.find(x => x.year === year);
      return (a && a.categoryTotals[rowId]) || 0;
    }
    return transactions.filter(t => t.categoryId === rowId && t.type === "expense" && t.date.slice(0, 4) === year).reduce((s, t) => s + t.amount, 0);
  }
  function yearTotal(year) {
    if (archivedYearSet.has(year)) {
      const a = archives.find(x => x.year === year);
      return a ? a.totalExpense : 0;
    }
    return transactions.filter(t => t.type === "expense" && t.date.slice(0, 4) === year).reduce((s, t) => s + t.amount, 0);
  }

  const closableYears = liveYears.filter(y => transactions.some(t => t.date.slice(0,4) === y)).sort().reverse();

  return (
    <>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <h3 style={S.sectionTitle}>Le tue categorie</h3>
        <button onClick={()=>setShowForm(s=>!s)} style={btnPrimary}><span>{showForm ? "✕" : "+"}</span> {showForm ? "Chiudi" : "Nuova"}</button>
      </div>
      <p style={{ color: TOKENS.inkSoft, fontSize: 12.5, margin: "-10px 0 4px" }}>Imposta un budget mensile sulle categorie di spesa per ricevere un avviso automatico in dashboard quando ti avvicini al limite.</p>

      {showForm && <CatForm onSubmit={(c)=>{ onAdd(c); setShowForm(false); }} />}

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(170px,1fr))", gap: 8 }}>
        {categories.map(c => (
          <div key={c.id} style={{ ...S.card, padding: 10, display: "flex", flexDirection: "column", gap: 6 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 18 }}>{c.icon}</span>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 13, fontWeight: 500, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{c.name}</div>
                <div style={{ fontSize: 10.5, color: TOKENS.inkSoft, fontFamily: "'IBM Plex Mono', monospace" }}>{c.type === "income" ? "entrata" : "uscita"}</div>
              </div>
              <button onClick={() => confirmId === c.id ? (onRemove(c.id), setConfirmId(null)) : setConfirmId(c.id)}
                style={{ border: "none", background: "transparent", color: confirmId === c.id ? TOKENS.negative : TOKENS.line, cursor: "pointer", flexShrink: 0 }}>
                🗑
              </button>
            </div>
            {c.type === "expense" && (
              <input type="number" min="0" placeholder="budget mensile €" value={c.budget || ""} onChange={e=>onUpdate(c.id, { budget: parseFloat(e.target.value) || 0 })}
                style={{ ...inputStyle, padding: "5px 8px" }} />
            )}
          </div>
        ))}
      </div>

      <div style={S.card}>
        <h3 style={S.sectionTitle}>Confronto per anno</h3>
        <div style={{ overflowX: "auto" }}>
          <div style={{ minWidth: 340 }}>
            <div style={{ display: "grid", gridTemplateColumns: `1.4fr repeat(${years.length}, 1fr)`, fontSize: 11, letterSpacing: 1, color: TOKENS.inkSoft, fontFamily: "'IBM Plex Mono', monospace", padding: "0 0 8px", borderBottom: `1px solid ${TOKENS.ink}` }}>
              <span>CATEGORIA</span>
              {years.map(y => <span key={y} style={{ textAlign: "right" }}>{y}{archivedYearSet.has(y) ? " 🔒" : ""}</span>)}
            </div>
            {rows.map(row => (
              <div key={row.id} style={{ display: "grid", gridTemplateColumns: `1.4fr repeat(${years.length}, 1fr)`, fontSize: 13, padding: "8px 0", borderBottom: `1px solid ${TOKENS.line}` }}>
                <span>{row.icon} {row.name}</span>
                {years.map(y => {
                  const v = cellValue(row.id, y);
                  return <span key={y} style={{ textAlign: "right", fontFamily: "'IBM Plex Mono', monospace", color: v ? TOKENS.ink : TOKENS.line }}>{v ? eur(v) : "—"}</span>;
                })}
              </div>
            ))}
            <div style={{ display: "grid", gridTemplateColumns: `1.4fr repeat(${years.length}, 1fr)`, fontSize: 13.5, fontWeight: 600, padding: "10px 0 0" }}>
              <span>Totale spese</span>
              {years.map(y => <span key={y} style={{ textAlign: "right", fontFamily: "'IBM Plex Mono', monospace", color: TOKENS.negative }}>{eur(yearTotal(y))}</span>)}
            </div>
          </div>
        </div>
        {archives.length > 0 && <p style={{ fontSize: 11.5, color: TOKENS.inkSoft, marginTop: 10 }}>🔒 = anno archiviato: le transazioni di dettaglio sono state eliminate, resta solo il totale per categoria.</p>}
      </div>

      <div style={S.card}>
        <h3 style={S.sectionTitle}>Chiudi un anno</h3>
        <p style={{ color: TOKENS.inkSoft, fontSize: 13.5, lineHeight: 1.6, margin: "0 0 12px" }}>
          Gli anni ormai passati vengono chiusi da soli al primo avvio dell'app nell'anno nuovo: Registro calcola il totale per categoria (la tabella qui sopra), lo conserva per sempre, e cancella le singole transazioni per non appesantire l'app e il foglio di backup. Da qui puoi anche chiudere manualmente un anno in anticipo, se vuoi.
        </p>
        {closableYears.length === 0 ? (
          <p style={{ color: TOKENS.inkSoft, fontSize: 13.5 }}>Non ci sono anni con transazioni da chiudere al momento.</p>
        ) : (
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
            <select value={yearToClose} onChange={e=>setYearToClose(e.target.value)} style={inputStyle}>
              <option value="">Scegli l'anno…</option>
              {closableYears.map(y => <option key={y} value={y}>{y}{y === String(new Date().getFullYear()) ? " (in corso)" : ""}</option>)}
            </select>
            <button onClick={()=>{ if(yearToClose){ onCloseYear(yearToClose); setYearToClose(""); } }} disabled={!yearToClose}
              style={{ ...btnPrimary, background: TOKENS.negative }}>
              🔒 Chiudi e archivia
            </button>
          </div>
        )}
      </div>
    </>
  );
}

        </div>
        <p style={{ color: TOKENS.inkSoft, fontSize: 13.5, lineHeight: 1.6, margin: "6px 0 14px" }}>
          Le transazioni vivono nella memoria di questo browser: se cambi telefono o computer, ripartono da zero finché non "carichi" il backup da qui. Il foglio Google è quindi sia il backup che il modo per portare i dati su un altro dispositivo.
        </p>
        <Field label="URL dell'Apps Script (Web App)">
          <input value={draft} onChange={e=>setDraft(e.target.value)} placeholder="https://script.google.com/macros/s/…/exec" style={inputStyle} />
        </Field>
        <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
          <button onClick={()=>onSaveUrl(draft.trim())} style={btnPrimary}><span>✓</span> Salva collegamento</button>
          {sheetUrl && (
            <button onClick={onSyncAll} disabled={syncing} style={{ ...btnPrimary, background: TOKENS.paper2, color: TOKENS.ink }}>
              <span>⟳</span> {syncing ? "Sincronizzo…" : `Invia tutto al foglio (${count})`}
            </button>
          )}
          {sheetUrl && (
            <button onClick={onPull} disabled={pulling} style={{ ...btnPrimary, background: TOKENS.amberSoft, color: TOKENS.ink }}>
              <span>⬇</span> {pulling ? "Carico…" : "Carica da questo foglio"}
            </button>
          )}
        </div>
        {sheetUrl && (
          <p style={{ fontSize: 12, color: TOKENS.inkSoft, marginTop: 10, fontFamily: "'IBM Plex Mono', monospace" }}>
            ultimo invio: {timeAgo(lastSync)} · ultimo caricamento: {timeAgo(lastPull)}
            {pendingCount > 0 && <span style={{ color: TOKENS.amber }}> · {pendingCount} in attesa di rete</span>}
          </p>
        )}
      </div>

      <div style={S.card}>
        <button onClick={()=>setOpenGuide(o=>!o)} style={{ width: "100%", display: "flex", justifyContent: "space-between", alignItems: "center", background: "none", border: "none", cursor: "pointer", padding: 0 }}>
          <h3 style={{ ...S.sectionTitle, margin: 0 }}>Come creare il collegamento (5 minuti)</h3>
          <span style={{ transform: openGuide ? "rotate(180deg)" : "none", transition: "transform .2s", color: TOKENS.inkSoft, display: "inline-block" }}>▾</span>
        </button>
        {openGuide && (
          <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 10 }}>
            {[
              "Apri Google Sheets e crea un nuovo foglio vuoto (sarà il tuo backup, non serve intestarlo).",
              "Vai su Estensioni → Apps Script. Si apre un editor con del codice di esempio: cancellalo tutto.",
              "Incolla il codice qui sotto (tocca l'icona per copiarlo) e salva (icona a forma di dischetto).",
              "Clicca su Esegui il deployment → Nuovo deployment → tipo Web app.",
              "Imposta \"Esegui come\": Me, e \"Chi ha accesso\": Chiunque. Poi Esegui il deployment.",
              "Google chiederà di autorizzare lo script al primo avvio: sei tu il proprietario, quindi conferma.",
              "Copia l'URL che termina in /exec e incollalo nel campo sopra, su ogni dispositivo su cui apri l'app.",
            ].map((step, i) => (
              <div key={i} style={{ display: "flex", gap: 10, fontSize: 13.5, lineHeight: 1.5 }}>
                <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: TOKENS.amber, flexShrink: 0 }}>{String(i+1).padStart(2,"0")}</span>
                <span>{step}</span>
              </div>
            ))}
            <div style={{ position: "relative", marginTop: 6 }}>
              <pre style={{ background: TOKENS.ink, color: "#E7E3D8", fontSize: 11.5, padding: 14, borderRadius: 10, overflowX: "auto", fontFamily: "'IBM Plex Mono', monospace", lineHeight: 1.6, margin: 0 }}>{APPS_SCRIPT_CODE}</pre>
              <button onClick={copyCode} style={{ position: "absolute", top: 8, right: 8, border: "none", background: "rgba(255,255,255,0.12)", color: "#fff", borderRadius: 6, padding: "5px 8px", cursor: "pointer", display: "flex", alignItems: "center", gap: 4, fontSize: 11 }}>
                <span>{copied ? "✓✓" : "⧉"}</span> {copied ? "copiato" : "copia"}
              </button>
            </div>
            <p style={{ fontSize: 12, color: TOKENS.inkSoft, lineHeight: 1.6, marginTop: 4 }}>
              Nota: l'URL dà lettura e scrittura su quel foglio a chiunque lo conosca — non condividerlo. "Invia tutto al foglio" spedisce le transazioni evitando duplicati; "Carica da questo foglio" fa il percorso inverso e sostituisce i dati locali, utile appena apri l'app su un nuovo dispositivo.
            </p>
            <p style={{ fontSize: 12, color: TOKENS.inkSoft, lineHeight: 1.6, marginTop: 0 }}>
              Per tenerlo leggero nel tempo, ci sono due livelli: lo script crea da solo un tab per anno (2026, 2027…) invece di un unico elenco infinito; e quando in Categorie usi "Chiudi un anno", quel tab con le transazioni sparisce del tutto dal foglio e resta solo una riga di totale per categoria nel tab "Archivio" — permanente, leggerissimo, per sempre.
            </p>
          </div>
        )}
      </div>
    </>
  );
}

/* ---------- pezzi UI condivisi ---------- */

function Field({ label, children }) {
  return (
    <label style={{ display: "flex", flexDirection: "column", gap: 5, fontSize: 12, color: TOKENS.inkSoft }}>
      {label}
      {children}
    </label>
  );
}
function SelectPill({ value, onChange, options }) {
  return (
    <select value={value} onChange={e=>onChange(e.target.value)} style={pillSelectStyle}>
      {options.map(([v,l]) => <option key={v} value={v}>{l}</option>)}
    </select>
  );
}

const inputStyle = { padding: "9px 10px", borderRadius: 8, border: `1px solid ${TOKENS.line}`, fontSize: 16, background: "#fff", color: TOKENS.ink, width: "100%" };
const pillSelectStyle = { padding: "7px 10px", borderRadius: 999, border: "none", fontSize: 16, background: TOKENS.paper2, color: TOKENS.inkSoft };
const btnPrimary = { display: "flex", alignItems: "center", gap: 6, padding: "9px 14px", borderRadius: 8, border: "none", background: TOKENS.ink, color: TOKENS.paper, fontSize: 13.5, fontWeight: 500, cursor: "pointer" };

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
</html>
